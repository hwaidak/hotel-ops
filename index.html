<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9EEE8; --line:#D5DCD4; --fg:#16201C; --muted:#56635D;
  --accent:#1E5A48; --accent-fg:#FFFFFF; --accent-soft:#D9E9E1; --brass:#9C7020; --brass-soft:#F3E7CD;
  --ok:#2A7A4B; --ok-soft:#DBEFE2; --warn:#A86300; --warn-soft:#FAEACD; --bad:#B0382E; --bad-soft:#F7DDD9; --info:#2D5B9A; --info-soft:#DDE6F4;
  --shadow:0 10px 30px rgba(22,32,28,.14);
  --f-display:"Readex Pro","IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1D2824; --line:#2B3833; --fg:#E5ECE8; --muted:#98A69F;
  --accent:#5DB592; --accent-fg:#08130F; --accent-soft:#1A372D; --brass:#D6A64B; --brass-soft:#382D16;
  --ok:#5BC587; --ok-soft:#163224; --warn:#E3A13F; --warn-soft:#38290F; --bad:#EE786C; --bad-soft:#3B1C19; --info:#7FA7E3; --info-soft:#192940;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand h1{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brass);color:var(--surface);font-size:11px;font-weight:700;display:inline-grid;place-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:14px}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.toolbar .field{width:auto}
.toolbar .search{flex:1 1 200px;max-width:320px}
.toolbar select{flex:0 1 160px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none;font-size:13px}
.chk input{accent-color:var(--accent);width:16px;height:16px}

main{padding-block:0 40px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--surface-2);border-radius:10px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.col.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.col.nodrop{opacity:.55}
.colhead{display:flex;align-items:center;gap:8px;padding:2px 4px 6px;font-weight:600}
.colhead .dot{width:9px;height:9px;border-radius:50%}
.colhead .cnt{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-inline-start:3px solid var(--line)}
.card:hover{border-color:var(--accent)}
.card[data-pri="urgent"]{border-inline-start-color:var(--bad)}
.card[data-pri="high"]{border-inline-start-color:var(--warn)}
.card[data-pri="normal"]{border-inline-start-color:var(--info)}
.card.dragging{opacity:.4}
.card .t{font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:12px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.brass{background:var(--brass-soft);color:var(--brass)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.av{width:24px;height:24px;border-radius:50%;flex:none;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:600}
.av.lg{width:34px;height:34px;font-size:14px}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0}
.who span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-col{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:8px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface)}
th.sort{cursor:pointer} th.sort:hover{color:var(--fg)}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
td .t{font-weight:600}
td .field{width:auto}

.h2{font-family:var(--f-display);font-size:18px;font-weight:600;margin:20px 0 10px}
.sub{color:var(--muted);margin:-4px 0 14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.alert b{color:var(--bad)} .kpi.wait b{color:var(--brass)}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mnav{display:flex;align-items:center;gap:6px} .mnav h2{margin:0 6px;font-size:18px;min-width:150px;text-align:center}
.mnav .btn[disabled]{opacity:.35;cursor:default}
.mlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)} .mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.mwarn{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.mwarn button{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calh{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px;font-weight:600}
.calc{min-width:0;height:80px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;text-align:start;font:inherit;color:inherit;cursor:pointer;position:relative;overflow:hidden}
.calc:hover{border-color:var(--accent)} .calc.blank{visibility:hidden} .calc.future{background:transparent;cursor:default;opacity:.55}
.calc .dn{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:4px}
.calc .dn small{font-size:10.5px;font-weight:600;border-radius:999px;padding:0 6px;line-height:17px}
.calc .ct{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc .cbar{margin-top:auto;height:4px;flex:none;border-radius:2px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden;display:block} .calc .cbar i{display:block;height:4px;background:var(--ok)}
.calc.open{border-color:var(--warn);background:var(--warn-soft)} .calc.open .dn small{background:var(--warn);color:#fff}
.calc.late{border-color:var(--bad);background:var(--bad-soft)} .calc.late .dn small{background:var(--bad);color:#fff}
.calc.closed{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))} .calc.closed .dn small{background:var(--ok-soft);color:var(--ok)}
.calc.today{box-shadow:0 0 0 2px var(--accent) inset}
.calc.sel{outline:3px solid var(--accent);outline-offset:1px}
.dpanel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.dpanel.open{border-inline-start-color:var(--warn)} .dpanel.late{border-inline-start-color:var(--bad)} .dpanel.closed{border-inline-start-color:var(--ok)}
.dphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .dphead h3{margin:0;font-size:17px}
.dpstats{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-inline-start:auto;font-size:12.5px;color:var(--muted)} .dpstats b{font-size:17px;margin-inline-end:4px;font-variant-numeric:tabular-nums}
.dpstats .meter{width:140px;height:6px}
.dpcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dpcol{background:var(--surface-2);border-radius:10px;padding:8px;display:grid;gap:6px;align-content:start;min-width:0}
.dpcol h4{margin:0 2px 2px;font-size:13px;display:flex;justify-content:space-between}
.dpcard{display:grid;gap:4px;min-width:0;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
.dpcard:hover{border-color:var(--accent)} .dpcard .ht{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpcard .dm{display:flex;align-items:center;gap:6px;min-width:0;font-size:11.5px;color:var(--muted)} .dpcard .dm .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpcard .av{width:18px;height:18px;font-size:9.5px;flex:none}
.dpalert{font-size:13px;font-weight:600} .dpalert.open{color:var(--warn)} .dpalert.late{color:var(--bad)} .dpalert.closed{color:var(--ok)} .dpalert.empty{color:var(--muted);font-weight:500}
@media (max-width:640px){ .calc{height:58px;padding:5px} .calc .ct{display:none} .calc .dn{font-size:13px;flex-direction:column;align-items:flex-start} .cal{gap:4px} .dpcols{grid-template-columns:minmax(0,1fr)} .mnav h2{min-width:0;font-size:16px} }
#netBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:var(--warn);color:#fff;font-weight:700;font-size:13px;padding:7px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center}
#netBar[hidden]{display:none}
#netBar button{background:#fff;color:var(--warn);border:0;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.daybanner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;border-radius:10px;padding:9px 14px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:13.5px}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:60px;display:flex}
.meter i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}

.appr{display:grid;gap:10px}
.apcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.apcard .t{font-weight:600;font-size:15px;cursor:pointer}
.apcard .t:hover{color:var(--accent)}
.apcard .actions .field{width:auto}
@media (max-width:600px){.apcard{grid-template-columns:1fr}}

.gate{max-width:440px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:14px}
.gate h2{font-family:var(--f-display);margin:0;font-size:20px}
.gate p{margin:0;color:var(--muted)}
label.lb{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
label.lb .field{color:var(--fg);font-size:14px}
.err{color:var(--bad);font-size:13px;margin:0}
.authswitch{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:9px}
.authswitch button{flex:1;border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.authswitch button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.overlay{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40;display:flex;justify-content:flex-start}
.sheet{background:var(--bg);width:min(980px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheethead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:12px;z-index:2}
.sheethead h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;margin-inline-end:auto}
.sheetbody{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;padding-block:16px}
@media (max-width:760px){.sheetbody{grid-template-columns:1fr}}
.form{display:grid;gap:12px;align-content:start}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.form .two{grid-template-columns:1fr}}
textarea.field{resize:vertical;min-height:90px;line-height:1.6}
input.title{font-size:17px;font-weight:600;font-family:var(--f-display)}
.side{display:grid;gap:12px;align-content:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.box h4{margin:0;font-size:12px;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:end;font-variant-numeric:tabular-nums}
.statusline{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.note{border-radius:8px;padding:10px 12px;font-size:13px}
.note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--info-soft);color:var(--info)}
.comments{display:grid;gap:10px;max-height:340px;overflow-y:auto}
.cm{display:grid;grid-template-columns:auto 1fr;gap:8px}
.cm .b{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .h{font-size:12px;color:var(--muted);margin-bottom:2px}
.hist{display:grid;gap:8px;font-size:12.5px;max-height:260px;overflow-y:auto}
.hist div{display:grid;grid-template-columns:auto 1fr;gap:8px;color:var(--muted)}
.hist b{color:var(--fg);font-weight:500}
.hist .dt{width:7px;height:7px;border-radius:50%;background:var(--line);margin-top:7px}

.dlg{position:fixed;inset:0;z-index:60;background:rgba(10,16,14,.5);display:grid;place-items:center;padding:16px}
.dlg .in{background:var(--surface);border-radius:12px;padding:20px;width:min(440px,100%);display:grid;gap:12px;box-shadow:var(--shadow)}
.dlg h4{margin:0;font-family:var(--f-display);font-size:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:80;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}

.depchips{display:flex;gap:6px;flex-wrap:wrap}
.depchips .chip{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px}
.depchips button{border:0;background:none;cursor:pointer;color:var(--bad);padding:0;font-size:14px;line-height:1}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.rolepill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:600}
@media (max-width:600px){.brand small{display:none}.me .nm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;background:var(--surface);cursor:pointer;width:100%;text-align:start}
.hit:hover{border-color:var(--accent)}
.hit .ht{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
#langBtn{font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand"><div class="mark">H</div><div><h1 id="appName">Hotel Operations</h1><small id="appTag"></small></div></div>
    <div class="me" id="meBox"></div>
    <button class="btn ghost sm" id="langBtn" type="button">العربية</button>
    <button class="btn primary" id="newBtn" hidden>+ New task</button>
    <button class="btn ghost sm" id="outBtn" hidden>Log out</button>
  </div>

/* ================= roles & permissions (mirror of the server rules) ================= */
const myRole=()=>S.me&&S.me.active&&S.me.role!=="pending"?S.me.role:null;
const isAdmin=()=>myRole()==="admin"; const isGM=()=>myRole()==="gm"; const isSup=()=>myRole()==="supervisor"; const isManager=()=>myRole()==="manager";
const isMember=()=>!!myRole(); const myDept=()=>(S.me&&S.me.dept)||""; const myHotel=()=>(S.me&&S.me.hotel)||"";
const canManageMembers=()=>isAdmin()||isGM()||isSup()||(isManager()&&!!myDept());
const assignableRoles=()=>isAdmin()?ROLE_KEYS:isGM()?["manager","supervisor","staff"]:["staff"];
const isDeptBoss=id=>{ const p=S.profiles[id]; return isManager()&&!!myDept()&&!!p&&p.dept===myDept()&&p.hotel===myHotel(); };
const nameOf=id=>!id?t("unassigned"):(S.profiles[id]&&S.profiles[id].full_name)||t("someone");
const deptL=c=>{ const r=S.deptRows.find(d=>d.name===c); return r?(LANG==="ar"?r.label_ar:r.label_en)||c:(c||""); };
const hotelL=c=>{ const r=S.hotelRows.find(h=>h.code===c); return r?(LANG==="ar"?r.name_ar:r.name_en):(c||""); };
function isAbove(boss,emp){ if(!boss||!emp) return false; let cur=S.profiles[emp], n=0; while(cur&&cur.reports_to&&n<25){ if(cur.reports_to===boss) return true; cur=S.profiles[cur.reports_to]; n++; } return false; }
const activeMembers=()=>Object.values(S.profiles).filter(p=>p.active&&p.role!=="pending").map(p=>p.id).sort((a,b)=>nameOf(a).localeCompare(nameOf(b),LANG));
const subordinates=()=>(isManager()||isSup()||isGM()||isAdmin())?activeMembers().filter(id=>isAbove(S.uid,id)):[];
function canAssignTo(id,hotel){ const p=S.profiles[id]; if(!p||!p.active||p.role==="pending"||p.role==="admin") return false; if(isAdmin()) return !hotel||p.hotel===hotel;
  if(p.hotel!==myHotel()) return false; if(isGM()||isSup()||id===S.uid) return true;
  return isManager()&&(isAbove(S.uid,id)||(!!p.dept&&p.dept===myDept())||["manager","supervisor","gm"].includes(p.role)); }
const canApprove=x=>isAdmin()||(x.hotel===myHotel()&&(isGM()||isAbove(S.uid,x.assignee)||(!!x.assignee&&isDeptBoss(x.assignee))||(x.reporter===S.uid&&!!x.assignee&&x.assignee!==S.uid)||(!!x.assignee&&x.assignee!==S.uid&&(x.prevAssignees||[]).includes(S.uid))));
const canEditFields=x=>!x||isAdmin()||(isGM()&&x.hotel===myHotel())||x.reporter===S.uid;
const heads=hotel=>activeMembers().filter(id=>{ const p=S.profiles[id]; return p.role==="admin"||(["manager","supervisor","gm"].includes(p.role)&&p.hotel===hotel); });
const colorOf=id=>{ let h=0; for(const c of String(id||"x")) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 38% 42%)`; };
const av=(id,lg)=>`<span class="av${lg?" lg":""}" style="background:${colorOf(id)}">${esc((nameOf(id).trim().charAt(0))||"?")}</span>`;
const who=(id,lg)=>`<span class="who">${id?av(id,lg):`<span class="av${lg?" lg":""}" style="background:var(--line)"></span>`}<span class="n">${esc(nameOf(id))}</span></span>`;
const opt=(v,l,sel)=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(l)}</option>`;

function normTask(r){ return {id:r.id,num:r.id,title:r.title,desc:r.descr,dept:r.dept,hotel:r.hotel,location:r.location,assignee:r.assignee,reporter:r.reporter,
  priority:r.priority,status:r.status,due:ms(r.due),shift:r.shift,estimate:r.estimate,needsApproval:r.needs_approval,rejections:r.rejections,
  prevAssignees:r.prev_assignees||[], noTransfer:!!r.no_transfer,

async function loadProfiles(){ const {data,error}=await S.sb.from("profiles").select("*"); if(error) throw error; const m={}; data.forEach(p=>m[p.id]=p); S.profiles=m; S.me=m[S.uid]||null; }
async function loadMeta(){ const [d,h,s]=await Promise.all([S.sb.from("departments").select("name,label_en,label_ar,sort").order("sort").order("name"),
  S.sb.from("hotels").select("*").order("sort"),S.sb.from("settings").select("*").eq("id",1).maybeSingle()]);
  if(!d.error) S.deptRows=d.data; if(!h.error) S.hotelRows=h.data; if(!s.error&&s.data) S.settings=s.data; }

async function loadThread(id){ const [c,e]=await Promise.all([S.sb.from("task_comments").select("*").eq("task_id",id).order("created_at"),S.sb.from("task_events").select("*").eq("task_id",id).order("created_at")]);
  if(S.openId!==id) return; S.thread={comments:c.data||[],events:e.data||[]}; renderSheetSide(); }
async function loadAll(){ try{ await loadProfiles(); await loadMeta(); await loadTasks(); S.ready=true; render(); subscribe(); if(S.pendingOpen&&isMember()){ const id=S.pendingOpen; S.pendingOpen=null; try{history.replaceState(null,"","#"+S.view);}catch(e){} if(T(id)) openTask(id); else toast(t("tGone")); } }
  catch(e){ netState(false); clearTimeout(S.retryT); S.retryT=setTimeout(()=>{ if(!S.ready) loadAll(); },6000); $("#main").innerHTML=`<div class="gate"><h2>${esc(t("loadErr"))}</h2><p>${esc(errText(e))}</p><div><button class="btn" onclick="location.reload()">${esc(t("retry"))}</button></div></div>`; } }
let chan=null, timers={};
function later(k,fn){ clearTimeout(timers[k]); timers[k]=setTimeout(fn,350); }
function subscribe(){ if(chan) return;
  chan=S.sb.channel("ops")
   .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},()=>later("t",async()=>{await loadTasks().catch(()=>{});render();}))
   .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>later("p",async()=>{const was=isMember();await loadProfiles().catch(()=>{}); if(!was&&isMember()){await loadMeta();await loadTasks().catch(()=>{});} S.builtView=null; render();}))
   .on("postgres_changes",{event:"*",schema:"public",table:"departments"},()=>later("d",async()=>{await loadMeta().catch(()=>{}); if(S.view!=="depts") S.builtView=null; render();}))
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"task_comments"},p=>{ if(p.new&&p.new.task_id===S.openId) later("c",()=>loadThread(S.openId)); })
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"task_events"},p=>{ if(p.new&&p.new.task_id===S.openId) later("c",()=>loadThread(S.openId)); })
   .subscribe();
  if(!S.pollOn){ S.pollOn=true; setInterval(async()=>{ if(document.hidden) return; try{ const was=isMember(); await loadProfiles(); if(isMember()){ if(!was) await loadMeta(); await loadTasks(); } netState(true); render(); }catch(e){ netState(false); heal("poll"); } },60000); }
}
function netState(ok){ let b=$("#netBar"); if(ok){ if(b) b.hidden=true; return; }
  if(!b){ b=document.createElement("div"); b.id="netBar"; document.body.appendChild(b); }
  b.innerHTML=`<span>${esc(t("netLost"))}</span><button type="button">${esc(t("netRetry"))}</button>`; b.hidden=false; b.querySelector("button").onclick=()=>heal("manual",true); }
let healing=false, lastHeal=0;
async function heal(why,force){ if(!S.sb||healing) return; if(!force&&Date.now()-lastHeal<8000) return; healing=true; lastHeal=Date.now();
  try{
    const {data,error}=await S.sb.auth.getSession(); if(error) throw error;
    let ses=data.session;
    if(ses&&ses.expires_at&&ses.expires_at*1000-Date.now()<60000){ const r=await S.sb.auth.refreshSession(); if(r.error) throw r.error; ses=r.data.session; }
    if(!ses){ if(S.session){ S.session=null; S.uid=null; S.ready=false; render(); } netState(true); return; }
    S.session=ses;
    if(!S.ready){ await loadAll(); }
    else { const was=isMember(); await loadProfiles(); if(isMember()){ if(!was) await loadMeta(); await loadTasks(); } render(); }
    if(chan&&chan.state!=="joined"&&chan.state!=="joining"){ try{ S.sb.removeChannel(chan); }catch(e){} chan=null; subscribe(); }
    netState(true);
  }catch(e){ netState(false); clearTimeout(S.healT); S.healT=setTimeout(()=>heal("retry",true),10000); }
  finally{ healing=false; } }

  <div class="actions" style="justify-content:flex-end"><button class="btn" data-x>${esc(t("cancel"))}</button><button class="btn ${o.danger?"bad":"primary"}" data-ok>${esc(o.okText||t("ok"))}</button></div></div>`;

/* ================= days ================= */
const dayKey=ms_=>{ const d=new Date(ms_); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function dayGroups(list){ const today=dayKey(Date.now()); const g={}; g[today]=[];
  list.forEach(x=>{ const k=dayKey(x.createdAt||Date.now()); (g[k]=g[k]||[]).push(x); });
  return Object.keys(g).sort().reverse().map(k=>{ const ts=g[k]; const done=ts.filter(x=>x.status==="done").length, nw=ts.filter(x=>x.status==="todo").length;
    const open=ts.length-done>0; return {k,ts,total:ts.length,done,nw,pend:ts.length-done-nw,open,past:k<today,today:k===today}; }); }
function dayLabel(k){ const [y,mo,d]=k.split("-").map(Number); const dt=new Date(y,mo-1,d); const today=dayKey(Date.now()); const yd=dayKey(Date.now()-864e5);
  return {main:new Intl.DateTimeFormat(loc(),{weekday:"long",day:"numeric",month:"long"}).format(dt),tag:k===today?t("dyToday"):k===yd?t("dyYesterday"):""}; }
const monthKey=k=>k.slice(0,7);
const monthName=mk=>{ const [y,m]=mk.split("-").map(Number); return new Intl.DateTimeFormat(loc(),{month:"long",year:"numeric"}).format(new Date(y,m-1,1)); };
const shiftMonth=(mk,n)=>{ const [y,m]=mk.split("-").map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
function dayBanner(){ const od=dayGroups(S.tasks).filter(g=>g.open&&g.past); if(!od.length) return "";
  const n=od.reduce((a,g)=>a+g.total-g.done,0); return `<div class="daybanner"><span>${esc(t("dyBanner",{d:od.length,n}))}</span><button class="btn sm" id="goDays">${esc(t("dyGo"))}</button></div>`; }
function bindBanner(){ const b=$("#goDays"); if(b) b.onclick=()=>{ const od=dayGroups(S.tasks).filter(g=>g.open&&g.past); if(od.length){ const k=od[od.length-1].k; S.dayMonth=monthKey(k); S.daySel=k; } setView("days"); }; }
function daysHTML(){ const todayK=dayKey(Date.now()), curM=monthKey(todayK);
  const gs=dayGroups(filtered()); const G={}; gs.forEach(g=>G[g.k]=g);
  if(!S.dayMonth) S.dayMonth=curM; if(S.dayMonth>curM) S.dayMonth=curM;
  const mk=S.dayMonth; if(!S.daySel||monthKey(S.daySel)!==mk) S.daySel=mk===curM?todayK:null;
  // older months that still have unfinished tasks
  const oldOpen={}; gs.forEach(g=>{ const m=monthKey(g.k); if(m<curM&&g.open) oldOpen[m]=(oldOpen[m]||0)+g.total-g.done; });
  const firstM=gs.length?monthKey(gs[gs.length-1].k):curM;
  const [y,m]=mk.split("-").map(Number); const days=new Date(y,m,0).getDate(); const lead=(new Date(y,m-1,1).getDay()+1)%7; // week starts Saturday
  const wk=[...Array(7)].map((_,i)=>new Intl.DateTimeFormat(loc(),{weekday:"short"}).format(new Date(2024,0,6+i)));
  const cls=g=>!g||!g.total?"":!g.open?"closed":g.past?"late":"open";
  let cells=wk.map(w=>`<div class="calh">${esc(w)}</div>`).join("")+`<div class="calc blank"></div>`.repeat(lead);
  for(let d=1;d<=days;d++){ const k=mk+"-"+String(d).padStart(2,"0"); const g=G[k]; const c=cls(g); const fut=k>todayK;
    const left=g?g.total-g.done:0;
    cells+=`<button type="button" class="calc ${c}${k===todayK?" today":""}${k===S.daySel?" sel":""}${fut?" future":""}" data-day="${k}"${fut?" disabled":""}>
      <span class="dn">${d}${g&&g.total?`<small>${c==="closed"?"✓":left}</small>`:""}</span>
      ${g&&g.total?`<span class="ct">${esc(t("dyCellDone",{d:g.done,n:g.total}))}</span><span class="cbar"><i style="width:${g.done/g.total*100}%"></i></span>`:""}</button>`; }
  const mw=Object.keys(oldOpen).sort();
  const head=`<div class="mbar"><div class="mnav"><button class="btn sm" data-mstep="-1"${mk<=firstM?" disabled":""} aria-label="${esc(t("dyPrevM"))}">${LANG==="ar"?"→":"←"}</button><h2>${esc(monthName(mk))}</h2><button class="btn sm" data-mstep="1"${mk>=curM?" disabled":""} aria-label="${esc(t("dyNextM"))}">${LANG==="ar"?"←":"→"}</button>${mk!==curM?`<button class="btn sm primary" data-mstep="0">${esc(t("dyThisM"))}</button>`:`<span class="chip info">${esc(t("dyThisM"))}</span>`}</div>
    <div class="mlegend"><span><i style="background:var(--warn)"></i>${esc(t("dyPillOpen"))}</span><span><i style="background:var(--bad)"></i>${esc(t("dyPillLate"))}</span><span><i style="background:var(--ok)"></i>${esc(t("dyPillClosed"))}</span></div></div>
   ${mw.length?`<div class="mwarn">${mw.map(x=>`<button type="button" data-mgo="${x}">⚠ ${esc(t("dyOldMonth",{m:monthName(x),n:oldOpen[x]}))}</button>`).join("")}</div>`:""}`;
  return head+`<div class="cal">${cells}</div>`+dayPanel(S.daySel?G[S.daySel]||{k:S.daySel,ts:[],total:0,done:0,nw:0,pend:0,open:false,past:S.daySel<todayK}:null); }
function dayPanel(g){ if(!g) return `<div class="dpanel"><div class="dpalert empty">${esc(t("dyPick"))}</div></div>`;
  const L=dayLabel(g.k); const c=!g.total?"empty":!g.open?"closed":g.past?"late":"open"; const pct=g.total?Math.round(g.done/g.total*100):0;
  const card=x=>`<button type="button" class="dpcard" data-id="${x.id}" title="${esc(x.title)}"><span class="ht">${esc(x.title)}</span><span class="dm"><span class="mono">${esc(keyOf(x))}</span><span style="color:${ST[x.status].c};font-weight:600">● ${esc(stL(x.status))}</span>${x.assignee?`<span style="flex:1"></span>${av(x.assignee)}<span class="nm">${esc(nameOf(x.assignee))}</span>`:""}</span></button>`;
  const col=(title,color,list)=>`<div class="dpcol"><h4><span style="color:${color}">${esc(title)}</span><span class="num">${list.length}</span></h4>${list.map(card).join("")||`<div class="meta" style="padding:6px 4px">—</div>`}</div>`;
  const nw=g.ts.filter(x=>x.status==="todo"), pend=g.ts.filter(x=>x.status!=="todo"&&x.status!=="done"), dn=g.ts.filter(x=>x.status==="done");
  return `<section class="dpanel ${c==="empty"?"":c}"><div class="dphead"><h3>${esc(L.main)}</h3>${L.tag?`<span class="chip info">${esc(L.tag)}</span>`:""}
     <span class="dpalert ${c}">${esc(c==="empty"?t("dyEmpty"):c==="closed"?"✓ "+t("dyClosed"):"⚠ "+t(c==="late"?"dyLate":"dyOpen",{n:g.total-g.done}))}</span>
     ${g.total?`<div class="dpstats"><span><b>${g.total}</b>${esc(t("dyTotal"))}</span><span><b style="color:var(--muted)">${g.nw}</b>${esc(t("dyNew"))}</span><span><b style="color:var(--warn)">${g.pend}</b>${esc(t("dyPending"))}</span><span><b style="color:var(--ok)">${g.done}</b>${esc(t("dyDone"))}</span><div class="meter"><i style="width:${pct}%;background:var(--ok)"></i></div><span class="num">${pct}%</span></div>`:""}</div>
   ${g.total?`<div class="dpcols">${col(t("dyNew"),"var(--muted)",nw)}${col(t("dyPending"),"var(--warn)",pend)}${col(t("dyDone"),"var(--ok)",dn)}</div>`:""}</section>`; }
function bindDays(){ const m=$("#main");
  m.querySelectorAll(".dpcard").forEach(b=>b.onclick=()=>openTask(b.dataset.id));
  m.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ if(b.disabled) return; S.daySel=b.dataset.day; renderMain(); });
  m.querySelectorAll("[data-mstep]").forEach(b=>b.onclick=()=>{ const n=+b.dataset.mstep; const cur=monthKey(dayKey(Date.now())); S.dayMonth=n===0?cur:shiftMonth(S.dayMonth,n); S.daySel=null; renderMain(); });

function statsHTML(rows){
  const by={}; (rows||[]).forEach(r=>by[r.user_id]=r);

  const sum=k=>R.reduce((a,r)=>a+(Number(r[k])||0),0);
  const wavg=(k,wk)=>{ let n=0,s=0; R.forEach(r=>{ if(r[k]!=null){ const w=Math.max(1,Number(r[wk])||1); s+=Number(r[k])*w; n+=w; } }); return n?s/n*1000:null; };

   <div class="kpi"><b>${sum("done_count")}</b><span>${esc(t("kDone"))}</span></div><div class="kpi"><b>${wd?Math.round(ot/wd*100)+"%":"—"}</b><span>${esc(t("kOnTime"))}</span></div>
   <div class="kpi"><b style="font-size:19px">${dur(wavg("avg_work_sec","done_count"))}</b><span>${esc(t("kAvg"))}</span></div></div>
  <div class="grid2"><div><h3 class="h2" style="font-size:16px">${esc(t("byPerson"))}</h3><div class="panel tablewrap"><table><thead><tr><th>${esc(t("tName"))}</th><th>${esc(t("cOpen"))}</th><th>${esc(t("cDone"))}</th><th>${esc(t("cLate"))}</th><th>${esc(t("cOnTime"))}</th><th>${esc(t("cAvg"))}</th><th>${esc(t("cStart"))}</th><th>${esc(t("cRej"))}</th></tr></thead><tbody>
  ${R.map(r=>{const p=S.profiles[r.id]; return `<tr style="${r.id===S.uid?"background:var(--accent-soft)":""}"><td>${who(r.id)}${p?`<div class="meta">${esc(deptL(p.dept))}${isAdmin()&&p.hotel?" · "+esc(hotelL(p.hotel)):""}${p.reports_to?" · "+esc(t("reportsTo"))+" "+esc(nameOf(p.reports_to)):""}</div>`:""}</td>
   <td class="num">${r.open_count}</td><td class="num">${r.done_count}</td><td class="num" style="${r.late_count?"color:var(--bad);font-weight:600":""}">${r.late_count}</td>
   <td class="num">${r.with_due?Math.round(r.on_time/r.with_due*100)+"%":"—"}</td><td class="num">${r.avg_work_sec!=null?dur(r.avg_work_sec*1000):"—"}</td><td class="num">${r.avg_start_sec!=null?dur(r.avg_start_sec*1000):"—"}</td><td class="num">${r.rejections}</td></tr>`;}).join("")||`<tr><td colspan="8" class="meta" style="text-align:center;padding:24px">${esc(t("noData"))}</td></tr>`}</tbody></table></div></div>

  applyLangChrome();
  const h=(location.hash||"").slice(1); if(["board","days","list","approvals","reports","team","depts"].includes(h)) S.view=h; { const mt=/^t=(\d+)$/.exec(h); if(mt) S.pendingOpen=+mt[1]; }
  if(!window.supabase||!CFG.SUPABASE_URL||CFG.SUPABASE_URL.includes("YOUR-PROJECT")){ $("#main").innerHTML=`<div class="gate"><h2>${esc(t("cfgTitle"))}</h2><p>${esc(t("cfgTxt"))}</p></div>`; return; }
  const tfetch=(u,o={})=>{ const c=new AbortController(); const tm=setTimeout(()=>c.abort(),20000); if(o.signal){ if(o.signal.aborted) c.abort(); else o.signal.addEventListener("abort",()=>c.abort()); } return fetch(u,Object.assign({},o,{signal:c.signal})).finally(()=>clearTimeout(tm)); };
  S.sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},global:{fetch:tfetch},realtime:{heartbeatIntervalMs:15000}});
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) heal("visible"); });
  window.addEventListener("online",()=>heal("online"));
  window.addEventListener("focus",()=>heal("focus"));
  loadMeta().then(()=>{ if(!S.session) render(); });
  S.sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){ S.authMode="reset"; S.session=null; setTimeout(render,0); return; }
    if(S.authMode==="reset"&&ev!=="SIGNED_OUT") return;
    const prev=S.uid; S.session=session; S.uid=session?session.user.id:null;
    if(!session){ S.ready=false; setTimeout(render,0); return; }
    if(prev!==S.uid||!S.ready) setTimeout(loadAll,0); });
  setInterval(()=>{ if(S.ready&&isMember()&&S.view!=="team"&&S.view!=="reports"&&!document.querySelector(".dlg")&&!S.dragId){ renderMain(); renderSheetSide(); } },60000);
}
boot();
})();
</script>
</body>
