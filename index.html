   <div class="sheetbody wrap"><form class="form" id="tf">
     ${par?`<div class="note info">${esc(t("partOf"))} <b class="mono">${esc(keyOf(par))}</b>: ${esc(par.title)} <button type="button" class="link" id="openPar">${esc(t("open"))}</button></div>`:""}
     <input class="field title" id="fTitle" placeholder="${esc(t("titlePh"))}" value="${esc(x?x.title:"")}" maxlength="140" required${dis}>
     <textarea class="field" id="fDesc" placeholder="${esc(t("descPh"))}"${dis}>${esc(x?x.desc:"")}</textarea>
     <div class="two">
      ${isAdmin()&&!x&&!par?`<label class="lb">${esc(t("hotel"))}<select class="field" id="fH" required>${hotelOpts(hotel,t("chooseHotel"))}</select></label>`:(isAdmin()?`<label class="lb">${esc(t("hotel"))}<input class="field" value="${esc(hotelL(hotel))}" disabled></label>`:"")}
      <label class="lb">${esc(t("dept"))}<select class="field" id="fD"${dis}>${deptOpts(x?x.dept:(par?par.dept:myDept()),"—")}</select></label>
      <label class="lb">${esc(t("location"))}<input class="field" id="fLoc" placeholder="${esc(t("locationPh"))}" value="${esc(x?x.location:"")}" maxlength="60"${dis}></label>
      <label class="lb">${esc(t("assignee"))}<select class="field" id="fA"${dis}>${assigneeOptions(hotel,cur,par,!x,x?x.dept:(par?par.dept:myDept()))}</select></label>
      <label class="lb">${esc(t("priority"))}<select class="field" id="fP"${dis}>${Object.keys(PRI).map(k=>opt(k,priL(k),x?x.priority:"normal")).join("")}</select></label>
      <label class="lb">${esc(t("dueAt"))}<input class="field" type="datetime-local" id="fDue" value="${toLocal(x&&x.due)}"${dis}></label>
      <label class="lb">${esc(t("shift"))}<select class="field" id="fSh"${dis}>${SHIFTS.map(k=>opt(k,t("sh_"+k),x?x.shift:"")).join("")}</select></label>
      <label class="lb">${esc(t("estimate"))}<input class="field num" type="number" min="0" step="0.25" id="fEst" value="${x&&x.estimate!=null?x.estimate:""}"${dis}></label>
      <label class="chk" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="fNA"${(!x||x.needsApproval!==false)?" checked":""}${dis}> ${esc(t("needsAppr"))}</label>
      <label class="chk" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="fNT"${x&&x.noTransfer?" checked":""}${dis}> ${esc(t("noTransfer"))}</label></div>
      ${(isSup()||isManager()||isGM()||isAdmin())?`<div class="proofsel"><span>${esc(t("pfSetL"))}</span><div class="seg"><button type="button" data-pf="1" aria-selected="${!x||x.proofRequired!==false}"${dis}>📎 ${esc(t("pfReq"))}</button><button type="button" data-pf="0" aria-selected="${!!x&&x.proofRequired===false}"${dis}>${esc(t("pfOpt"))}</button></div><input type="hidden" id="fPF" value="${!x||x.proofRequired!==false?"1":"0"}"></div>`:""}
     ${ed?`<div class="actions"><button class="btn primary" type="submit" id="saveT">${esc(t(x?"saveChanges":"create"))}</button>${x?"":`<button class="btn" type="button" id="cancelT">${esc(t("cancel"))}</button>`}</div>`:`<p class="meta" style="margin:0">${esc(t("editOnly"))}</p>`}
     ${x?transferBox(x):""}
     ${x?subtasksBox(x):""}
     ${x?`<div class="box"><h4>${esc(t("comments"))}</h4><div class="comments" id="cmList"><div class="meta">${esc(t("loading"))}</div></div>
       <div style="display:grid;gap:6px"><textarea class="field" id="cmIn" rows="2" placeholder="${esc(t("commentPh"))}" style="min-height:60px" maxlength="2000"></textarea><div><button class="btn sm" type="button" id="cmSend">${esc(t("addComment"))}</button></div></div></div>`:""}
    </form><aside class="side" id="sideP"></aside></div></div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  ov.addEventListener("click",e=>{ if(e.target===ov) closeSheet(); });
  ov.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!document.querySelector(".dlg")) closeSheet(); });
  $("#closeT").onclick=closeSheet; const c=$("#cancelT"); if(c) c.onclick=closeSheet;
  const fh=$("#fH"); if(fh) fh.onchange=()=>{ $("#fA").innerHTML=assigneeOptions(fh.value,"",null,true,$("#fD").value); };
  const fdp=$("#fD"); if(fdp&&!fdp.disabled) fdp.onchange=()=>{ const keep=$("#fA").value; const h=fh?fh.value:hotel; $("#fA").innerHTML=assigneeOptions(h,"",par,!x,fdp.value); if([...$("#fA").options].some(o=>o.value===keep)) $("#fA").value=keep; };
  const dl=$("#delT"); if(dl) dl.onclick=async()=>{ const ok=await ask({title:t("delDlg",{k:keyOf(x)}),text:t("delDlgT"),noInput:true,okText:t("delOk"),danger:true}); if(ok==null) return;
    const r=await call(S.sb.from("tasks").delete().eq("id",x.id).select("id")).catch(()=>null); if(r&&r.data&&r.data.length){ toast(t("tDeleted")); closeSheet(); await loadTasks(); render(); } else if(r) toast(t("e_not_allowed"),true); };
  $("#tf").addEventListener("submit",saveTask); const cs=$("#cmSend"); if(cs) cs.onclick=addComment;
  const op=$("#openPar"); if(op) op.onclick=()=>openTask(par.id);
  const dg=$("#delegateBtn"); if(dg) dg.onclick=()=>openTask(null,x.id);
  const tb=$("#trBtn"); if(tb) tb.onclick=()=>doTransfer(x);
  ov.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>openTask(b.dataset.sub));
  renderSheetSide(); if(x) loadThread(x.id); else setTimeout(()=>{ const f=$("#fTitle"); if(f) f.focus(); },30); }
function canTransfer(x){ if(x&&x.noTransfer&&!(isAdmin()||(isGM()&&x.hotel===myHotel())||x.reporter===S.uid)) return false; return !!x&&x.status!=="done"&&myRole()!=="staff"&&(isAdmin()||(isGM()&&x.hotel===myHotel())||x.assignee===S.uid||x.reporter===S.uid||(x.assignee&&isAbove(S.uid,x.assignee))||(x.assignee&&isDeptBoss(x.assignee))); }
function transferTargets(x){ return activeMembers().filter(id=>id!==x.assignee&&S.profiles[id].role!=="admin"&&S.profiles[id].hotel===x.hotel&&canAssignTo(id,x.hotel)); }
function transferBox(x){ const info=x.transfer&&x.transfer.from?`<div class="note info">↪ ${esc(t("trInfo",{f:nameOf(x.transfer.from),t:nameOf(x.assignee),b:nameOf(x.transfer.by)}))} · <span class="num">${esc(fmt(x.transfer.at))}</span></div>`:"";
  const lockN=x.noTransfer?`<div class="note">${esc(t("lockedNote"))}</div>`:"";
  const list=canTransfer(x)?transferTargets(x):[];
  if(!list.length) return info+lockN;
  return `${info}${lockN}<div class="box"><h4>${esc(t("trTitle"))}</h4><div class="meta">${esc(t("trHint"))}</div>
   <div class="row"><select class="field" id="trTo" style="flex:1 1 200px;width:auto"><option value="">${esc(t("trTo"))}</option>${list.map(id=>{const p=S.profiles[id]; return opt(id,nameOf(id)+(p.dept?" — "+deptL(p.dept):"")+(["manager","supervisor","gm"].includes(p.role)?" ("+roleL(p.role)+")":""),"");}).join("")}</select>
   <input class="field" id="trNote" placeholder="${esc(t("trNote"))}" maxlength="300" style="flex:2 1 200px;width:auto"><button type="button" class="btn primary" id="trBtn">${esc(t("trBtn"))}</button></div></div>`; }
async function doTransfer(x){ const to=$("#trTo").value; if(!to){ $("#trTo").focus(); return; } const b=$("#trBtn"); b.disabled=true;
  try{ await call(S.sb.rpc("transfer_task",{p_id:x.id,p_to:to,p_note:$("#trNote").value.trim()||null}),t("trDone",{n:nameOf(to)})); await loadTasks(); render(); if(T(x.id)) openTask(x.id); else closeSheet(); }catch(e){ b.disabled=false; } }
function subtasksBox(x){ const kids=childrenOf(x.id);
  const canDel=false&&(x.assignee===S.uid||x.reporter===S.uid||isAdmin()||(isSup()&&x.hotel===myHotel()))&&x.status!=="done"&&(isAdmin()||isSup()||(isManager()&&subordinates().length>0));
  if(!kids.length&&!canDel) return ""; const d=kids.filter(k=>k.status==="done").length;
  return `<div class="box"><div class="row" style="justify-content:space-between"><h4>${esc(t("subtasks"))} ${kids.length?`<span class="num">${esc(t("subDone",{d,n:kids.length}))}</span>`:""}</h4>${canDel?`<button type="button" class="btn sm" id="delegateBtn" title="${esc(t("splitHint"))}">${esc(t("delegateBtn"))}</button>`:""}</div>
   ${kids.length?`<div class="meter" style="width:100%"><i style="width:${d/kids.length*100}%;background:var(--ok)"></i></div><div style="display:grid;gap:6px">${kids.map(k=>`<button type="button" class="hit" data-sub="${k.id}"><span class="mono meta">${esc(keyOf(k))}</span><span class="ht">${esc(k.title)}</span>${who(k.assignee)}<span class="chip" style="color:${ST[k.status].c}">${esc(stL(k.status))}</span></button>`).join("")}</div>`:`<div class="meta">${esc(t("splitHint"))}</div>`}</div>`; }
function closeSheet(){ const o=$("#ov"); if(o) o.remove(); document.body.style.overflow=""; S.openId=null; }
async function saveTask(e){ e.preventDefault(); const x=S.openId?T(S.openId):null; const title=$("#fTitle").value.trim(); if(!title){$("#fTitle").focus();return;}
  const dueV=$("#fDue").value, est=$("#fEst").value;
  const p={title,descr:$("#fDesc").value.trim(),dept:$("#fD").value,location:$("#fLoc").value.trim(),assignee:$("#fA").value||"",priority:$("#fP").value,
    due:dueV?new Date(dueV).toISOString():"",shift:$("#fSh").value,estimate:est===""?"":String(Number(est)),needs_approval:$("#fNA").checked,no_transfer:$("#fNT").checked}; if($("#fPF")) p.proof_required=$("#fPF").value==="1";
  if(!x&&S.newParent) p.parent_id=String(S.newParent);
  const fh=$("#fH"); if(!x&&fh){ const hv=fh.value||(p.assignee&&S.profiles[p.assignee]?S.profiles[p.assignee].hotel:""); if(!hv){ toast(t("e_hotel_required"),true); return; } p.hotel=hv; }
  const btn=$("#saveT"); if(btn) btn.disabled=true;
  try{ if(!x){ const parId=S.newParent; const r=await call(S.sb.rpc("create_task",{p})); const k=(S.settings.prefix||"HTL")+"-"+String(r.data).padStart(3,"0");
      toast(t(parId?"tDelegated":"tCreated",{k})); closeSheet(); await loadTasks(); render(); if(parId) openTask(parId); return; }
    await call(S.sb.rpc("update_task",{p_id:x.id,p}),t("tSaved")); loadThread(x.id); await loadTasks(); render(); }catch(err){} finally{ if(btn) btn.disabled=false; } }
async function addComment(){ const id=S.openId; const inp=$("#cmIn"); const body=inp.value.trim(); if(!id||!body) return; inp.value="";
  try{ await call(S.sb.from("task_comments").insert({task_id:id,author:S.uid,body})); loadThread(id); }catch(e){ inp.value=body; } }
function evText(h){ let s=t("ev_"+h.action)||h.action;
  if(h.action==="transfer"){ const [ft,rest]=String(h.note||"").split(">"); const [to,...nt]=String(rest||"").split("|"); s+=": "+(ft?nameOf(ft)+(LANG==="ar"?" ← ":" → "):"")+nameOf(to); if(h.to_status&&h.from_status!==h.to_status) s+=" ("+stL(h.to_status)+")"; if(nt.length) s+=" — "+nt.join("|"); return s; }
  if(h.to_status&&h.action!=="create") s+=" → "+stL(h.to_status);
  if(h.note){ const n=(h.action==="edit"||h.action==="assign")?h.note.split(/[,،]\s*/).map(f=>I18N.en["f_"+f]?t("f_"+f):f).join(", "):h.note; s+=": "+n; }
  return s; }
function renderSheetSide(){ const side=$("#sideP"); if(!side) return; const x=S.openId?T(S.openId):null;
  if(!x){ if(S.openId){ closeSheet(); toast(t("tGone")); return; } side.innerHTML=`<div class="box"><h4>${esc(t("flow"))}</h4><div class="meta" style="line-height:1.9">${t("flowTxt")}</div></div>`; return; }
  const st=ST[x.status]; const acts=STATUSES.filter(s=>allowed(x,s.k)); const now=Date.now(); const late=isLate(x);
  side.innerHTML=`<div class="box"><h4>${esc(t("status"))}</h4><div class="statusline"><span style="width:10px;height:10px;border-radius:50%;background:${st.c}"></span>${esc(stL(x.status))}<span class="meta" style="font-weight:400;font-size:12.5px">${esc(t("since"))} ${dur(now-(x.statusAt||x.createdAt))}</span></div>
    ${acts.length?`<div class="actions">${acts.map(s=>`<button class="btn sm ${s.k==="done"?"ok":s.k==="rejected"?"bad":s.k==="review"?"primary":""}" data-to="${s.k}">${esc(actLabel(x,s.k))}</button>`).join("")}</div>`:`<div class="meta">${esc(x.assignee===S.uid||canApprove(x)?t("noActions"):t("assignedTo",{n:nameOf(x.assignee)}))}</div>`}
    ${x.status==="rejected"&&x.lastReject?`<div class="note bad"><b>${esc(t("rejReason"))}:</b> ${esc(x.lastReject.note)}<div class="meta" style="margin-top:4px">${esc(nameOf(x.lastReject.by))} · ${esc(fmt(x.lastReject.at))}</div></div>`:""}
    ${x.status==="done"&&x.approval?`<div class="note ok">${esc(t("approvedBy",{n:nameOf(x.approval.by)}))} · ${esc(fmt(x.approval.at))}${x.approval.note?`<div style="margin-top:4px">${esc(x.approval.note)}</div>`:""}</div>`:""}
    ${late&&x.status!=="done"?`<div class="note bad">${esc(t("lateBy",{d:dur(now-x.due)}))}</div>`:""}</div>
   <div class="box"><h4>${esc(t("time"))}</h4><dl class="kv"><dt>${esc(t("createdBy"))}</dt><dd>${who(x.reporter)}</dd><dt>${esc(t("createdAt"))}</dt><dd>${esc(fmt(x.createdAt))}</dd><dt>${esc(t("startedAt"))}</dt><dd>${esc(fmt(x.startedAt))}</dd>
    <dt>${esc(t("submittedAt"))}</dt><dd>${esc(fmt(x.submittedAt))}</dd><dt>${esc(t("completedAt"))}</dt><dd>${esc(fmt(x.completedAt))}</dd><dt>${esc(t("dueReq"))}</dt><dd style="${late?"color:var(--bad);font-weight:600":""}">${esc(fmt(x.due))}</dd>
    <dt>${esc(t("startDelay"))}</dt><dd>${x.startedAt?dur(x.startedAt-x.createdAt):"—"}</dd><dt>${esc(t("workT"))}</dt><dd><b>${x.startedAt?dur(workTime(x)):"—"}</b>${x.estimate?` <span class="meta">/ ${esc(t("est",{h:x.estimate}))}</span>`:""}</dd><dt>${esc(t("rejCount"))}</dt><dd>${x.rejections||0}</dd></dl></div>
   <div class="box"><h4>${esc(t("pfDocs"))} <span class="meta">(${(S.thread.files||[]).length})</span> <span class="pfmode ${x.proofRequired!==false?"req":"opt"}">${esc(t(x.proofRequired!==false?"pfReqTag":"pfOptTag"))}</span></h4>${(S.thread.files||[]).map(f=>`<div class="pfdoc${f.expired?" gone":""}"><span class="fi">${fIcon(f.name,f.mime)}</span><div class="fb"><b>${esc(f.name)}</b><span>${esc(t("pfSt_"+(f.stage||"finish")))} · ${esc(nameOf(f.uploaded_by))} · ${esc(fmt(ms(f.created_at)))} · ${kb(f.size)}${f.orig_size>f.size?` <em>(${esc(t("pfFrom",{s:kb(f.orig_size)}))})</em>`:""}</span></div>${f.expired?`<span class="meta">${esc(t("pfGone"))}</span>`:`<div class="tacts"><button class="btn sm primary" data-fv="${f.id}">👁 ${esc(t("fvOpen"))}</button><button class="icbtn sm" data-dl="${f.id}" title="${esc(t("pfDl"))}" aria-label="${esc(t("pfDl"))}">⬇</button></div>`}</div>`).join("")||`<span class="meta">${esc(t("pfNone"))}</span>`}<p class="meta" style="margin:6px 0 0;font-size:11.5px">${esc(t("pfKeep",{n:FKEEP}))}</p></div>
   <div class="box"><h4>${esc(t("activity"))}</h4><div class="hist">${S.thread.events.slice().reverse().map(h=>`<div><span class="dt"></span><span><b>${esc(nameOf(h.actor))}</b> ${esc(evText(h))}<br><span class="num">${esc(fmt(ms(h.created_at)))}</span></span></div>`).join("")||`<span class="meta">—</span>`}</div></div>`;
  side.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>requestTransition(T(x.id),b.dataset.to));
  side.querySelectorAll("[data-fv]").forEach(b=>b.onclick=()=>{ const f=(S.thread.files||[]).find(z=>String(z.id)===b.dataset.fv); if(f) viewFile(f); });
  side.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{ const f=(S.thread.files||[]).find(z=>String(z.id)===b.dataset.dl); if(f) downloadFile(f); });
  const cl=$("#cmList"); if(cl){ const cs=S.thread.comments; cl.innerHTML=cs.map(c=>`<div class="cm">${av(c.author)}<div><div class="h"><b style="color:var(--fg)">${esc(nameOf(c.author))}</b> · <span class="num">${esc(fmt(ms(c.created_at)))}</span></div><div class="b">${esc(c.body)}</div></div></div>`).join("")||`<div class="meta">${esc(t("noComments"))}</div>`; cl.scrollTop=cl.scrollHeight; } }

/* ================= boot ================= */
function boot(){
  applyLangChrome();
  const h=(location.hash||"").slice(1); if(["board","days","list","approvals","reports","team","depts","disc","eval"].includes(h)) S.view=h; { const mt=/^t=(\d+)$/.exec(h); if(mt) S.pendingOpen=+mt[1]; }
  if(!window.supabase||!CFG.SUPABASE_URL||CFG.SUPABASE_URL.includes("YOUR-PROJECT")){ $("#main").innerHTML=`<div class="gate"><h2>${esc(t("cfgTitle"))}</h2><p>${esc(t("cfgTxt"))}</p></div>`; return; }
  const tfetch=(u,o={})=>{ const c=new AbortController(); const tm=setTimeout(()=>c.abort(),20000); if(o.signal){ if(o.signal.aborted) c.abort(); else o.signal.addEventListener("abort",()=>c.abort()); } return fetch(u,Object.assign({},o,{signal:c.signal})).finally(()=>clearTimeout(tm)); };
  S.sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},global:{fetch:tfetch},realtime:{heartbeatIntervalMs:15000}});
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ heal("visible"); checkUpdate(); } });
  setInterval(checkUpdate,120000); setTimeout(checkUpdate,5000);
  window.addEventListener("online",()=>heal("online"));
  window.addEventListener("focus",()=>heal("focus"));
  loadMeta().then(()=>{ if(!S.session) render(); });
  S.sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){ S.authMode="reset"; S.session=null; setTimeout(render,0); return; }
    if(S.authMode==="reset"&&ev!=="SIGNED_OUT") return;
    const prev=S.uid; S.session=session; S.uid=session?session.user.id:null;
    if(!session){ S.ready=false; setTimeout(render,0); return; }
    if(prev!==S.uid||!S.ready) setTimeout(loadAll,0); });
  setInterval(()=>{ if(S.ready&&isMember()&&S.view!=="team"&&S.view!=="reports"&&!document.querySelector(".dlg")&&!S.dragId){ renderMain(); renderSheetSide(); } },60000);
}
boot();
})();
</script>
