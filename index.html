<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9EEE8; --line:#D5DCD4; --fg:#16201C; --muted:#56635D;
  --accent:#1E5A48; --accent-fg:#FFFFFF; --accent-soft:#D9E9E1; --brass:#9C7020; --brass-soft:#F3E7CD;
  --ok:#2A7A4B; --ok-soft:#DBEFE2; --warn:#A86300; --warn-soft:#FAEACD; --bad:#B0382E; --bad-soft:#F7DDD9; --info:#2D5B9A; --info-soft:#DDE6F4;
  --shadow:0 10px 30px rgba(22,32,28,.14);
  --f-display:"Readex Pro","IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
/* one fixed light look on every device (no automatic dark mode) */
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand h1{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brass);color:var(--surface);font-size:11px;font-weight:700;display:inline-grid;place-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:14px}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.toolbar .field{width:auto}
.toolbar .search{flex:1 1 200px;max-width:320px}
.toolbar select{flex:0 1 160px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none;font-size:13px}
.chk input{accent-color:var(--accent);width:16px;height:16px}

main{padding-block:0 40px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--surface-2);border-radius:10px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.col.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.col.nodrop{opacity:.55}
.colhead{display:flex;align-items:center;gap:8px;padding:2px 4px 6px;font-weight:600}
.colhead .dot{width:9px;height:9px;border-radius:50%}
.colhead .cnt{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-inline-start:3px solid var(--line)}
.card:hover{border-color:var(--accent)}
.card[data-pri="urgent"]{border-inline-start-color:var(--bad)}
.card[data-pri="high"]{border-inline-start-color:var(--warn)}
.card[data-pri="normal"]{border-inline-start-color:var(--info)}
.card.dragging{opacity:.4}
.card.mini{padding:7px 10px;gap:3px;border-inline-start-color:var(--ok)} .card.mini .t{font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .card.mini .av{width:20px;height:20px;font-size:10px;flex:none}
.card .t{font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:12px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.brass{background:var(--brass-soft);color:var(--brass)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.av{width:24px;height:24px;border-radius:50%;flex:none;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:600}
.av.lg{width:34px;height:34px;font-size:14px}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0}
.who span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-col{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:8px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface)}
th.sort{cursor:pointer} th.sort:hover{color:var(--fg)}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
td .t{font-weight:600}
td .field{width:auto}

.h2{font-family:var(--f-display);font-size:18px;font-weight:600;margin:20px 0 10px}
.sub{color:var(--muted);margin:-4px 0 14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.alert b{color:var(--bad)} .kpi.wait b{color:var(--brass)}
.dlayout{display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr);gap:18px;align-items:start}
.calcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;position:sticky;top:12px}
.calhead{display:flex;align-items:center;gap:8px}
.calhead h2{margin:0;font-size:20px;font-weight:800;flex:1;letter-spacing:-.01em}
.icbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;font:inherit;font-size:16px}
.icbtn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)} .icbtn[disabled]{opacity:.3;cursor:default}
.nowbtn{border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 12px;cursor:pointer}
.msum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:8px 4px}
.msum div{text-align:center;display:grid;gap:1px} .msum div+div{border-inline-start:1px solid var(--line)}
.msum b{font-size:18px;font-variant-numeric:tabular-nums} .msum span{font-size:11.5px;color:var(--muted)}
.mwarn{display:grid;gap:6px}
.mwarn button{display:flex;align-items:center;gap:8px;text-align:start;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calh{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:2px;font-weight:600}
.calc{aspect-ratio:1/1;min-width:0;position:relative;overflow:hidden;border-radius:11px;border:1.5px solid transparent;background:var(--surface-2);padding:5px 7px;text-align:start;font:inherit;color:var(--fg);cursor:pointer;display:block}
.calc .fill{position:absolute;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--ok) 26%,transparent);transition:height .3s}
.calc .dn{position:relative;z-index:1;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.calc .lf{position:absolute;z-index:1;bottom:5px;inset-inline-end:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:10.5px;font-weight:800;display:grid;place-items:center;color:#fff}
.calc .tk{position:absolute;z-index:1;bottom:5px;inset-inline-start:6px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.calc.none{background:transparent;border-color:var(--line)} .calc.none .dn{color:var(--muted);font-weight:600}
.calc.future{background:transparent;border-color:transparent;cursor:default} .calc.future .dn{color:var(--line);font-weight:600}
.calc.blank{visibility:hidden}
.calc.open{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 55%,transparent)} .calc.open .lf{background:var(--warn)}
.calc.late{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 55%,transparent)} .calc.late .lf{background:var(--bad)}
.calc.closed{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)} .calc.closed .lf{background:var(--ok)}
.calc.today .dn::after{content:"";display:block;width:14px;height:3px;border-radius:2px;background:var(--accent);margin-top:3px}
.calc.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.calc:not(.future):not(.blank):hover{border-color:var(--accent)}
.calc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.dpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dptop{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dpnum{font-size:52px;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.03em}
.dpname{display:grid;gap:3px;flex:1;min-width:160px} .dpname b{font-size:18px} .dpname span{font-size:13px;color:var(--muted)}
.dpstate{border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;white-space:nowrap}
.dpstate.open{background:var(--warn-soft);color:var(--warn)} .dpstate.late{background:var(--bad-soft);color:var(--bad)} .dpstate.closed{background:var(--ok-soft);color:var(--ok)} .dpstate.empty{background:var(--surface-2);color:var(--muted)}
.dpbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(140px,1.4fr);gap:0;border-bottom:1px solid var(--line)}
.dpbar>div{padding:12px 16px;display:grid;gap:2px} .dpbar>div+div{border-inline-start:1px solid var(--line)}
.dpbar b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1} .dpbar span{font-size:12px;color:var(--muted)}
.dpbar .meter{height:8px;width:100%;margin-top:6px}
.dpcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px 20px 20px}
.dpcol{display:grid;gap:8px;align-content:start;min-width:0}
.dpcol h4{margin:0;font-size:13.5px;display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.dpcol h4 .num{margin-inline-start:auto;color:var(--muted);font-weight:600}
.dpcard{display:grid;gap:5px;min-width:0;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font:inherit;color:inherit}
.dpcard:hover{border-color:var(--accent)} .dpcard .ht{font-size:13.5px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dpcard .dm{display:flex;align-items:center;gap:6px;min-width:0;font-size:11.5px;color:var(--muted)} .dpcard .dm .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpcard .av{width:20px;height:20px;font-size:10px;flex:none}
.dpempty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.dpnone{font-size:12.5px;color:var(--muted);padding:10px 2px}
@media (max-width:1000px){ .dlayout{grid-template-columns:minmax(0,1fr)} .calcard{position:static} .dpbar{grid-template-columns:repeat(4,minmax(0,1fr))} .dpbar>div:last-child{grid-column:1/-1;border-inline-start:0;border-top:1px solid var(--line)} }
/* list page */
.lstop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:none;font:inherit;font-weight:600;font-size:13.5px;color:var(--muted);padding:8px 16px;border-radius:9px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lsbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.mbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.mbname{min-width:130px;text-align:center;font-size:14.5px}
.nowbtn.off{background:var(--surface-2);color:var(--fg)}
.ststrip{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.stb{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;font:inherit;cursor:pointer;color:var(--muted);border-top:3px solid var(--c)}
.stb b{font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums} .stb span{font-size:12.5px}
.stb:hover{border-color:var(--c)} .stb.on{background:var(--accent-soft);border-color:var(--accent);border-top-color:var(--c)} .stb.on span{color:var(--accent);font-weight:600}
.lstable,.pptable{border-radius:16px}
.lstable table{font-size:13.5px}
.lstable th{position:sticky;top:0;z-index:1;background:var(--surface-2);padding:10px 14px} .lstable th.on{color:var(--accent)}
.lstable td{padding:11px 14px}
.lrow{cursor:pointer;transition:background .12s} .lrow:hover{background:var(--surface-2)}
.lrow.late td:first-child{box-shadow:inset -3px 0 0 var(--bad)} [dir=ltr] .lrow.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.kcol{font-family:var(--f-mono,monospace);font-size:12px;color:var(--muted);white-space:nowrap;width:1%}
.tcol{min-width:240px} .tcol .t{font-weight:700;font-size:14px;line-height:1.35}
.sub2{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
.sub2 span+span:not(.chip)::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--line);margin-inline-end:10px;vertical-align:middle}
.acol{white-space:nowrap;max-width:220px} .dcol,.wcol{white-space:nowrap} .dcol .meta{font-size:11px;margin-top:2px}
.stc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--c)}
.stc::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pri{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.pri.bad{background:var(--bad-soft);color:var(--bad)} .pri.warn{background:var(--warn-soft);color:var(--warn)} .pri.info{background:var(--info-soft);color:var(--info)}
.lateTxt{color:var(--bad);font-weight:700}
tr.grp td{background:var(--bg);padding:14px 14px 6px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px}
tr.grp em{font-style:normal;font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px;margin-inline-start:6px}
tr.grp i{font-style:normal;font-weight:500;color:var(--muted);font-size:12px;margin-inline-start:10px}
.lsempty{text-align:center;color:var(--muted);padding:40px!important}
.lshint{margin:0;color:var(--muted);font-size:12.5px;flex:1;min-width:220px}
.pptable th,.pptable td{padding:10px 12px}
.pptable thead th{background:var(--surface-2)} .pptable th.cur{color:var(--accent)}
.pcol{min-width:200px;width:26%;white-space:nowrap} .pcol .meta{margin-top:2px;margin-inline-start:34px}
.hc{text-align:center;width:84px} .hc.zero{color:var(--line)}
.hcb{display:grid;gap:1px;width:100%;min-width:62px;border:0;border-radius:10px;padding:6px 4px;cursor:pointer;font:inherit;color:var(--fg);background:rgb(30 90 72 / var(--a))}
.hcb b{font-size:17px;font-variant-numeric:tabular-nums} .hcb span{font-size:10.5px;color:var(--fg);opacity:.75}
.hcb:hover{outline:2px solid var(--accent)}
.ptot{text-align:center;font-size:15px}

let chan=null, timers={};
function later(k,fn){ clearTimeout(timers[k]); timers[k]=setTimeout(fn,350); }
function subscribe(){ if(chan) return;
  chan=S.sb.channel("ops")
   .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},()=>later("t",async()=>{await loadTasks().catch(()=>{});render();}))
   .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>later("p",async()=>{const was=isMember();await loadProfiles().catch(()=>{}); if(!was&&isMember()){await loadMeta();await loadTasks().catch(()=>{});} S.builtView=null; render();}))
   .on("postgres_changes",{event:"*",schema:"public",table:"departments"},()=>later("d",async()=>{await loadMeta().catch(()=>{}); if(S.view!=="depts") S.builtView=null; render();}))
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"task_comments"},p=>{ if(p.new&&p.new.task_id===S.openId) later("c",()=>loadThread(S.openId)); })
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"task_events"},p=>{ if(p.new&&p.new.task_id===S.openId) later("c",()=>loadThread(S.openId)); })
   .subscribe();
  if(!S.pollOn){ S.pollOn=true; setInterval(async()=>{ if(document.hidden) return; try{ const was=isMember(); await loadProfiles(); if(isMember()){ if(!was) await loadMeta(); else { const st=await S.sb.from("settings").select("*").eq("id",1).maybeSingle(); if(!st.error&&st.data) S.settings=st.data; } await loadTasks(); } netState(true); render(); }catch(e){ netState(false); heal("poll"); } },60000); }

function netState(ok){ let b=$("#netBar"); if(ok){ if(b) b.hidden=true; return; }
  if(!b){ b=document.createElement("div"); b.id="netBar"; document.body.appendChild(b); }
  b.innerHTML=`<span>${esc(t("netLost"))}</span><button type="button">${esc(t("netRetry"))}</button>`; b.hidden=false; b.querySelector("button").onclick=()=>heal("manual",true); }

/* auto-update: when a newer version is published, reload so nobody stays on an old copy */
const BUILD="v50";
async function checkUpdate(){ try{ const r=await fetch(location.pathname+"?u="+Date.now(),{cache:"no-store"}); if(!r.ok) return; const tx=await r.text(); const m=/const BUILD="([^"]+)"/.exec(tx);
  if(m&&m[1]!==BUILD){ if(document.querySelector("#ov,.dlg")){ if(!document.querySelector(".updbar")){ const b=document.createElement("button"); b.className="updbar"; b.textContent=t("newVersion"); b.onclick=()=>location.reload(); document.body.appendChild(b); } return; } location.reload(); } }catch(e){} }
async function heal(why,force){ if(!S.sb||healing) return; if(!force&&Date.now()-lastHeal<8000) return; healing=true; lastHeal=Date.now();
  try{
    const {data,error}=await S.sb.auth.getSession(); if(error) throw error;
    let ses=data.session;
    if(ses&&ses.expires_at&&ses.expires_at*1000-Date.now()<60000){ const r=await S.sb.auth.refreshSession(); if(r.error) throw r.error; ses=r.data.session; }
    if(!ses){ if(S.session){ S.session=null; S.uid=null; S.ready=false; render(); } netState(true); return; }
    S.session=ses;
    if(!S.ready){ await loadAll(); }
    else { const was=isMember(); await loadProfiles(); if(isMember()){ if(!was) await loadMeta(); else { const st=await S.sb.from("settings").select("*").eq("id",1).maybeSingle(); if(!st.error&&st.data) S.settings=st.data; } await loadTasks(); } render(); }
    if(chan&&chan.state!=="joined"&&chan.state!=="joining"){ try{ S.sb.removeChannel(chan); }catch(e){} chan=null; subscribe(); }
    netState(true);
  }catch(e){ netState(false); clearTimeout(S.healT); S.healT=setTimeout(()=>heal("retry",true),10000); }
  finally{ healing=false; } }

/* ================= task rules ================= */
const isLate=x=>x.due&&(x.status==="done"?(x.completedAt||0)>x.due:Date.now()>x.due);
const workTime=x=>x.startedAt?((x.completedAt||(x.status==="review"&&x.submittedAt)||Date.now())-x.startedAt):null;
const keyOf=x=>(S.settings.prefix||"HTL")+"-"+String(x.num||0).padStart(3,"0");
const T=id=>S.tasks.find(x=>String(x.id)===String(id));
const childrenOf=id=>S.tasks.filter(x=>x.parentId===id);
function allowed(x,to){ if(!x||x.status===to) return false; const from=x.status;
  if(canApprove(x)&&(to!=="rejected"||from==="review")) return true;
  if(x.assignee!==S.uid) return false; const na=x.needsApproval!==false||needsBoss(x);
  return (from==="todo"&&to==="progress")||(from==="rejected"&&to==="progress")||(from==="progress"&&to==="review"&&na)||(from==="progress"&&to==="done"&&!na)||(from==="review"&&to==="progress"); }
function actLabel(x,to){ const f=x.status;
  if(to==="progress") return t(f==="todo"?"a_start":f==="rejected"?"a_redo":f==="review"?"a_withdraw":"a_reopen");
  if(to==="review") return t("a_submit"); if(to==="done") return t(f==="review"?"a_approve":"a_finish");
  if(to==="rejected") return t("a_reject"); return t("a_back"); }
async function transition(x,to,note){
  await call(S.sb.rpc("transition_task",{p_id:x.id,p_to:to,p_note:note||null}), to==="done"&&x.status==="review"?t("tApproved"):to==="rejected"?t("tRejected"):t("tMoved",{s:stL(to)}));
  await loadTasks(); render(); if(S.openId===x.id) loadThread(x.id); }

async function gz(blob){ return await new Response(blob.stream().pipeThrough(new CompressionStream("gzip"))).blob(); }
async function shrink(file){ const orig=file.size; const isImg=/^image\/(jpeg|png|webp|bmp|gif)$/i.test(file.type);
  if(isImg){ try{ let bmp; try{ bmp=await createImageBitmap(file,{resizeWidth:1600,resizeQuality:"medium"}); }catch(e){ bmp=null; }
      if(!bmp||!bmp.width) bmp=await createImageBitmap(file);
      const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
      c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); let b=await new Promise(r=>c.toBlob(r,"image/webp",0.6)); let mime="image/webp", ext="webp";
      if(!b||b.type!=="image/webp"){ b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.65)); mime="image/jpeg"; ext="jpg"; }
      if(b&&b.size<orig) return {blob:b,mime,ext,gz:false,orig}; }catch(e){} }
  const ext0=((file.name.match(/\.([A-Za-z0-9]{1,6})$/)||[])[1]||"bin").toLowerCase();
  if(window.CompressionStream){ try{ const z=await gz(file); if(z.size<orig*0.95) return {blob:z,mime:file.type||"application/octet-stream",ext:ext0+".gz",gz:true,orig}; }catch(e){} }

  const cols=D.map(o=>{ const open=o.tot-o.done; const late=open&&o.k<todayK; const sel=o.k===S.daySel;

  const side=`<div class="fside">

    <div><span>${esc(t("chWindowDone"))}</span><b>${pctS(sumD,sumC)}%<small> ${sumD}/${sumC}</small></b></div>
    <div><span>${esc(t("chBestDay"))}</span><b>${bestD&&bestD.tot?esc(new Intl.DateTimeFormat(loc(),{day:"numeric",month:"short"}).format(new Date(bestD.k+"T12:00"))):"—"}<small>${bestD&&bestD.tot?" "+bestD.tot+" "+esc(t("chTasks")):""}</small></b></div>
    <div class="${backlog?"warnb":""}"><span>${esc(t("chBacklog"))}</span><b>${backlog}</b></div></div>`;
  const flow=`<div class="dcard wide"><header><h3>${esc(t(curMonth?"chFlow30":"chFlow"))}</h3><div class="clg"><span><i style="background:var(--ok)"></i>${esc(t("chDoneOf"))}</span><span><i style="background:var(--warn)"></i>${esc(t("chStillOpen"))}</span><span><i style="background:var(--bad)"></i>${esc(t("chOverdueDay"))}</span><span><i class="dt"></i>${esc(t("chFinishedThatDay"))}</span></div></header>
    <div class="fwrap">${side}<div class="fchart"><div class="fy">${ticks.map(v=>`<span>${v}</span>`).join("")}</div><div class="fplot" style="--n:${D.length}"><div class="fgrid"><i></i><i></i><i></i></div>${cols}</div></div></div><p class="chint">${esc(t("chClickDay"))}</p></div>`;
  /* 2) status donut */
  const tot=inM.length; const segs=STATUSES.map(s0=>({k:s0.k,c:s0.c,n:inM.filter(x=>x.status===s0.k).length})).filter(o=>o.n);
  let acc=0; const R0=54, C=2*Math.PI*R0; const arcs=segs.map(o=>{ const len=C*o.n/tot; const a=`<circle r="${R0}" cx="70" cy="70" fill="none" stroke="${o.c}" stroke-width="18" stroke-dasharray="${len-1.5} ${C-len+1.5}" stroke-dashoffset="${-acc}" class="dseg" data-tip="${tipH(stL(o.k),[[o.c,t("chTasks"),o.n+" ("+pctS(o.n,tot)+"%)"]])}"/>`; acc+=len; return a; }).join("");
  const donut=`<div class="dcard"><header><h3>${esc(t("chStatus"))}</h3></header><div class="donutw"><svg viewBox="0 0 140 140" class="donut"><g transform="rotate(-90 70 70)"><circle r="${R0}" cx="70" cy="70" fill="none" stroke="var(--surface-2)" stroke-width="18"/>${arcs}</g><text x="70" y="68" text-anchor="middle" class="dnum">${tot}</text><text x="70" y="86" text-anchor="middle" class="dlbl">${esc(t("chTasks"))}</text></svg>
    <div class="dleg">${segs.map(o=>`<div><i style="background:${o.c}"></i><span>${esc(stL(o.k))}</span><b>${o.n}</b><em>${pctS(o.n,tot)}%</em></div>`).join("")}</div></div></div>`;
  /* 3) weekday pattern */
  const wkN=[0,0,0,0,0,0,0], wkC=[0,0,0,0,0,0,0]; D.forEach(o=>{ if(o.fut) return; const wd=(new Date(y,m-1,o.d).getDay()+1)%7; wkN[wd]+=o.tot; wkC[wd]++; });
  const avgW=wkN.map((n,i)=>wkC[i]?n/wkC[i]:0); const mW=Math.max(.01,...avgW); const best=avgW.indexOf(Math.max(...avgW));
  const wkL=[...Array(7)].map((_,i)=>new Intl.DateTimeFormat(loc(),{weekday:"short"}).format(new Date(2024,0,6+i)));
  const week=`<div class="dcard"><header><h3>${esc(t("chWeekday"))}</h3>${Math.max(...avgW)>0?`<span class="cbadge">${esc(t("chBusiest",{d:new Intl.DateTimeFormat(loc(),{weekday:"long"}).format(new Date(2024,0,6+best))}))}</span>`:""}</header>
    <div class="wkb">${avgW.map((v,i)=>`<div class="wk${i===best&&v>0?" top":""}" data-tip="${tipH(wkL[i],[["var(--accent)",t("chAvgPerDay"),v.toFixed(1)],["var(--muted)",t("chTasks"),wkN[i]]])}"><span style="height:${Math.max(3,v/mW*100)}%"></span><b>${v?v.toFixed(1):"0"}</b><small>${esc(wkL[i])}</small></div>`).join("")}</div></div>`;
  /* 4) hour heat strip */
  const hr=[...Array(24)].fill(0), hrD=[...Array(24)].fill(0); inM.forEach(x=>hr[new Date(x.createdAt).getHours()]++); doneInM.forEach(x=>hrD[new Date(x.completedAt).getHours()]++);
  const mh=Math.max(1,...hr,...hrD); const hl=h=>new Intl.DateTimeFormat(loc(),{hour:"numeric"}).format(new Date(2024,0,1,h));
  const peak=hr.indexOf(Math.max(...hr));
  const heat=`<div class="dcard"><header><h3>${esc(t("chHours"))}</h3><span class="cbadge">${esc(t("chPeak",{h:hl(peak)}))}</span></header>
    ${[["chCreatedRow",hr,"var(--accent)"],["chFinishedRow",hrD,"var(--info)"]].map(([l,arr,c])=>`<div class="hrow"><span>${esc(t(l))}</span><div class="hcells">${arr.map((v,h)=>`<i style="background:color-mix(in srgb,${c} ${v?Math.round(15+85*v/mh):0}%,var(--surface-2))" data-tip="${tipH(hl(h),[[c,t(l),v]])}"></i>`).join("")}</div></div>`).join("")}
    <div class="hax"><span>${esc(hl(0))}</span><span>${esc(hl(6))}</span><span>${esc(hl(12))}</span><span>${esc(hl(18))}</span><span>${esc(hl(23))}</span></div></div>`;
  /* 5) people */
  const P={}; inM.forEach(x=>{ if(!x.assignee) return; const o=P[x.assignee]||(P[x.assignee]={n:0,d:0,late:0}); o.n++; if(x.status==="done") o.d++; else if(isLate(x)) o.late++; });
  const pl2=Object.entries(P).sort((a,b)=>b[1].n-a[1].n).slice(0,7); const pm=Math.max(1,...pl2.map(([,o])=>o.n));
  const people=`<div class="dcard"><header><h3>${esc(t("chPeople"))}</h3><span class="cbadge ghost">${esc(t("chClickPerson"))}</span></header><div class="pbars">${pl2.map(([u,o])=>`<button type="button" class="pbr${S.f.as===u?" on":""}" data-cperson="${u}" data-tip="${tipH(nameOf(u),[["var(--ok)",t("dyDone"),o.d],["var(--warn)",t("chStillOpen"),o.n-o.d-o.late],["var(--bad)",t("lgLate"),o.late]])}">${av(u)}<span class="nm">${esc(nameOf(u))}</span><span class="trk" style="width:${o.n/pm*100}%"><i style="flex:${o.d};background:var(--ok)"></i><i style="flex:${o.n-o.d-o.late};background:var(--warn)"></i><i style="flex:${o.late};background:var(--bad)"></i></span><b>${o.d}/${o.n}</b></button>`).join("")||`<div class="dpnone">${esc(t("dyColNone"))}</div>`}</div></div>`;
  return `<section class="dcharts"><div class="dch-title"><h2>${esc(t("chTitle",{m:monthName(mk)}))}</h2><span>${esc(t("chSub"))}</span></div>${flow}<div class="dgrid">${donut}${week}${heat}${people}</div></section>`; }
function dayHours(g){ const hr=[...Array(24)].fill(0), hd=[...Array(24)].fill(0); g.ts.forEach(x=>{ hr[new Date(x.createdAt).getHours()]++; if(x.completedAt&&dayKey(x.completedAt)===g.k) hd[new Date(x.completedAt).getHours()]++; });
  const mh=Math.max(1,...hr,...hd); const hl=h=>new Intl.DateTimeFormat(loc(),{hour:"numeric"}).format(new Date(2024,0,1,h));
  return `<div class="dphours"><h4>${esc(t("chDayHours"))}</h4><div class="dhb">${hr.map((v,h)=>`<div data-tip="${tipH(hl(h),[["var(--accent)",t("chCreatedRow"),v],["var(--info)",t("chFinishedRow"),hd[h]]])}"><i class="c" style="height:${v/mh*100}%"></i><i class="d" style="height:${hd[h]/mh*100}%"></i></div>`).join("")}</div><div class="hax"><span>${esc(hl(0))}</span><span>${esc(hl(6))}</span><span>${esc(hl(12))}</span><span>${esc(hl(18))}</span><span>${esc(hl(23))}</span></div></div>`; }

function dayPanel(g){ if(!g) return `<section class="dpanel"><div class="dpempty"><b>${esc(t("dyPick"))}</b></div></section>`;
  const [y,mo,d]=g.k.split("-").map(Number); const dt=new Date(y,mo-1,d);
  const L=dayLabel(g.k); const c=!g.total?"empty":!g.open?"closed":g.past?"late":"open"; const pct=g.total?Math.round(g.done/g.total*100):0;
  const wd=new Intl.DateTimeFormat(loc(),{weekday:"long"}).format(dt), mn=new Intl.DateTimeFormat(loc(),{month:"long",year:"numeric"}).format(dt);
  const card=x=>`<button type="button" class="dpcard" data-id="${x.id}" title="${esc(x.title)}"><span class="ht">${esc(x.title)}</span><span class="dm"><span class="mono">${esc(keyOf(x))}</span><span style="color:${ST[x.status].c};font-weight:700">${esc(stL(x.status))}</span>${x.assignee?`<span style="flex:1"></span>${av(x.assignee)}<span class="nm">${esc(nameOf(x.assignee))}</span>`:""}</span></button>`;

  const nw=g.ts.filter(x=>x.status==="todo"), pend=g.ts.filter(x=>x.status!=="todo"&&x.status!=="done"), dn=g.ts.filter(x=>x.status==="done");
  const state={empty:t("dyEmpty"),closed:"✓ "+t("dyPillClosed"),late:"⚠ "+t("dyPillLate"),open:"⚠ "+t("dyPillOpen")}[c];
  const msg=c==="empty"?"":c==="closed"?t("dyClosed"):t(c==="late"?"dyLate":"dyOpen",{n:g.total-g.done});
  return `<section class="dpanel">
    <div class="dptop"><div class="dpnum">${d}</div><div class="dpname"><b>${esc(wd)}${L.tag?` <span class="chip info" style="vertical-align:middle">${esc(L.tag)}</span>`:""}</b><span>${esc(mn)}${msg?" — "+esc(msg):""}</span></div><span class="dpstate ${c}">${esc(state)}</span></div>
    ${g.total?`<div class="dpbar"><div><b>${g.total}</b><span>${esc(t("dyTotal"))}</span></div><div><b style="color:var(--muted)">${g.nw}</b><span>${esc(t("dyNew"))}</span></div><div><b style="color:var(--warn)">${g.pend}</b><span>${esc(t("dyPending"))}</span></div><div><b style="color:var(--ok)">${g.done}</b><span>${esc(t("dyDone"))}</span></div>
      <div><b>${pct}%</b><span>${esc(t("dyProgress"))}</span><div class="meter"><i style="width:${pct}%;background:var(--ok)"></i></div></div></div>
    ${dayHours(g)}
    <div class="dpcols">${col(t("dyNew"),"var(--muted)",nw)}${col(t("dyPending"),"var(--warn)",pend)}${col(t("dyDone"),"var(--ok)",dn)}</div>`
    :`<div class="dpempty"><span>${esc(t("dyNoTasksDay"))}</span>${g.past?"":`<button class="btn primary" id="dayNew">${esc(t("newTaskT"))}</button>`}</div>`}
  </section>`; }
function bindDays(){ const m=$("#main"); const dn=m.querySelector("#dayNew"); if(dn) dn.onclick=()=>openTask(null);

/* supervisor -> staff: hand over open tasks and split the target by days */
async function demoteDialog(id){ const p=S.profiles[id]; const open=S.tasks.filter(x=>x.assignee===id&&x.status!=="done"); const tg=(S.targets||{})[id];
  const recv=activeMembers().filter(u=>{ const q=S.profiles[u]; if(u===id||q.hotel!==p.hotel) return false; if(isManager()) return u===S.uid||(q.role==="supervisor"&&inScope(u)); return ["supervisor","manager","gm"].includes(q.role); })
    .sort((a,b)=>((S.profiles[b].dept===p.dept)-(S.profiles[a].dept===p.dept))||nameOf(a).localeCompare(nameOf(b),LANG));
  let split=""; if(tg){ const r=periodRange(tg.period,0); const now=Date.now(); const kept=Math.max(0,Math.round(tg.target*(now-r.a)/(r.b-r.a))); split=`<div class="dmsplit"><div><b>${tg.target}</b><span>${esc(t("dmFull"))}</span></div><div><b>${kept}</b><span>${esc(t("dmKept",{n:nameOf(id)}))}</span></div><div><b>${tg.target-kept}</b><span>${esc(t("dmGiven"))}</span></div></div>`; }
  const html=`<div class="dmbox"><div class="dmrow"><b>${open.length}</b><span>${esc(t("dmOpen"))}</span></div>${split}
    <label class="lb">${esc(t("dmWho"))}<select class="field" id="dmTo"><option value="">${esc(t("mgrPick"))}</option>${recv.map(u=>opt(u,nameOf(u)+" — "+roleL(S.profiles[u].role)+(S.profiles[u].dept?" / "+deptL(S.profiles[u].dept):""),"")).join("")}</select></label>
    <p class="meta" style="margin:0">${esc(t("dmNote"))}</p></div>`;
  const to=await ask({title:t("dmTitle",{n:nameOf(id)}),html,noInput:true,pick:"#dmTo",okText:t("dmGo")}); if(!to) return false;
  try{ const r=await call(S.sb.rpc("demote_supervisor",{p_sup:id,p_to:to})); toast(t("dmDone",{n:(r&&r.data)||0,m:nameOf(to)})); return true; }catch(e){ return false; } }

/* ================= discipline (HR): absences, notices, warnings, penalties ================= */
const DK=["absence","notice","warning","penalty"]; const DKI={absence:"⌀",notice:"!",warning:"!!",penalty:"✕"};
const discPub=()=>!!(S.settings&&S.settings.disc_public);
const discCanSee=()=>isAdmin()||(isMember()&&discPub());
const discCanWrite=()=>isAdmin()||(discPub()&&myDept()==="hr");
const dP=id=>(S.discPeople&&S.discPeople[id])||S.profiles[id]||null;
const dName=id=>{ const p=dP(id); return (p&&p.full_name)||t("someone"); };
const dAv=id=>`<span class="av" style="background:${colorOf(id)}">${esc((dName(id).trim().charAt(0))||"?")}</span>`;
function dChain(id,role){ let cur=dP(id), n=0; while(cur&&cur.reports_to&&n<25){ const b=dP(cur.reports_to); if(!b) return null; if(b.role===role) return b.id; cur=b; n++; } return null; }
const dCurM=()=>dayKey(Date.now()).slice(0,7);
async function loadDisc(){ const y=(S.discMonth||dCurM()).slice(0,4);
  const [p,r]=await Promise.all([S.sb.rpc("disc_people"),S.sb.from("disc_records").select("*").gte("on_date",y+"-01-01").lte("on_date",y+"-12-31").order("on_date",{ascending:false}).order("id",{ascending:false}).limit(5000)]);
  if(p.error) throw p.error; if(r.error) throw r.error;
  S.discPeople={}; (p.data||[]).forEach(x=>S.discPeople[x.id]=x); S.disc=r.data||[]; S.discYear=y; S.discErr=null; }
function dAgg(recs){ const A={}; recs.forEach(r=>{ const a=A[r.emp_id]||(A[r.emp_id]={absence:{n:0,d:0},notice:{n:0,d:0},warning:{n:0,d:0},penalty:{n:0,d:0},tot:0});
  a[r.kind].n++; a[r.kind].d+=Number(r.days)||0; a.tot++; }); return A; }
const dNum=v=>{ const x=Math.round(v*100)/100; return String(x); };
function dPeopleList(){ const q=(S.dq||"").trim().toLowerCase(); const hs=isAdmin()?(S.dHotel||""):myHotel();
  const withRec=new Set((S.disc||[]).map(r=>r.emp_id));
  return Object.values(S.discPeople||{}).filter(p=>(p.active||withRec.has(p.id))&&(!hs||p.hotel===hs)&&(!S.dDept||p.dept===S.dDept)&&(!q||(p.full_name||"").toLowerCase().includes(q)));
}
function dRecsIn(mk){ const hs=isAdmin()?(S.dHotel||""):""; return (S.disc||[]).filter(r=>r.on_date.slice(0,7)===mk&&(!hs||r.hotel===hs)&&(!S.dDept||r.dept===S.dDept)); }

function renderDisc(){ const m=$("#main");
  if(!discCanSee()){ m.innerHTML=`<div class="dcempty"><b>${esc(t("dcLocked"))}</b></div>`; return; }
  S.discMonth=S.discMonth||dCurM(); S.dMode=S.dMode||"month";
  if(!S.disc||S.discYear!==S.discMonth.slice(0,4)){
    if(S.discErr){ m.innerHTML=`<div class="dcempty"><b>${esc(t("loadErr"))}</b><span>${esc(S.discErr)}</span><button class="btn" id="dcRetry">${esc(t("retry"))}</button></div>`; $("#dcRetry").onclick=()=>{ S.discErr=null; renderDisc(); }; return; }
    if(!S.discLoading){ S.discLoading=true; if(S.builtView!=="disc") m.innerHTML=`<div class="dcempty"><span>${esc(t("dcLoading"))}</span></div>`;
      loadDisc().catch(e=>{ S.discErr=errText(e); }).finally(()=>{ S.discLoading=false; if(S.view==="disc") renderDisc(); }); }
    return; }
  if(S.builtView!=="disc"){ S.builtView="disc";
    m.innerHTML=`<div class="dchead"><div><h2>${esc(t("dcTitle"))}</h2><p>${esc(t("dcSub"))}</p></div>
      <div class="dcctl"><div class="seg" role="tablist"><button type="button" data-dm="month">${esc(t("dcMonthly"))}</button><button type="button" data-dm="year">${esc(t("dcYearly"))}</button></div>
      <button class="btn" id="dcXls">${esc(t("dcExport"))}</button>${discCanWrite()?`<button class="btn primary" id="dcAdd">+ ${esc(t("dcAdd"))}</button>`:""}</div></div>
      <div id="dcVis"></div><p class="dcrule">${esc(t("dcRule"))}</p>
      <div class="dcbar"><div class="dcmon"><button class="icbtn" data-mo="-1" aria-label="${esc(t("dyPrevM"))}">${LANG==="ar"?"›":"‹"}</button><b id="dcMonL"></b><button class="icbtn" data-mo="1" aria-label="${esc(t("dyNextM"))}">${LANG==="ar"?"‹":"›"}</button></div>
        <div class="tfsearch"><span>⌕</span><input class="field" id="dcQ" type="search" placeholder="${esc(t("dcSearch"))}" value="${esc(S.dq||"")}"></div>
        ${isAdmin()?`<select class="field" id="dcHotel">${hotelOpts(S.dHotel||"",t("allHotels"))}</select>`:""}
        <select class="field" id="dcDept"></select>
        <label class="meta" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="dcOnly"${S.dOnly?" checked":""}> ${esc(t("dcOnly"))}</label></div>
      <div id="dcBody"></div>`;
    m.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{ S.dMode=b.dataset.dm; discBody(); });
    m.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{ const step=S.dMode==="year"?12:1; const nm=shiftMonth(S.discMonth,Number(b.dataset.mo)*step); if(nm>dCurM()) S.discMonth=dCurM(); else S.discMonth=nm; S.dOpen=null; if(S.discYear!==S.discMonth.slice(0,4)){ S.disc=null; renderDisc(); } else discBody(); });
    $("#dcQ").oninput=e=>{ S.dq=e.target.value; discBody(); };
    $("#dcDept").onchange=e=>{ S.dDept=e.target.value; discBody(); };
    $("#dcOnly").onchange=e=>{ S.dOnly=e.target.checked; discBody(); };
    if($("#dcHotel")) $("#dcHotel").onchange=e=>{ S.dHotel=e.target.value; discBody(); };
    if($("#dcAdd")) $("#dcAdd").onclick=()=>discAddDialog();
    $("#dcXls").onclick=()=>discExport();
  }
  discBody(); }

function discBody(){ const body=$("#dcBody"); if(!body) return; const mk=S.discMonth, Y=mk.slice(0,4);
  document.querySelectorAll("[data-dm]").forEach(b=>b.setAttribute("aria-selected",b.dataset.dm===S.dMode));
  $("#dcMonL").textContent=S.dMode==="year"?Y:monthName(mk);
  document.querySelector('[data-mo="1"]').disabled=S.dMode==="year"?Y>=dCurM().slice(0,4):mk>=dCurM();
  const depts=[...new Set(Object.values(S.discPeople||{}).map(p=>p.dept).filter(Boolean))].sort((a,b)=>deptL(a).localeCompare(deptL(b),LANG));
  $("#dcDept").innerHTML=opt("",t("dcAllDepts"),S.dDept||"")+depts.map(d=>opt(d,deptL(d),S.dDept||"")).join("");
  const vis=$("#dcVis"); vis.innerHTML=isAdmin()?`<div class="dcvis${discPub()?" pub":""}"><span class="lk">${discPub()?"◉":"🔒"}</span><div class="tx"><b>${esc(t(discPub()?"dcVisPub":"dcVisPriv"))}</b><span>${esc(t(discPub()?"dcVisPubH":"dcVisPrivH"))}</span></div>
    <div class="seg"><button type="button" data-vis="0" aria-selected="${!discPub()}">${esc(t("dcOnlyMe"))}</button><button type="button" data-vis="1" aria-selected="${discPub()}">${esc(t("dcEveryone"))}</button></div></div>`:"";
  vis.querySelectorAll("[data-vis]").forEach(b=>b.onclick=()=>discSetPublic(b.dataset.vis==="1"));
  body.innerHTML=S.dMode==="year"?discYearHTML(Y):discMonthHTML(mk); bindDiscBody(); }

function dCell(a,k,showDays){ const v=a?a[k]:{n:0,d:0}; const z=!v.n; return `<span class="dcc k-${k}${z?" z":""}"><span class="ml">${esc(t("dk_"+k))}</span><b>${z?"—":v.n}</b>${showDays&&v.d?`<small>${esc(t("dcDaysN",{n:dNum(v.d)}))}</small>`:""}</span>`; }
function discMonthHTML(mk){ const recs=dRecsIn(mk), A=dAgg(recs); const prevA=mk.slice(0,4)===shiftMonth(mk,-1).slice(0,4)?dAgg(dRecsIn(shiftMonth(mk,-1))):null;
  const people=dPeopleList(); const ids=new Set(people.map(p=>p.id));
  const sumK=k=>{ let n=0,d=0,e=0; Object.entries(A).forEach(([id,a])=>{ if(!ids.has(id)) return; n+=a[k].n; d+=a[k].d; if(a[k].n) e++; }); return {n,d,e}; };
  const sumP=k=>prevA?Object.entries(prevA).filter(([id])=>ids.has(id)).reduce((s,[,a])=>s+a[k].n,0):null;
  const kpi=`<div class="dckpi">${DK.map(k=>{ const s=sumK(k), p=sumP(k); const dl=p==null?"":s.n>p?`<span class="dl up">▲ ${s.n-p} ${esc(t("dcVsPrev"))}</span>`:s.n<p?`<span class="dl dn">▼ ${p-s.n} ${esc(t("dcVsPrev"))}</span>`:`<span class="dl">${esc(t("dcSamePrev"))}</span>`;
    return `<button type="button" class="dck k-${k}" data-kf="${k}" aria-pressed="${S.dKind===k}"><span class="hd"><i>${DKI[k]}</i>${esc(t("dk_"+k))}</span><span class="n">${s.n}</span><span class="s">${esc(t("dcPeopleN",{n:s.e}))}${(k==="absence"||k==="penalty")&&s.d?" · "+esc(t(k==="absence"?"dcAbsDays":"dcDedDays",{n:dNum(s.d)})):""}</span>${dl}</button>`; }).join("")}</div>`;
  // department bars
  const byD={}; recs.forEach(r=>{ if(!ids.has(r.emp_id)) return; const d=byD[r.dept]||(byD[r.dept]={absence:0,notice:0,warning:0,penalty:0,tot:0}); d[r.kind]++; d.tot++; });
  const dl=Object.entries(byD).sort((a,b)=>b[1].tot-a[1].tot); const mx=Math.max(1,...dl.map(x=>x[1].tot));
  const deptBox=dl.length?`<div class="dcdepts"><h3>${esc(t("dcByDept"))}</h3><p class="meta">${esc(t("dcByDeptH"))}</p>${dl.map(([d,v])=>`<button type="button" class="dcdr" data-df="${esc(d)}" aria-pressed="${S.dDept===d}"><span>${esc(deptL(d)||t("dcNoDept"))}</span><span class="dcst" style="width:${Math.max(8,v.tot/mx*100)}%">${DK.filter(k=>v[k]).map(k=>`<i class="k-${k}" style="flex:${v[k]}" title="${esc(t("dk_"+k))}: ${v[k]}"></i>`).join("")}</span><b>${v.tot}</b></button>`).join("")}
    <div class="dcleg">${DK.map(k=>`<span class="k-${k}">${esc(t("dk_"+k))}</span>`).join("")}</div></div>`:"";
  // employees grouped by dept
  let list=people; if(S.dOnly) list=list.filter(p=>A[p.id]); if(S.dKind) list=list.filter(p=>A[p.id]&&A[p.id][S.dKind].n);
  const G={}; list.forEach(p=>(G[(isAdmin()&&!S.dHotel?p.hotel+"|":"")+p.dept]=G[(isAdmin()&&!S.dHotel?p.hotel+"|":"")+p.dept]||[]).push(p));
  const RO={manager:0,supervisor:1,staff:2,gm:-1};
  const groups=Object.keys(G).sort((a,b)=>{ const ta=G[a].reduce((s,p)=>s+(A[p.id]?A[p.id].tot:0),0), tb=G[b].reduce((s,p)=>s+(A[p.id]?A[p.id].tot:0),0); return tb-ta||a.localeCompare(b); });
  const hdr=`<div class="dchrow"><span>${esc(t("dcEmp"))}</span>${DK.map(k=>`<span>${esc(t("dk_"+k))}</span>`).join("")}<span>${esc(t("dcTotal"))}</span></div>`;
  const rows=groups.map(g=>{ const ps=G[g].sort((a,b)=>((A[b.id]?A[b.id].tot:0)-(A[a.id]?A[a.id].tot:0))||((RO[a.role]??3)-(RO[b.role]??3))||(a.full_name||"").localeCompare(b.full_name||"",LANG));
    const [h,d]=g.includes("|")?g.split("|"):["",g]; const gt=ps.reduce((s,p)=>s+(A[p.id]?A[p.id].tot:0),0), gp=ps.filter(p=>A[p.id]).length;
    return `<section class="dcgrp"><div class="dcgh"><h3>${esc(deptL(d)||t("dcNoDept"))}${h?` <span class="meta">· ${esc(hotelL(h))}</span>`:""}</h3><span class="meta">${esc(t("dcGrpMeta",{n:ps.length,p:gp,r:gt}))}</span></div>${hdr}
      ${ps.map(p=>{ const a=A[p.id]; const sup=p.role==="staff"?dChain(p.id,"supervisor"):null, mgr=["staff","supervisor"].includes(p.role)?dChain(p.id,"manager"):null;
        const line=[roleL(p.role),sup?t("dcSupL",{n:dName(sup)}):"",mgr?t("dcMgrL",{n:dName(mgr)}):""].filter(Boolean).join(" · ");
        const open=S.dOpen===p.id;
        return `<button type="button" class="dcrow${a?"":" zero"}" data-emp="${p.id}" aria-expanded="${open}"><span class="dcwho">${dAv(p.id)}<div><span class="n">${esc(p.full_name||"")}${p.active?"":` <span class="meta">(${esc(t("dcInactive"))})</span>`}</span><span class="r">${esc(line)}</span></div></span>
          ${dCell(a,"absence",1)}${dCell(a,"notice")}${dCell(a,"warning")}${dCell(a,"penalty",1)}<span class="dcc tot${a?"":" z"}"><span class="ml">${esc(t("dcTotal"))}</span><b>${a?a.tot:"—"}</b>${a?`<small class="pt">${esc(t("dcPts",{n:recs.filter(r=>r.emp_id===p.id).reduce((s,r)=>s+discRecPts(r),0)}))}</small>`:""}</span></button>${open?discDetail(p.id,mk):""}`; }).join("")}</section>`; }).join("");
  const empty=!recs.length?`<div class="dcempty"><b>${esc(t("dcEmptyM",{m:monthName(mk)}))}</b><span>${esc(t(discCanWrite()?"dcEmptyW":"dcEmptyR"))}</span>${discCanWrite()?`<button class="btn primary" data-add="1">+ ${esc(t("dcAdd"))}</button>`:""}</div>`:"";
  const none=!list.length&&recs.length?`<div class="dcempty"><b>${esc(t("dcNoMatch"))}</b></div>`:"";
  return kpi+deptBox+empty+(recs.length||!S.dOnly?rows:"")+none; }

function discDetail(id,mk){ const recs=(S.disc||[]).filter(r=>r.emp_id===id&&r.on_date.slice(0,7)===mk); const yr=dAgg((S.disc||[]).filter(r=>r.emp_id===id))[id];
  const yl=yr?`<div class="dcyr">${esc(t("dcYearSoFar",{y:mk.slice(0,4)}))}: ${DK.map(k=>`<span><b>${yr[k].n}</b> ${esc(t("dk_"+k))}${yr[k].d?` (${esc(t("dcDaysN",{n:dNum(yr[k].d)}))})`:""}</span>`).join(" · ")}</div>`:"";
  const fmt=d=>{ const [y,m,dd]=d.split("-").map(Number); return new Intl.DateTimeFormat(loc(),{weekday:"short",day:"numeric",month:"short"}).format(new Date(y,m-1,dd)); };
  return `<div class="dcdet">${yl}${recs.length?recs.map(r=>`<div class="dcrec k-${r.kind}"><span class="kd">${esc(t("dk_"+r.kind))}${Number(r.days)?" · "+esc(t("dcDaysN",{n:dNum(Number(r.days))})):""}</span><div class="bd"><p>${esc(r.reason||t("dcNoReason"))}</p><span>${esc(fmt(r.on_date))}${r.created_by?" · "+esc(t("dcBy",{n:dName(r.created_by)})):""}</span></div>${discCanWrite()?`<button type="button" class="x" data-del="${r.id}">${esc(t("dcDel"))}</button>`:""}</div>`).join(""):`<p class="meta" style="margin:0">${esc(t("dcNoneM"))}</p>`}
    ${discCanWrite()?`<div><button class="btn" data-add="${id}">+ ${esc(t("dcAddFor",{n:dName(id)}))}</button></div>`:""}</div>`; }

function discYearHTML(Y){ const people=dPeopleList(); const hs=isAdmin()?(S.dHotel||""):"";
  const recs=(S.disc||[]).filter(r=>(!hs||r.hotel===hs)&&(!S.dDept||r.dept===S.dDept)&&(!S.dKind||r.kind===S.dKind));
  const M={}; recs.forEach(r=>{ const mo=Number(r.on_date.slice(5,7))-1; (M[r.emp_id]=M[r.emp_id]||Array(12).fill(0))[mo]++; });
  const list=people.filter(p=>M[p.id]);
  const mn=i=>new Intl.DateTimeFormat(loc(),{month:"short"}).format(new Date(Number(Y),i,1));
  const lv=n=>!n?"z":n>=5?"l3":n>=3?"l2":"l1"; const curI=Y===dCurM().slice(0,4)?Number(dCurM().slice(5,7))-1:-1;
  const kinds=`<div class="dckpi">${DK.map(k=>{ const n=(S.disc||[]).filter(r=>r.on_date.startsWith(Y)&&r.kind===k&&(!hs||r.hotel===hs)&&(!S.dDept||r.dept===S.dDept)).length; return `<button type="button" class="dck k-${k}" data-kf="${k}" aria-pressed="${S.dKind===k}"><span class="hd"><i>${DKI[k]}</i>${esc(t("dk_"+k))}</span><span class="n">${n}</span><span class="s">${esc(t("dcInYear",{y:Y}))}</span></button>`; }).join("")}</div>`;
  if(!list.length) return kinds+`<div class="dcempty"><b>${esc(t("dcEmptyY",{y:Y}))}</b></div>`;
  list.sort((a,b)=>M[b.id].reduce((s,x)=>s+x,0)-M[a.id].reduce((s,x)=>s+x,0));
  return kinds+`<section class="dcgrp"><div class="dcgh"><h3>${esc(t("dcYearTitle",{y:Y}))}</h3><span class="meta">${esc(t("dcYearH"))}</span></div><div class="dcyg">
    <div class="dcyrow h"><span style="text-align:start">${esc(t("dcEmp"))}</span>${Array.from({length:12},(_,i)=>`<span>${esc(mn(i))}</span>`).join("")}<span>${esc(t("dcTotal"))}</span></div>
    ${list.map(p=>{ const a=M[p.id], tot=a.reduce((s,x)=>s+x,0); return `<div class="dcyrow"><span class="dcwho">${dAv(p.id)}<div><span class="n">${esc(p.full_name||"")}</span><span class="r">${esc(deptL(p.dept))}</span></div></span>${a.map((n,i)=>`<button type="button" class="dcym ${lv(n)}${i===curI?" cur":""}" data-ym="${Y}-${String(i+1).padStart(2,"0")}" data-emp="${p.id}" title="${esc(mn(i))}">${n||"·"}</button>`).join("")}<span class="dcc tot"><b>${tot}</b></span></div>`; }).join("")}</div></section>`; }

function bindDiscBody(){ const b=$("#dcBody");

/* discipline -> performance: every record takes points off a 100-point discipline score */
const DPTS={absence:3,notice:5,warning:10,penalty:15};
const discRecPts=r=>r.kind==="absence"?DPTS.absence*Math.max(1,Number(r.days)||1):DPTS[r.kind]||0;
const dDay=d=>{ const [y,m,dd]=String(d).split("-").map(Number); return new Date(y,m-1,dd).getTime(); };
function discSeesOf(id){ const p=S.profiles[id]||dP(id); if(!p) return false; if(isAdmin()) return true; if(!discPub()) return false; if(id===S.uid) return true;
  if(p.hotel!==myHotel()) return false; if(myDept()==="hr"||isGM()) return true; if(isManager()) return !myDept()||p.dept===myDept(); if(isSup()) return isAbove(S.uid,id); return false; }
function discOf(id,a,b,recs){ const L=recs||S.repDisc; if(!L||!discSeesOf(id)) return null;
  const c={absence:{n:0,d:0},notice:{n:0,d:0},warning:{n:0,d:0},penalty:{n:0,d:0}}; let pts=0,n=0;
  L.forEach(r=>{ if(r.employee!==id) return; const tm=dDay(r.on_date); if((a&&tm<a)||(b&&tm>=b)) return; c[r.kind].n++; c[r.kind].d+=Number(r.days)||0; pts+=discRecPts(r); n++; });
  return {c,pts,n,score:Math.max(0,100-pts)}; }
function discAvg(ids,a,b){ const L=ids.map(u=>discOf(u,a,b)).filter(Boolean); if(!L.length) return null; return {score:L.reduce((s,x)=>s+x.score,0)/L.length,n:L.reduce((s,x)=>s+x.n,0),pts:L.reduce((s,x)=>s+x.pts,0),ppl:L.length}; }
const discTxt=d=>!d||!d.n?t("dsNone"):DK.filter(k=>d.c[k].n).map(k=>t("dk_"+k)+" "+(k==="absence"?t("dcDaysN",{n:dNum(d.c[k].d||d.c[k].n)}):d.c[k].n)).join(" · ");
const scoreCol=v=>v==null?"var(--line)":v>=80?"var(--ok)":v>=60?"var(--warn)":"var(--bad)";
/* ================= final evaluation: KPI sheets, discipline, upward reviews, probation ================= */
const EVL={managerial:"evLvM",supervisory:"evLvS",operational:"evLvO"};
const EV_W={operational:[["kpi",60],["tasks",25],["disc",15]],supervisory:[["kpi",55],["tasks",20],["disc",5],["team",5],["up",10],["fair",5]],managerial:[["kpi",50],["tasks",20],["dept",10],["up",10],["fair",10]]};
const EV_SYS={operational:EV_W.operational.slice(1),supervisory:EV_W.supervisory.slice(1),managerial:EV_W.managerial.slice(1)};
const EV_TW=[["exec",30],["ontime",25],["speed",15],["dur",15],["quality",15]];
/* everything the task system knows about a person's work in the period: execution, deadlines, speed to start, duration, rejections */
function evTaskSet(e,a,b){ if(!e.profile_id) return null; const pid=e.profile_id, lv=evLevel(e); const now=Date.now(), bb=Math.min(b,now); const T=RT()||[];
  const inR=x=>(x.createdAt||0)>=a&&(x.createdAt||0)<bb;
  if(lv==="managerial") return T.filter(x=>inR(x)&&x.hotel===e.hotel&&(!e.dept||x.dept===e.dept));
  if(lv==="supervisory") return T.filter(x=>inR(x)&&(x.assignee===pid||supOwns(pid,x)));
  return T.filter(x=>inR(x)&&x.assignee===pid); }
const evMed=L=>{ if(!L.length) return null; const s=L.slice().sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
function evTasks(e,a,b){ const ts=evTaskSet(e,a,b); if(!ts) return null; const n=ts.length; const now=Date.now(); const T=RT()||[]; const bb=Math.min(b,now);
  const done=ts.filter(x=>x.status==="done"); const wd=ts.filter(x=>x.due&&(x.status==="done"||now>x.due)); const late=wd.filter(x=>x.status==="done"?(x.completedAt||0)>x.due:true);
  const hotelT=T.filter(x=>(x.createdAt||0)>=a&&(x.createdAt||0)<bb&&x.hotel===e.hotel);
  const st=ts.filter(x=>x.startedAt).map(x=>x.startedAt-(x.createdAt||x.startedAt)); const stB=evMed(hotelT.filter(x=>x.startedAt).map(x=>x.startedAt-(x.createdAt||x.startedAt)));
  const wk=done.map(workTime).filter(v=>v!=null&&v>0); const wkB=evMed(hotelT.filter(x=>x.status==="done").map(workTime).filter(v=>v!=null&&v>0));
  const EST={}; (S.tasks||[]).forEach(x=>{ if(x.estimate) EST[x.id]=Number(x.estimate)*36e5; });
  const withEst=done.filter(x=>EST[x.id]&&workTime(x)>0); const rej=ts.filter(x=>(x.rejections||0)>0).length;
  const avg=L=>L.length?L.reduce((p,c)=>p+c,0)/L.length:null; const aSt=evMed(st), aWk=evMed(wk);
  const m={exec:n?done.length/n*100:null, ontime:wd.length?(wd.length-late.length)/wd.length*100:null,
    speed:aSt!=null&&stB?Math.min(100,stB/Math.max(aSt,6e4)*100):null,
    dur:withEst.length>=2?avg(withEst.map(x=>Math.min(1,EST[x.id]/workTime(x))))*100:(aWk!=null&&wkB?Math.min(100,wkB/Math.max(aWk,6e4)*100):null),
    quality:n?(1-rej/n)*100:null};
  const P=EV_TW.filter(([k])=>m[k]!=null); const W=P.reduce((s0,[,w])=>s0+w,0);
  const val=n>=3&&W?P.reduce((s0,[k,w])=>s0+m[k]*w,0)/W:null;
  return {val,n,done:done.length,open:n-done.length,late:late.length,wd:wd.length,aSt,stB,aWk,wkB,est:withEst.length,rej,m}; }

function evKpis(e){ const L=(E().kpis||[]).filter(k=>k.active); const own=L.filter(k=>k.position_id&&k.position_id===e.position_id);
  if(own.length) return own.sort((a,b)=>a.sort-b.sort||a.id-b.id); const lv=evLevel(e);

const UN={pct:"%",min:"evUMin",hours:"evUHr",days:"evUDay",count:""};

function evTargetTxt(k){ if(k.dir==="down"&&Number(k.target)===0) return t("evZero"); return (k.dir==="down"?t("evAtMost"):k.unit==="pct"?"":t("evAtLeast"))+evVal(k,k.target); }

  if(g<=y&&!(k.dir==="down"&&T===0)) return t(k.dir==="up"?"evAl2Up":"evAl2Down",{g:evVal(k,k.dir==="up"?T*g/100:T*100/g)});

function evDisc(id,a,b){ const L=E().disc; if(!L) return null; const c={absence:0,notice:0,warning:0,penalty:0}; let pts=0,n=0;

function evDiscAvg(ids,a,b){ const L=ids.map(i=>evDisc(i,a,b)).filter(Boolean); if(!L.length) return null; return {score:L.reduce((s,x)=>s+x.score,0)/L.length,n:L.reduce((s,x)=>s+x.n,0),ppl:L.length}; }

function evKpiBlock(e,R,kind){ const ks=evKpis(e); const ents=kind==="prob"?(E().entries||[]).filter(x=>x.emp_id===e.id&&x.kind==="prob"):evEntries(e.id,kind||"down",R.qs);

    if(a==null){ const vs=ents.map(x=>(x.vals||{})[k.id]).filter(v=>v&&v.a!=null&&v.a!==""); if(vs.length) a=vs.reduce((s,v)=>s+Number(v.a),0)/vs.length; vs.forEach(v=>{ if(v.n) notes.push(v.n); }); }
    const p=evAch(k,a); return {k,a,auto:auto!=null,p,res:p==null?null:Number(k.weight)*p/100,notes}; });
  const W=rows.reduce((s,r)=>s+Number(r.k.weight),0), Wd=rows.filter(r=>r.p!=null).reduce((s,r)=>s+Number(r.k.weight),0);
  const val=Wd?rows.filter(r=>r.p!=null).reduce((s,r)=>s+Number(r.k.weight)*r.p,0)/Wd:null;
  return {rows,W,val,filled:rows.filter(r=>r.p!=null).length,total:rows.length,entries:ents}; }

function evUp(e,R){ const by={}; evEntries(e.id,"up",R.qs).forEach(x=>{ const v=Object.values(x.vals||{}).map(Number).filter(n=>n>=1&&n<=5); if(!v.length) return; (by[x.period]=by[x.period]||[]).push((v.reduce((s,n)=>s+n,0)/v.length-1)/4*100); });
  let n=0; const per=Object.values(by).map(L=>{ n=Math.max(n,L.length); if(L.length<3) return null; const s=L.slice().sort((a,b)=>a-b); const u=s.length>=5?s.slice(1,-1):s; return u.reduce((a,b)=>a+b,0)/u.length; }).filter(v=>v!=null);
  return {val:per.length?per.reduce((a,b)=>a+b,0)/per.length:null,n}; }
function evTeam(e){ return Object.values(E().emp||{}).filter(x=>x.active&&x.id!==e.id&&evAbove(e.id,x.id)).map(x=>x.id); }
function evDirect(e){ return Object.values(E().emp||{}).filter(x=>x.active&&x.manager_id===e.id).map(x=>x.id); }
function evFair(e,R){ const team=evDirect(e); if(!team.length) return null;
  const rated=team.filter(id=>evEntries(id,"down",R.qs).length); const comp=rated.length/team.length;
  let inc=0, high=0; rated.forEach(id=>{ const x=evEmp(id); const kb=evKpiBlock(x,R); const d=evDisc(id,R.a,R.b); if(kb.val!=null&&kb.val>=95){ high++; if(d&&d.score<70) inc++; } });
  const lenient=rated.length>=4&&high/rated.length>=0.9; const v=Math.max(0,Math.min(100,100*(0.5*comp+0.5*(rated.length?1-inc/rated.length:0))-(lenient?20:0)));
  return {val:v,comp,inc,lenient,rated:rated.length,team:team.length}; }

/* the full score for one employee in a period */
function evScore(e,P){ const R=P.kind==="PROB"?evProbRange(e):evRange(P); const lv=evLevel(e); const kb=evKpiBlock(e,R,P.kind==="PROB"?"prob":"down");
  const sys=[]; const flags=[];
  (EV_SYS[lv]||[]).forEach(([k,w])=>{ let v=null, info=null;
    if(k==="tasks"){ const x=evTasks(e,R.a,R.b); v=x&&x.val; info=x; if(x&&x.val==null&&x.n) flags.push(["fewTasks",{n:x.n}]); }
    else if(k==="disc"){ const d=evDisc(e.id,R.a,R.b); v=d&&d.score; info=d; }
    else if(k==="team"){ const d=evDiscAvg(evTeam(e).concat([e.id]),R.a,R.b); v=d&&d.score; info=d; }
    else if(k==="dept"){ const ids=Object.values(E().emp||{}).filter(x=>x.active&&x.hotel===e.hotel&&x.dept===e.dept).map(x=>x.id); const d=evDiscAvg(ids,R.a,R.b); v=d&&d.score; info=d; }
    else if(k==="up"&&P.kind!=="PROB"){ const u=evUp(e,R); v=u.val; info=u; if(u.val==null) flags.push(["upFew",{n:u.n}]); }
    else if(k==="fair"&&P.kind!=="PROB"){ const f=evFair(e,R); v=f&&f.val; info=f; if(f&&f.lenient) flags.push(["lenient",{}]); if(f&&f.comp<1) flags.push(["notRated",{n:f.team-f.rated}]); }
    sys.push({k,w,v,info}); });
  const kw=(EV_W[lv]||[]).find(x=>x[0]==="kpi")[1];
  const parts=[[kb.val,kw]].concat(sys.map(s=>[s.v,s.w])); const av=parts.filter(x=>x[0]!=null&&x[1]>0); const tw=av.reduce((s,x)=>s+x[1],0);
  const manualMissing=kb.rows.some(r=>!r.auto)&&!kb.entries.length;
  const score=kb.val!=null&&!manualMissing&&tw?av.reduce((s,x)=>s+x[0]*x[1],0)/tw:null;
  if(!kb.entries.length&&kb.rows.some(r=>!r.auto)) flags.unshift(["noSheet",{}]); else if(kb.filled<kb.total) flags.push(["partial",{a:kb.filled,b:kb.total}]);
  const d=sys.find(s=>s.k==="disc"); if(kb.val!=null&&kb.val>=95&&d&&d.v!=null&&d.v<70) flags.push(["inflate",{}]);
  if(P.kind!=="PROB"){ const sb=evKpiBlock(e,R,"self"); if(sb.val!=null&&kb.val!=null&&Math.abs(sb.val-kb.val)>=20) flags.push(["selfGap",{s:Math.round(sb.val),m:Math.round(kb.val)}]); }
  if(!kb.total) flags.unshift(["noKpi",{}]);
  return {e,lv,kb,kw,sys,score:score==null?null:Math.round(score*10)/10,grade:evGrade(score),flags,R}; }
function evProbRange(e){ const h=e.hire_date?dDay(e.hire_date):dDay(dayKey(Date.now())); const b=h+(Number(e.probation_days)||90)*864e5; return {a:h,b,qs:["PROB"],end:b}; }

/* ---------- loading ---------- */
async function loadEval(){ const P=evPeriod(); const y=P.year;
  const q=(tb,sel)=>S.sb.from(tb).select(sel||"*");
  const [em,po,kp,en,rs,ds,rt]=await Promise.all([q("employees").order("full_name"),q("positions").order("dept").order("sort"),q("kpis").order("sort"),
    q("eval_entries").or(`period.like.${y}-%,period.eq.PROB`),q("eval_results"),
    q("disc_records","emp_id,kind,days,on_date").gte("on_date",(y-1)+"-01-01").limit(20000),
    S.repTasks?Promise.resolve(null):S.sb.rpc("report_tasks",{p_hotel:null})]);
  for(const r of [em,po,kp,en,rs]) if(r.error) throw r.error;
  if(rt&&!rt.error&&rt.data) S.repTasks=rt.data.map(r=>({id:r.id,hotel:r.hotel,dept:r.dept,assignee:r.assignee,reporter:r.reporter,transfer:r.transferred_by?{by:r.transferred_by}:null,parentId:r.parent_id,parentAssignee:r.parent_assignee,status:r.status,due:ms(r.due),createdAt:ms(r.created_at),startedAt:ms(r.started_at),submittedAt:ms(r.submitted_at),completedAt:ms(r.completed_at),rejections:r.rejections}));
  if(!S.targets) await loadTargets();
  const emp={}; (em.data||[]).forEach(x=>emp[x.id]=x); const pos={}; (po.data||[]).forEach(x=>pos[x.id]=x);
  S.ev={emp,pos,kpis:kp.data||[],entries:en.data||[],results:rs.data||[],disc:ds.error?null:(ds.data||[]),year:y}; S.evErr=null; }

/* ---------- dialogs ---------- */
function evModal(cls,html){ const d=document.createElement("div"); d.className="dlg "+cls; d.innerHTML=`<div class="in" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(d);
  const close=()=>d.remove(); d.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); }); d.addEventListener("click",e=>{ if(e.target===d||e.target.hasAttribute("data-x")) close(); }); return {d,close}; }
const evErr=(d,m)=>{ const e=d.querySelector(".dcerr"); if(e){ e.textContent=m; e.hidden=false; } };

/* the evaluation sheet (same layout as the paper form) */
function evSheet(id,P,kindIn){ const e=evEmp(id); if(!e) return; const kind=kindIn||(P.kind==="PROB"?"prob":"down"); const prob=P.kind==="PROB";
  const sc=evScore(e,P); const R=sc.R; const editable=prob||P.kind==="Q"; const period=prob?"PROB":evRange(P).qs[0];
  const ent=(E().entries||[]).find(x=>x.emp_id===id&&x.kind===kind&&x.period===period)||null;
  const kb=kind==="self"?evKpiBlock(e,R,"self"):sc.kb; const pos=evPos(e.position_id); const mgr=e.manager_id?evEmp(e.manager_id):null;
  const rows=kb.rows.map(r=>{ const k=r.k; const v=ent&&ent.vals&&ent.vals[k.id]; const cur=editable&&!r.auto?(v&&v.a!=null?v.a:""):r.a; const c=evCol(k,r.p);
    return `<tr data-k="${k.id}"><td class="kn">${esc(k.name)}</td><td class="kd">${esc(k.definition)}</td><td class="kf">${esc(k.formula)}</td><td>${esc(t(k.freq==="monthly"?"evMonthly":"evQuarterly"))}</td>
      <td class="tg">${esc(evTargetTxt(k))}</td><td class="al">${esc(evAlertTxt(k))}</td><td>${evNum(k.weight)}%</td>
      <td class="act">${editable&&!r.auto?`<input class="field kin" type="number" step="any" min="0" data-ka="${k.id}" value="${cur===""?"":esc(String(cur))}" aria-label="${esc(t("evActual"))}"><input class="field knote" data-kn="${k.id}" placeholder="${esc(t("evEvidence"))}" value="${esc((v&&v.n)||"")}">`:`<b>${r.a==null?"—":esc(evVal(k,r.a))}</b>${r.auto?`<small class="auto">${esc(t("evFromSys"))}</small>`:""}`}</td>
      <td class="res ${c}" data-res="${k.id}">${r.res==null?"—":evNum(r.res)+"%"}</td></tr>`; }).join("");
  const sysRows=kind==="self"?"":sc.sys.map(s=>{ const lab=t("evS_"+s.k); let det="";
    if(s.info&&(s.k==="disc"||s.k==="team"||s.k==="dept")) det=s.k==="disc"?(s.info.n?discTxt({c:Object.fromEntries(DK.map(k=>[k,{n:s.info.c[k],d:0}])),n:s.info.n}):t("dsNone")):t("evDiscPpl",{p:s.info.ppl,n:s.info.n});
    if(s.k==="up") det=s.info&&s.info.val!=null?t("evUpN",{n:s.info.n}):t("evUpFew",{n:(s.info&&s.info.n)||0});
    if(s.k==="tasks") det=!s.info?t("evNoAcctT"):s.info.n<3?t("evTasksFew",{n:s.info.n}):t("evTasksD",{n:s.info.n,d:s.info.done,l:s.info.late,r:s.info.rej});
    if(s.k==="fair"&&s.info) det=t("evFairD",{r:s.info.rated,t:s.info.team})+(s.info.lenient?" · "+t("evLenient"):"");
    return `<tr class="sys"><td class="kn">${esc(lab)}</td><td class="kd">${esc(t("evSD_"+s.k))}${det?` <em>(${esc(det)})</em>`:""}</td><td>${s.w}%</td><td><b>${s.v==null?"—":Math.round(s.v)+"%"}</b><small class="auto">${esc(t("evFromSys"))}</small></td><td class="res">${s.v==null?"—":evNum(s.w*s.v/100)+"%"}</td></tr>`; }).join("");
  const kRes=kb.rows.reduce((s,r)=>s+(r.res||0),0);
  const taskBlock=kind==="self"?"":(()=>{ const x=(sc.sys.find(s=>s.k==="tasks")||{}).info; if(!x||!x.n) return ""; const d=v=>v==null?"—":dur(v);
    const cell=(k,sub)=>`<div class="evtm"><span>${esc(t("evT_"+k))} <em>${EV_TW.find(z=>z[0]===k)[1]}%</em></span><b style="color:${scoreCol(x.m[k])}">${x.m[k]==null?"—":Math.round(x.m[k])+"%"}</b><small>${esc(sub)}</small></div>`;
    return `<div class="evtasks"><div class="hd"><b>${esc(t("evTasksTitle"))}</b><span class="meta">${esc(t(sc.lv==="managerial"?"evTasksDept":sc.lv==="supervisory"?"evTasksSup":"evTasksOwn"))}</span><span class="evsc" style="--c:${scoreCol(x.val)}"><b>${x.val==null?"—":Math.round(x.val)}</b></span></div><div class="evtg">
      ${cell("exec",t("evT_execD",{d:x.done,n:x.n}))}${cell("ontime",t("evT_ontimeD",{l:x.late,n:x.wd}))}${cell("speed",t("evT_speedD",{a:d(x.aSt),b:d(x.stB)}))}${cell("dur",x.est>=2?t("evT_durE",{n:x.est}):t("evT_durD",{a:d(x.aWk),b:d(x.wkB)}))}${cell("quality",t("evT_qualD",{r:x.rej}))}</div></div>`; })();
  const upBlock=kind!=="self"&&!prob&&sc.lv!=="operational"?(()=>{ const ups=evEntries(e.id,"up",R.qs); const n=ups.length;
    const per=EV_UPQ.map((q,i)=>{ const v=ups.map(x=>Number((x.vals||{})["q"+(i+1)])).filter(v=>v>=1); return n>=3&&v.length?v.reduce((a,b)=>a+b,0)/v.length:null; });
    return `<div class="evup"><div class="hd"><b>${esc(t("evUpTitle"))}</b><span class="meta">${esc(n>=3?t("evUpN",{n}):t("evUpFew",{n}))}</span>${isAdmin()&&P.kind==="Q"?`<button class="btn sm" id="evUpPaper">+ ${esc(t("evUpPaper"))}</button>`:""}</div>
      ${n>=3?EV_UPQ.map((q,i)=>`<div class="uq"><span>${esc(t(q))}</span><i><b style="width:${per[i]==null?0:(per[i]-1)/4*100}%"></b></i><em>${per[i]==null?"—":per[i].toFixed(1)}/5</em></div>`).join(""):`<p class="meta">${esc(t("evUpHide"))}</p>`}</div>`; })():"";
  const flags=kind==="self"?"":sc.flags.filter(f=>!["noSheet"].includes(f[0])).map(f=>`<li class="${["inflate","selfGap","lenient"].includes(f[0])?"bad":""}">${esc(t("evF_"+f[0],f[1]))}</li>`).join("");
  const trend=!prob&&P.kind!=="Q"?(()=>{ const qs=evRange(P).qs.map(q=>{ const [y,i]=q.split("-Q"); const s=evScore(e,{kind:"Q",year:Number(y),idx:Number(i)}); return [q,s.score]; });
    return `<div class="evtrend"><b>${esc(t("evTrend"))}</b>${qs.map(([q,v])=>`<span><i style="height:${v==null?4:Math.max(6,v)}%;background:${evGradeCol(evGrade(v))}"></i><small>${esc(q.split("-")[1])}</small><em>${v==null?"—":Math.round(v)}</em></span>`).join("")}</div>`; })():"";
  const canEdit=editable&&(isAdmin()||(evPub()&&((kind==="self"&&e.profile_id===S.uid)||(kind!=="self"&&evMine()&&evAbove(evMine().id,e.id)))));
  const title=t(prob?"evProbForm":kind==="self"?"evSelfForm":"evForm");
  const hotelN=hotelL(e.hotel)||"";
  const {d,close}=evModal("evsheet",`<div class="evpaper" id="evPaper"><div class="evph"><span class="brand">HWAIDAK HOTELS</span><h3>${esc(title)}</h3><span class="brand">${esc(hotelN)}</span></div>
    <table class="evinfo"><tr><th>${esc(t("evIName"))}</th><td>${esc(e.full_name)}</td><th>${esc(t("evIPos"))}</th><td>${esc(pos?pos.title+(pos.title_ar?" ("+pos.title_ar+")":""):t("evNoPos"))}</td></tr>
      <tr><th>${esc(t("evIDept"))}</th><td>${esc(deptL(e.dept))}</td><th>${esc(t("evILevel"))}</th><td>${esc(t(EVL[sc.lv]))}</td></tr>
      <tr><th>${esc(t("evIHire"))}</th><td>${esc(e.hire_date||"—")}</td><th>${esc(t("evIMgr"))}</th><td>${esc(mgr?mgr.full_name:"—")}</td></tr>
      <tr><th>${esc(t("evIPeriod"))}</th><td>${esc(prob?t("evProbPer",{a:dayKey(R.a),b:dayKey(R.b)}):evPLabel(P))}</td><th>${esc(t("evICode"))}</th><td>${esc(e.code||"—")}</td></tr></table>
    ${kb.total?`<div class="evtw"><table class="evtbl"><thead><tr><th>${esc(t("evH1"))}</th><th>${esc(t("evH2"))}</th><th>${esc(t("evH3"))}</th><th>${esc(t("evH4"))}</th><th>${esc(t("evH5"))}</th><th>${esc(t("evH6"))}</th><th>${esc(t("evH7"))}</th><th>${esc(t("evH8"))}</th><th>${esc(t("evH9"))}</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td colspan="6">${esc(t("evSumKpi"))}</td><td>${evNum(kb.W)}%</td><td></td><td id="evTot">${evNum(kRes)}%</td></tr></tfoot></table></div>
    ${kind==="self"?"":`<h4 class="evfh">${esc(t("evFinalT"))}</h4><div class="evtw"><table class="evtbl fin"><thead><tr><th>${esc(t("evFC"))}</th><th>${esc(t("evFD"))}</th><th>${esc(t("evH7"))}</th><th>${esc(t("evH8"))}</th><th>${esc(t("evH9"))}</th></tr></thead><tbody>
      <tr><td class="kn">${esc(t("evKpiPart"))}</td><td class="kd">${esc(t("evKpiPartD",{r:evNum(kRes),w:evNum(kb.W)}))}</td><td>${sc.kw}%</td><td><b>${kb.val==null?"—":Math.round(kb.val)+"%"}</b></td><td class="res">${kb.val==null?"—":evNum(sc.kw*kb.val/100)+"%"}</td></tr>
      ${sysRows}</tbody><tfoot><tr><td colspan="2">${esc(t("evSum"))}</td><td>100%</td><td></td><td>${sc.score==null?"—":Math.round(sc.score)+"%"}</td></tr></tfoot></table></div>`}`:`<div class="dcempty"><b>${esc(t("evF_noKpi"))}</b><span>${esc(t("evNoKpiH"))}</span></div>`}
    ${kind!=="self"?`<div class="evgrade" style="--c:${evGradeCol(sc.grade)}"><b>${sc.score==null?"—":Math.round(sc.score)}</b><span>${sc.grade?esc(t("evG"+sc.grade)):esc(t("evNoScore"))}</span></div>`:""}
    ${taskBlock}${trend}${upBlock}${flags?`<ul class="evflags">${flags}</ul>`:""}
    ${prob?`<div class="evrecs"><b>${esc(t("evRecQ"))}</b>${["confirm","extend","terminate"].map(r=>`<label><input type="radio" name="evRec" value="${r}"${ent&&ent.recommendation===r?" checked":""}${canEdit?"":" disabled"}> ${esc(t("evRec_"+r))}</label>`).join("")}</div>`:""}
    <label class="lb evnote">${esc(t("evNotes"))}<textarea class="field" id="evNote" rows="3" maxlength="3000"${canEdit?"":" disabled"}>${esc((ent&&ent.note)||"")}</textarea></label>
    ${ent?`<p class="meta">${esc(t("evBy",{n:nameOf(ent.rater),d:fmtD(ms(ent.updated_at))}))}${ent.on_behalf?" · "+esc(t("evOnBehalf",{n:evName(ent.on_behalf)})):""}</p>`:""}
    <div class="evsign">${["evSgEmp","evSgMgr","evSgHead","evSgHR"].map(k=>`<div><span>${esc(t(k))}</span><i></i></div>`).join("")}</div></div>
    <p class="dcerr" hidden></p>
    <div class="actions evsa"><button class="btn" data-x>${esc(t("close"))}</button><button class="btn" id="evPrint">${esc(t("evPrint"))}</button>${!prob&&kind==="down"&&isAdmin()?`<button class="btn" id="evSelfV">${esc(t("evSeeSelf"))}</button>`:""}${canEdit&&kb.total?`<button class="btn primary" id="evSave">${esc(t("save"))}</button>`:""}</div>`);
  // live result while typing
  d.querySelectorAll("[data-ka]").forEach(inp=>inp.oninput=()=>{ const k=kb.rows.find(r=>String(r.k.id)===inp.dataset.ka).k; const p=evAch(k,inp.value); const c=d.querySelector(`[data-res="${k.id}"]`); c.textContent=p==null?"—":evNum(Number(k.weight)*p/100)+"%"; c.className="res "+evCol(k,p); });
  d.querySelector("#evPrint").onclick=()=>{ document.body.classList.add("evprinting"); window.print(); setTimeout(()=>document.body.classList.remove("evprinting"),500); };
  if(d.querySelector("#evSelfV")) d.querySelector("#evSelfV").onclick=()=>{ close(); evSheet(id,P,"self"); };
  if(d.querySelector("#evUpPaper")) d.querySelector("#evUpPaper").onclick=()=>{ close(); evUpDialog(id,P,true); };
  if(d.querySelector("#evSave")) d.querySelector("#evSave").onclick=async ev=>{ const vals={}; let miss=0, needNote=null;
    d.querySelectorAll("[data-ka]").forEach(inp=>{ const kid=inp.dataset.ka; const a=inp.value.trim(); const n=d.querySelector(`[data-kn="${kid}"]`).value.trim(); if(a===""){ miss++; return; }
      const k=kb.rows.find(r=>String(r.k.id)===kid).k; const p=evAch(k,a); if(p!=null&&p<Number(k.yellow)&&!n&&!needNote) needNote=k.name; vals[kid]={a:Number(a),n}; });
    if(needNote) return evErr(d,t("evNeedNote",{k:needNote}));
    const rec=prob?(d.querySelector('[name="evRec"]:checked')||{}).value||null:null; if(prob&&!rec&&!miss) return evErr(d,t("evNeedRec"));
