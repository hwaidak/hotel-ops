<style>

  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand h1{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brass);color:var(--surface);font-size:11px;font-weight:700;display:inline-grid;place-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:14px}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.toolbar .field{width:auto}
.toolbar .search{flex:1 1 200px;max-width:320px}
.toolbar select{flex:0 1 160px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none;font-size:13px}
.chk input{accent-color:var(--accent);width:16px;height:16px}

main{padding-block:0 40px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--surface-2);border-radius:10px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.col.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.col.nodrop{opacity:.55}
.colhead{display:flex;align-items:center;gap:8px;padding:2px 4px 6px;font-weight:600}
.colhead .dot{width:9px;height:9px;border-radius:50%}
.colhead .cnt{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-inline-start:3px solid var(--line)}
.card:hover{border-color:var(--accent)}
.card[data-pri="urgent"]{border-inline-start-color:var(--bad)}
.card[data-pri="high"]{border-inline-start-color:var(--warn)}
.card[data-pri="normal"]{border-inline-start-color:var(--info)}
.card.dragging{opacity:.4}
.card.mini{padding:7px 10px;gap:3px;border-inline-start-color:var(--ok)} .card.mini .t{font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .card.mini .av{width:20px;height:20px;font-size:10px;flex:none}
.card .t{font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.brass{background:var(--brass-soft);color:var(--brass)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.av{width:24px;height:24px;border-radius:50%;flex:none;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:600}
.av.lg{width:34px;height:34px;font-size:14px}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0}
.who span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-col{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:8px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface)}
th.sort{cursor:pointer} th.sort:hover{color:var(--fg)}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
td .t{font-weight:600}
td .field{width:auto}

.h2{font-family:var(--f-display);font-size:18px;font-weight:600;margin:20px 0 10px}
.sub{color:var(--muted);margin:-4px 0 14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.alert b{color:var(--bad)} .kpi.wait b{color:var(--brass)}
.dlayout{display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr);gap:18px;align-items:start}
.calcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;position:sticky;top:12px}
.calhead{display:flex;align-items:center;gap:8px}
.calhead h2{margin:0;font-size:20px;font-weight:800;flex:1;letter-spacing:-.01em}
.icbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;font:inherit;font-size:16px}
.icbtn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)} .icbtn[disabled]{opacity:.3;cursor:default}
.nowbtn{border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 12px;cursor:pointer}
.msum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:8px 4px}
.msum div{text-align:center;display:grid;gap:1px} .msum div+div{border-inline-start:1px solid var(--line)}
.msum b{font-size:18px;font-variant-numeric:tabular-nums} .msum span{font-size:11.5px;color:var(--muted)}
.mwarn{display:grid;gap:6px}
.mwarn button{display:flex;align-items:center;gap:8px;text-align:start;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calh{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:2px;font-weight:600}
.calc{aspect-ratio:1/1;min-width:0;position:relative;overflow:hidden;border-radius:11px;border:1.5px solid transparent;background:var(--surface-2);padding:5px 7px;text-align:start;font:inherit;color:var(--fg);cursor:pointer;display:block}
.calc .fill{position:absolute;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--ok) 26%,transparent);transition:height .3s}
.calc .dn{position:relative;z-index:1;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.calc .lf{position:absolute;z-index:1;bottom:5px;inset-inline-end:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:10.5px;font-weight:800;display:grid;place-items:center;color:#fff}
.calc .tk{position:absolute;z-index:1;bottom:5px;inset-inline-start:6px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.calc.none{background:transparent;border-color:var(--line)} .calc.none .dn{color:var(--muted);font-weight:600}
.calc.future{background:transparent;border-color:transparent;cursor:default} .calc.future .dn{color:var(--line);font-weight:600}
.calc.blank{visibility:hidden}
.calc.open{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 55%,transparent)} .calc.open .lf{background:var(--warn)}
.calc.late{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 55%,transparent)} .calc.late .lf{background:var(--bad)}
.calc.closed{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)} .calc.closed .lf{background:var(--ok)}
.calc.today .dn::after{content:"";display:block;width:14px;height:3px;border-radius:2px;background:var(--accent);margin-top:3px}
.calc.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.calc:not(.future):not(.blank):hover{border-color:var(--accent)}
.calc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.dpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dptop{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dpnum{font-size:52px;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.03em}
.dpname{display:grid;gap:3px;flex:1;min-width:160px} .dpname b{font-size:18px} .dpname span{font-size:13px;color:var(--muted)}
.dpstate{border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;white-space:nowrap}
.dpstate.open{background:var(--warn-soft);color:var(--warn)} .dpstate.late{background:var(--bad-soft);color:var(--bad)} .dpstate.closed{background:var(--ok-soft);color:var(--ok)} .dpstate.empty{background:var(--surface-2);color:var(--muted)}
.dpbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(140px,1.4fr);gap:0;border-bottom:1px solid var(--line)}
.dpbar>div{padding:12px 16px;display:grid;gap:2px} .dpbar>div+div{border-inline-start:1px solid var(--line)}
.dpbar b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1} .dpbar span{font-size:12px;color:var(--muted)}
.dpbar .meter{height:8px;width:100%;margin-top:6px}
.dpcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px 20px 20px}
.dpcol{display:grid;gap:8px;align-content:start;min-width:0}
.dpcol h4{margin:0;font-size:13.5px;display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.dpcol h4 .num{margin-inline-start:auto;color:var(--muted);font-weight:600}
.dpcard{display:grid;gap:5px;min-width:0;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font:inherit;color:inherit}
.dpcard:hover{border-color:var(--accent)} .dpcard .ht{font-size:13.5px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dpcard .dm{display:flex;align-items:center;gap:6px;min-width:0;font-size:11.5px;color:var(--muted)} .dpcard .dm .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpcard .av{width:20px;height:20px;font-size:10px;flex:none}
.dpempty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.dpnone{font-size:12.5px;color:var(--muted);padding:10px 2px}
@media (max-width:1000px){ .dlayout{grid-template-columns:minmax(0,1fr)} .calcard{position:static} .dpbar{grid-template-columns:repeat(4,minmax(0,1fr))} .dpbar>div:last-child{grid-column:1/-1;border-inline-start:0;border-top:1px solid var(--line)} }
/* list page */
.lstop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px}

.lsbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.mbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}

.ststrip{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.stb{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;font:inherit;cursor:pointer;color:var(--muted);border-top:3px solid var(--c)}

.kcol{font-family:var(--f-mono,monospace);font-size:12px;color:var(--muted);white-space:nowrap;width:1%}
.tcol{min-width:240px} .tcol .t{font-weight:700;font-size:14px;line-height:1.35}

.lateTxt{color:var(--bad);font-weight:700}
tr.grp td{background:var(--bg);padding:14px 14px 6px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px}

.lsempty{text-align:center;color:var(--muted);padding:40px!important}

.pcol{min-width:200px;width:26%;white-space:nowrap} .pcol .meta{margin-top:2px;margin-inline-start:34px}

/* ================= roles & permissions (mirror of the server rules) ================= */
const myRole=()=>S.me&&S.me.active&&S.me.role!=="pending"?S.me.role:null;
const isAdmin=()=>myRole()==="admin"; const isGM=()=>myRole()==="gm"; const isSup=()=>myRole()==="supervisor"; const isManager=()=>myRole()==="manager";
const isMember=()=>!!myRole(); const myDept=()=>(S.me&&S.me.dept)||""; const myHotel=()=>(S.me&&S.me.hotel)||"";
const canManageMembers=()=>isAdmin()||isGM()||isManager();
const assignableRoles=()=>isAdmin()?ROLE_KEYS:isGM()?["manager","supervisor","staff"]:isManager()?["supervisor","staff"]:["staff"];
const inScope=id=>{ const p=S.profiles[id]; return !!p&&p.hotel===myHotel()&&(!myDept()||p.dept===myDept()); };
const isDeptBoss=id=>(isManager()||isSup())&&inScope(id);
const nameOf=id=>!id?t("unassigned"):(S.profiles[id]&&S.profiles[id].full_name)||t("someone");
const deptL=c=>{ const r=S.deptRows.find(d=>d.name===c); return r?(LANG==="ar"?r.label_ar:r.label_en)||c:(c||""); };
const hotelL=c=>{ const r=S.hotelRows.find(h=>h.code===c); return r?(LANG==="ar"?r.name_ar:r.name_en):(c||""); };
function isAbove(boss,emp){ if(!boss||!emp) return false; let cur=S.profiles[emp], n=0; while(cur&&cur.reports_to&&n<25){ if(cur.reports_to===boss) return true; cur=S.profiles[cur.reports_to]; n++; } return false; }
const activeMembers=()=>Object.values(S.profiles).filter(p=>p.active&&p.role!=="pending").map(p=>p.id).sort((a,b)=>nameOf(a).localeCompare(nameOf(b),LANG));
const subordinates=()=>(isManager()||isSup()||isGM()||isAdmin())?activeMembers().filter(id=>isAbove(S.uid,id)):[];
function canAssignTo(id,hotel){ const p=S.profiles[id]; if(!p||!p.active||p.role==="pending"||p.role==="admin") return false; if(isAdmin()) return !hotel||p.hotel===hotel;
  if(p.hotel!==myHotel()) return false; if(isGM()||id===S.uid) return true;
  return (isManager()||isSup())&&(isAbove(S.uid,id)||inScope(id)||["manager","supervisor","gm"].includes(p.role)); }
const RANK={admin:5,gm:4,manager:3,supervisor:2,staff:1}; const rankOf=id=>RANK[(S.profiles[id]||{}).role]||0;
const needsBoss=x=>!!x.assignee&&!!x.reporter&&x.assignee!==x.reporter&&(S.profiles[x.assignee]||{}).role==="supervisor"&&["manager","gm","admin"].includes((S.profiles[x.reporter]||{}).role);
const canApprove=x=>isAdmin()||(x.hotel===myHotel()&&(isGM()||(!!x.assignee&&x.assignee!==S.uid&&(isAbove(S.uid,x.assignee)||(isDeptBoss(x.assignee)&&(RANK[myRole()]||0)>rankOf(x.assignee))||x.reporter===S.uid||(x.prevAssignees||[]).includes(S.uid)))));
const canEditFields=x=>!x||isAdmin()||(isGM()&&x.hotel===myHotel())||x.reporter===S.uid;
const heads=hotel=>activeMembers().filter(id=>{ const p=S.profiles[id]; return p.role==="admin"||(["manager","supervisor","gm"].includes(p.role)&&p.hotel===hotel); });
const colorOf=id=>{ let h=0; for(const c of String(id||"x")) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 38% 42%)`; };
const av=(id,lg)=>`<span class="av${lg?" lg":""}" style="background:${colorOf(id)}">${esc((nameOf(id).trim().charAt(0))||"?")}</span>`;

  catch(e){ netState(false); clearTimeout(S.retryT); S.retryT=setTimeout(()=>{ if(!S.ready) loadAll(); },6000); $("#main").innerHTML=`<div class="gate"><h2>${esc(t("loadErr"))}</h2><p>${esc(errText(e))}</p><div><button class="btn" onclick="location.reload()">${esc(t("retry"))}</button></div></div>`; } }
let chan=null, timers={};
function later(k,fn){ clearTimeout(timers[k]); timers[k]=setTimeout(fn,350); }
function subscribe(){ if(chan) return;
  chan=S.sb.channel("ops")
   .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},()=>later("t",async()=>{await loadTasks().catch(()=>{});render();}))
   .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>later("p",async()=>{const was=isMember();await loadProfiles().catch(()=>{}); if(!was&&isMember()){await loadMeta();await loadTasks().catch(()=>{});} S.builtView=null; render();}))
   .on("postgres_changes",{event:"*",schema:"public",table:"departments"},()=>later("d",async()=>{await loadMeta().catch(()=>{}); if(S.view!=="depts") S.builtView=null; render();}))
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"task_comments"},p=>{ if(p.new&&p.new.task_id===S.openId) later("c",()=>loadThread(S.openId)); })
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"task_events"},p=>{ if(p.new&&p.new.task_id===S.openId) later("c",()=>loadThread(S.openId)); })
   .subscribe();
  if(!S.pollOn){ S.pollOn=true; setInterval(async()=>{ if(document.hidden) return; try{ const was=isMember(); await loadProfiles(); if(isMember()){ if(!was) await loadMeta(); await loadTasks(); } netState(true); render(); }catch(e){ netState(false); heal("poll"); } },60000); }
}
function netState(ok){ let b=$("#netBar"); if(ok){ if(b) b.hidden=true; return; }
  if(!b){ b=document.createElement("div"); b.id="netBar"; document.body.appendChild(b); }
  b.innerHTML=`<span>${esc(t("netLost"))}</span><button type="button">${esc(t("netRetry"))}</button>`; b.hidden=false; b.querySelector("button").onclick=()=>heal("manual",true); }
let healing=false, lastHeal=0;
async function heal(why,force){ if(!S.sb||healing) return; if(!force&&Date.now()-lastHeal<8000) return; healing=true; lastHeal=Date.now();
  try{
    const {data,error}=await S.sb.auth.getSession(); if(error) throw error;
    let ses=data.session;
    if(ses&&ses.expires_at&&ses.expires_at*1000-Date.now()<60000){ const r=await S.sb.auth.refreshSession(); if(r.error) throw r.error; ses=r.data.session; }
    if(!ses){ if(S.session){ S.session=null; S.uid=null; S.ready=false; render(); } netState(true); return; }
    S.session=ses;
    if(!S.ready){ await loadAll(); }
    else { const was=isMember(); await loadProfiles(); if(isMember()){ if(!was) await loadMeta(); await loadTasks(); } render(); }
    if(chan&&chan.state!=="joined"&&chan.state!=="joining"){ try{ S.sb.removeChannel(chan); }catch(e){} chan=null; subscribe(); }
    netState(true);
  }catch(e){ netState(false); clearTimeout(S.healT); S.healT=setTimeout(()=>heal("retry",true),10000); }
  finally{ healing=false; } }

/* ================= task rules ================= */
const isLate=x=>x.due&&(x.status==="done"?(x.completedAt||0)>x.due:Date.now()>x.due);
const workTime=x=>x.startedAt?((x.completedAt||(x.status==="review"&&x.submittedAt)||Date.now())-x.startedAt):null;
const keyOf=x=>(S.settings.prefix||"HTL")+"-"+String(x.num||0).padStart(3,"0");
const T=id=>S.tasks.find(x=>String(x.id)===String(id));
const childrenOf=id=>S.tasks.filter(x=>x.parentId===id);
function allowed(x,to){ if(!x||x.status===to) return false; const from=x.status;
  if(canApprove(x)&&(to!=="rejected"||from==="review")) return true;
  if(x.assignee!==S.uid) return false; const na=x.needsApproval!==false||needsBoss(x);
  return (from==="todo"&&to==="progress")||(from==="rejected"&&to==="progress")||(from==="progress"&&to==="review"&&na)||(from==="progress"&&to==="done"&&!na)||(from==="review"&&to==="progress"); }
function actLabel(x,to){ const f=x.status;
  if(to==="progress") return t(f==="todo"?"a_start":f==="rejected"?"a_redo":f==="review"?"a_withdraw":"a_reopen");
  if(to==="review") return t("a_submit"); if(to==="done") return t(f==="review"?"a_approve":"a_finish");
  if(to==="rejected") return t("a_reject"); return t("a_back"); }
async function transition(x,to,note){
  await call(S.sb.rpc("transition_task",{p_id:x.id,p_to:to,p_note:note||null}), to==="done"&&x.status==="review"?t("tApproved"):to==="rejected"?t("tRejected"):t("tMoved",{s:stL(to)}));
  await loadTasks(); render(); if(S.openId===x.id) loadThread(x.id); }
function requestTransition(x,to){ if(!x) return;
  if(to==="rejected") return ask({title:t("rejDlg"),label:t("rejDlgL"),required:true,okText:t("rejDlgOk"),danger:true}).then(n=>n!=null&&transition(x,to,n).catch(()=>{}));
  if(to==="done"&&canApprove(x)) return ask({title:t("apprDlg"),label:t("apprDlgL"),okText:t("approve")}).then(n=>n!=null&&transition(x,to,n).catch(()=>{}));
  return transition(x,to).catch(()=>{}); }

function ask(o){ return new Promise(res=>{ const d=document.createElement("div"); d.className="dlg";
  d.innerHTML=`<div class="in" role="dialog" aria-modal="true"><h4>${esc(o.title)}</h4>${o.text?`<p class="meta" style="margin:0">${esc(o.text)}</p>`:""}
  ${o.html||""}${o.noInput?"":`<label class="lb">${esc(o.label||"")}<textarea class="field" id="dlgIn" rows="3"></textarea></label>`}
  <div class="actions" style="justify-content:flex-end"><button class="btn" data-x>${esc(t("cancel"))}</button><button class="btn ${o.danger?"bad":"primary"}" data-ok>${esc(o.okText||t("ok"))}</button></div></div>`;
  document.body.appendChild(d); const inp=d.querySelector("#dlgIn"); (inp||d.querySelector("[data-ok]")).focus();
  const close=v=>{d.remove();res(v);};
  d.addEventListener("click",e=>{ if(e.target===d||e.target.hasAttribute("data-x")) close(null);
    if(e.target.hasAttribute("data-ok")){ if(o.pick){ const el=d.querySelector(o.pick); if(!el||!el.value){ if(el) el.style.borderColor="var(--bad)"; return; } close(el.value); return; }
      const v=inp?inp.value.trim():""; if(o.required&&!v){inp.focus();inp.style.borderColor="var(--bad)";return;} close(v);} });
  d.addEventListener("keydown",e=>{ if(e.key==="Escape") close(null); }); }); }

/* ================= days ================= */
const dayKey=ms_=>{ const d=new Date(ms_); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function dayGroups(list){ const today=dayKey(Date.now()); const g={}; g[today]=[];
  list.forEach(x=>{ const k=dayKey(x.createdAt||Date.now()); (g[k]=g[k]||[]).push(x); });
  return Object.keys(g).sort().reverse().map(k=>{ const ts=g[k]; const done=ts.filter(x=>x.status==="done").length, nw=ts.filter(x=>x.status==="todo").length;
    const open=ts.length-done>0; return {k,ts,total:ts.length,done,nw,pend:ts.length-done-nw,open,past:k<today,today:k===today}; }); }
function dayLabel(k){ const [y,mo,d]=k.split("-").map(Number); const dt=new Date(y,mo-1,d); const today=dayKey(Date.now()); const yd=dayKey(Date.now()-864e5);
  return {main:new Intl.DateTimeFormat(loc(),{weekday:"long",day:"numeric",month:"long"}).format(dt),tag:k===today?t("dyToday"):k===yd?t("dyYesterday"):""}; }
const monthKey=k=>k.slice(0,7);
const monthName=mk=>{ const [y,m]=mk.split("-").map(Number); return new Intl.DateTimeFormat(loc(),{month:"long",year:"numeric"}).format(new Date(y,m-1,1)); };
const shiftMonth=(mk,n)=>{ const [y,m]=mk.split("-").map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
function dayBanner(){ const od=dayGroups(S.tasks).filter(g=>g.open&&g.past); if(!od.length) return "";
  const n=od.reduce((a,g)=>a+g.total-g.done,0); return `<div class="daybanner"><span>${esc(t("dyBanner",{d:od.length,n}))}</span><button class="btn sm" id="goDays">${esc(t("dyGo"))}</button></div>`; }
function bindBanner(){ const b=$("#goDays"); if(b) b.onclick=()=>{ const od=dayGroups(S.tasks).filter(g=>g.open&&g.past); if(od.length){ const k=od[od.length-1].k; S.dayMonth=monthKey(k); S.daySel=k; } setView("days"); }; }
function daysHTML(){ const todayK=dayKey(Date.now()), curM=monthKey(todayK);
  const gs=dayGroups(filtered()); const G={}; gs.forEach(g=>G[g.k]=g);
  if(!S.dayMonth) S.dayMonth=curM; if(S.dayMonth>curM) S.dayMonth=curM;
  const mk=S.dayMonth; if(!S.daySel||monthKey(S.daySel)!==mk) S.daySel=mk===curM?todayK:null;
  const oldOpen={}; gs.forEach(g=>{ const m=monthKey(g.k); if(m<curM&&g.open) oldOpen[m]=(oldOpen[m]||0)+g.total-g.done; });
  const firstM=gs.length?monthKey(gs[gs.length-1].k):curM;
  const [y,m]=mk.split("-").map(Number); const days=new Date(y,m,0).getDate(); const lead=(new Date(y,m-1,1).getDay()+1)%7;
  const wk=[...Array(7)].map((_,i)=>new Intl.DateTimeFormat(loc(),{weekday:"short"}).format(new Date(2024,0,6+i)));
  const cls=g=>!g||!g.total?"":!g.open?"closed":g.past?"late":"open";
  const inM=gs.filter(g=>monthKey(g.k)===mk); const mTot=inM.reduce((a,g)=>a+g.total,0), mDone=inM.reduce((a,g)=>a+g.done,0), mLate=inM.filter(g=>g.open&&g.past).length;
  let cells=wk.map(w=>`<div class="calh">${esc(w)}</div>`).join("")+`<div class="calc blank"></div>`.repeat(lead);
  for(let d=1;d<=days;d++){ const k=mk+"-"+String(d).padStart(2,"0"); const g=G[k]; const c=cls(g); const fut=k>todayK; const left=g?g.total-g.done:0;
    const L=dayLabel(k); const tip=L.main+(g&&g.total?" — "+t("dyCellDone",{d:g.done,n:g.total}):"");
    cells+=`<button type="button" class="calc ${fut?"future":(c||"none")}${k===todayK?" today":""}${k===S.daySel?" sel":""}" data-day="${k}"${fut?" disabled":""} title="${esc(tip)}" aria-label="${esc(tip)}">
      ${g&&g.total?`<span class="fill" style="height:${Math.round(g.done/g.total*100)}%"></span>`:""}<span class="dn">${d}</span>
      ${g&&g.total?`${left?`<span class="lf">${left}</span>`:`<span class="lf">✓</span>`}`:""}</button>`; }
  const mw=Object.keys(oldOpen).sort();
  const prev=LANG==="ar"?"›":"‹", next=LANG==="ar"?"‹":"›";
  const card=`<aside class="calcard">
    <div class="calhead"><button class="icbtn" data-mstep="-1"${mk<=firstM?" disabled":""} aria-label="${esc(t("dyPrevM"))}">${prev}</button><h2>${esc(monthName(mk))}</h2>
      ${mk!==curM?`<button class="nowbtn" data-mstep="0">${esc(t("dyThisM"))}</button>`:""}<button class="icbtn" data-mstep="1"${mk>=curM?" disabled":""} aria-label="${esc(t("dyNextM"))}">${next}</button></div>
    <div class="msum"><div><b>${mTot}</b><span>${esc(t("dyMTasks"))}</span></div><div><b style="color:var(--ok)">${mDone}</b><span>${esc(t("dyDone"))}</span></div><div><b style="color:${mLate?"var(--bad)":"var(--muted)"}">${mLate}</b><span>${esc(t("dyMLate"))}</span></div></div>
    ${mw.length?`<div class="mwarn">${mw.map(x=>`<button type="button" data-mgo="${x}">⚠ ${esc(t("dyOldMonth",{m:monthName(x),n:oldOpen[x]}))}</button>`).join("")}</div>`:""}
    <div class="cal">${cells}</div>
    <div class="mlegend"><span><i style="background:var(--warn)"></i>${esc(t("dyPillOpen"))}</span><span><i style="background:var(--bad)"></i>${esc(t("dyPillLate"))}</span><span><i style="background:var(--ok)"></i>${esc(t("dyPillClosed"))}</span></div>
  </aside>`;
  return `<div class="dlayout">${card}${dayPanel(S.daySel?G[S.daySel]||{k:S.daySel,ts:[],total:0,done:0,nw:0,pend:0,open:false,past:S.daySel<todayK}:null)}</div>`; }
function dayPanel(g){ if(!g) return `<section class="dpanel"><div class="dpempty"><b>${esc(t("dyPick"))}</b></div></section>`;
  const [y,mo,d]=g.k.split("-").map(Number); const dt=new Date(y,mo-1,d);
  const L=dayLabel(g.k); const c=!g.total?"empty":!g.open?"closed":g.past?"late":"open"; const pct=g.total?Math.round(g.done/g.total*100):0;
  const wd=new Intl.DateTimeFormat(loc(),{weekday:"long"}).format(dt), mn=new Intl.DateTimeFormat(loc(),{month:"long",year:"numeric"}).format(dt);
  const card=x=>`<button type="button" class="dpcard" data-id="${x.id}" title="${esc(x.title)}"><span class="ht">${esc(x.title)}</span><span class="dm"><span class="mono">${esc(keyOf(x))}</span><span style="color:${ST[x.status].c};font-weight:700">${esc(stL(x.status))}</span>${x.assignee?`<span style="flex:1"></span>${av(x.assignee)}<span class="nm">${esc(nameOf(x.assignee))}</span>`:""}</span></button>`;

  const nw=g.ts.filter(x=>x.status==="todo"), pend=g.ts.filter(x=>x.status!=="todo"&&x.status!=="done"), dn=g.ts.filter(x=>x.status==="done");
  const state={empty:t("dyEmpty"),closed:"✓ "+t("dyPillClosed"),late:"⚠ "+t("dyPillLate"),open:"⚠ "+t("dyPillOpen")}[c];
  const msg=c==="empty"?"":c==="closed"?t("dyClosed"):t(c==="late"?"dyLate":"dyOpen",{n:g.total-g.done});
  return `<section class="dpanel">
    <div class="dptop"><div class="dpnum">${d}</div><div class="dpname"><b>${esc(wd)}${L.tag?` <span class="chip info" style="vertical-align:middle">${esc(L.tag)}</span>`:""}</b><span>${esc(mn)}${msg?" — "+esc(msg):""}</span></div><span class="dpstate ${c}">${esc(state)}</span></div>
    ${g.total?`<div class="dpbar"><div><b>${g.total}</b><span>${esc(t("dyTotal"))}</span></div><div><b style="color:var(--muted)">${g.nw}</b><span>${esc(t("dyNew"))}</span></div><div><b style="color:var(--warn)">${g.pend}</b><span>${esc(t("dyPending"))}</span></div><div><b style="color:var(--ok)">${g.done}</b><span>${esc(t("dyDone"))}</span></div>
      <div><b>${pct}%</b><span>${esc(t("dyProgress"))}</span><div class="meter"><i style="width:${pct}%;background:var(--ok)"></i></div></div></div>
    <div class="dpcols">${col(t("dyNew"),"var(--muted)",nw)}${col(t("dyPending"),"var(--warn)",pend)}${col(t("dyDone"),"var(--ok)",dn)}</div>`
    :`<div class="dpempty"><span>${esc(t("dyNoTasksDay"))}</span>${g.past?"":`<button class="btn primary" id="dayNew">${esc(t("newTaskT"))}</button>`}</div>`}
  </section>`; }

function renderAuth(){ const m=$("#main"); const mode=S.authMode;
  if(mode==="reset"){ m.innerHTML=`<form class="gate" id="af"><h2>${esc(t("setPass"))}</h2><label class="lb">${esc(t("newPass"))}<input class="field" id="aPw" type="password" minlength="6" required autocomplete="new-password" dir="ltr"></label><p class="err" id="aErr" hidden></p><div><button class="btn primary">${esc(t("save"))}</button></div></form>`;
    $("#af").onsubmit=async e=>{ e.preventDefault(); const {error}=await S.sb.auth.updateUser({password:$("#aPw").value}); if(error){$("#aErr").hidden=false;$("#aErr").textContent=errText(error);return;} toast(t("passChanged")); S.authMode="login"; try{history.replaceState(null,"",location.pathname);}catch(x){}
      const {data}=await S.sb.auth.getSession(); S.session=data.session; S.uid=data.session?data.session.user.id:null; if(S.session) loadAll(); else render(); }; return; }
  m.innerHTML=`<form class="gate" id="af">
   <h2>${esc(t(mode==="signup"?"signUp":mode==="forgot"?"forgot":"signIn"))}</h2>
   ${mode==="forgot"?`<p>${esc(t("forgotHint"))}</p>`:`<div class="authswitch"><button type="button" data-m="login" aria-pressed="${mode==="login"}">${esc(t("signIn"))}</button><button type="button" data-m="signup" aria-pressed="${mode==="signup"}">${esc(t("signUp"))}</button></div>`}
   ${mode==="signup"?`<p>${esc(t("signUpHint"))}</p>
    <label class="lb">${esc(t("fullName"))}<input class="field" id="aName" required maxlength="60" autocomplete="name"></label>
    <label class="lb">${esc(t("hotel"))}<select class="field" id="aHotel" required>${hotelOpts("",t("chooseHotel"))}</select></label>
    <label class="lb">${esc(t("dept"))}<select class="field" id="aDept" required>${deptOpts("",t("chooseDept"))}</select></label>
    <label class="lb">${esc(t("jobTitle"))}<input class="field" id="aTitle" maxlength="60" placeholder="${esc(t("jobTitlePh"))}"></label>`:""}
   <label class="lb">${esc(t("email"))}<input class="field" id="aEmail" type="email" required autocomplete="email" dir="ltr"></label>
   ${mode!=="forgot"?`<label class="lb">${esc(t("password"))}<input class="field" id="aPw" type="password" minlength="6" required autocomplete="${mode==="signup"?"new-password":"current-password"}" dir="ltr"></label>`:""}
   <p class="err" id="aErr" hidden></p><p class="note ok" id="aOk" hidden></p>
   <div class="row" style="justify-content:space-between"><button class="btn primary" id="aBtn">${esc(t(mode==="signup"?"createBtn":mode==="forgot"?"sendLink":"signInBtn"))}</button>
    ${mode==="login"?`<button type="button" class="link" data-m="forgot">${esc(t("forgotQ"))}</button>`:mode==="forgot"?`<button type="button" class="link" data-m="login">${esc(t("back"))}</button>`:""}</div></form>`;
  m.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.authMode=b.dataset.m;renderAuth();});
  $("#af").onsubmit=async e=>{ e.preventDefault(); $("#aErr").hidden=true; $("#aOk").hidden=true;
    const email=$("#aEmail").value.trim(); const redirect=location.origin+location.pathname;
    if(mode==="signup"&&(!$("#aHotel").value||!$("#aDept").value)){ $("#aErr").hidden=false; $("#aErr").textContent=t("e_pickHotel"); return; }
    const btn=$("#aBtn"); btn.disabled=true; let r;
    if(mode==="login") r=await S.sb.auth.signInWithPassword({email,password:$("#aPw").value});
    else if(mode==="signup") r=await S.sb.auth.signUp({email,password:$("#aPw").value,options:{emailRedirectTo:redirect,data:{full_name:$("#aName").value.trim(),title:$("#aTitle").value.trim(),dept:$("#aDept").value,hotel:$("#aHotel").value}}});
    else r=await S.sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});
    btn.disabled=false;
    if(r.error){ $("#aErr").hidden=false; $("#aErr").textContent=errText(r.error); return; }
    if(mode==="signup"&&!r.data.session){ $("#aOk").hidden=false; $("#aOk").textContent=t("created"); }
    if(mode==="forgot"){ $("#aOk").hidden=false; $("#aOk").textContent=t("linkSent"); } }; }
function renderGate(){ const m=$("#main"); const me=S.me;
  if(!me){ m.innerHTML=`<div class="gate"><h2>${esc(t("setupTitle"))}</h2><p>${esc(t("setupTxt"))}</p></div>`; return; }
  if(!me.active){ m.innerHTML=`<div class="gate"><h2>${esc(t("disabledTitle"))}</h2><p>${esc(t("disabledTxt"))}</p></div>`; return; }
  if(S.builtView==="gate") return; S.builtView="gate";
  m.innerHTML=`<form class="gate" id="pf"><h2>${esc(t("pendingTitle"))}</h2><p>${esc(t("pendingTxt"))}</p>
   <div class="row meta">${me.hotel?`<span class="chip acc">${esc(hotelL(me.hotel))}</span>`:""}${me.dept?`<span class="chip">${esc(deptL(me.dept))}</span>`:""}</div>
   <label class="lb">${esc(t("yourName"))}<input class="field" id="pName" value="${esc(me.full_name)}" maxlength="60" required></label>
   <label class="lb">${esc(t("jobTitle"))}<input class="field" id="pTitle" value="${esc(me.title)}" maxlength="60"></label>
   <div><button class="btn">${esc(t("updateMe"))}</button></div></form>`;
  $("#pf").onsubmit=e=>{ e.preventDefault(); call(S.sb.rpc("update_my_profile",{p_name:$("#pName").value,p_title:$("#pTitle").value}),t("tSavedS")).catch(()=>{}); }; }

/* ================= board ================= */
function subBadge(x){ const kids=childrenOf(x.id); const par=x.parentId?T(x.parentId):null; const out=[];
  if(kids.length){ const d=kids.filter(k=>k.status==="done").length; out.push(`<span class="chip info">${esc(t("delegated",{d,n:kids.length}))}</span>`); }
  if(x.parentId) out.push(`<span class="chip">${esc(t("subOf",{k:par?keyOf(par):"#"+x.parentId}))}</span>`);
  if(x.transfer&&x.transfer.from) out.push(`<span class="chip info">↪ ${esc(t("trFrom",{n:nameOf(x.transfer.from),m:nameOf(x.assignee)}))}</span>`);
  if(x.noTransfer) out.push(`<span class="chip warn">${esc(t("lockedChip"))}</span>`);
  return out.length?`<div class="row">${out.join("")}</div>`:""; }
const ST_IC={todo:"○",progress:"▶",review:"⧗",rejected:"↩",done:"✓"};
function dueMeter(x){ if(!x.due||x.status==="done") return ""; const now=Date.now(), st=x.createdAt||now, span=Math.max(1,x.due-st), left=x.due-now;
  const pct=Math.max(4,Math.min(100,Math.round((now-st)/span*100))); const cls=left<0?"bad":left<6*36e5?"warn":"ok";
  return `<div class="dmeter ${cls}"><div class="dmbar"><i style="width:${left<0?100:pct}%"></i></div><span>${esc(left<0?t("bOver",{d:dur(-left)}):t("bLeft",{d:dur(left)}))}</span></div>`; }
function cardHTML(x){ const p=PRI[x.priority]||PRI.normal; const late=isLate(x)&&x.status!=="done"; const dragOk=STATUSES.some(s=>allowed(x,s.k));
  const meta=[deptL(x.dept),x.shift?t("sh_"+x.shift):""].filter(Boolean);
  const foot=x.status==="progress"&&x.startedAt?`<span class="bclock" title="${esc(t("workTime"))}">◷ ${esc(dur(workTime(x)))}</span>`:`<span class="bage">${esc(t("since"))} ${esc(dur(Date.now()-(x.statusAt||x.createdAt)))}</span>`;
  return `<article class="card bc${late?" late":""}" data-id="${x.id}" data-pri="${esc(x.priority)}" draggable="${dragOk}" tabindex="0">
   <div class="bctop"><span class="bkey">${esc(keyOf(x))}</span><span class="pri ${p.c}">${esc(priL(x.priority))}</span>${x.rejections?`<span class="pri bad">${esc(t("rejectedTimes",{n:x.rejections}))}</span>`:""}${isAdmin()&&x.hotel?`<span class="bhotel">${esc(hotelL(x.hotel))}</span>`:""}</div>
   <div class="t">${esc(x.title)}</div>
   ${x.location||meta.length?`<div class="bmeta">${x.location?`<span class="bloc">⌂ ${esc(x.location)}</span>`:""}${meta.map(m=>`<span>${esc(m)}</span>`).join("")}</div>`:""}
   ${subBadge(x)}${dueMeter(x)}
   <div class="bfoot">${who(x.assignee)}${foot}</div></article>`; }
function boardPulse(list){ const now=Date.now(), today=dayKey(now); const open=list.filter(x=>x.status!=="done");
  const late=open.filter(x=>isLate(x)).length, soon=open.filter(x=>x.due&&x.due>=now&&x.due-now<864e5).length;
  const doneT=list.filter(x=>x.status==="done"&&x.completedAt&&dayKey(x.completedAt)===today).length; const tot=list.length||1;
  const seg=STATUSES.map(s=>{ const n=list.filter(x=>x.status===s.k).length; return n?`<i style="flex:${n};background:${s.c}" title="${esc(stL(s.k))}: ${n}"></i>`:""; }).join("");
  const k=(n,l,c)=>`<div class="bk ${c}"><b>${n}</b><span>${esc(t(l))}</span></div>`;
  return `<div class="bpulse"><div class="bks">${k(open.length,"bpOpen","")}${k(late,"bpLate",late?"bad":"")}${k(soon,"bpSoon",soon?"warn":"")}${k(doneT,"bpDoneToday","ok")}</div>
   <div class="bdist"><div class="bstack">${seg||'<i style="flex:1;background:var(--line)"></i>'}</div><div class="blegend">${STATUSES.map(s=>{ const n=list.filter(x=>x.status===s.k).length; return `<span><em style="background:${s.c}"></em>${esc(stL(s.k))} <b>${Math.round(n/tot*100)}%</b></span>`; }).join("")}</div></div></div>`; }
function colHead(s,ts,total){ const late=ts.filter(x=>isLate(x)&&x.status!=="done").length; const pct=total?Math.round(ts.length/total*100):0;
  return `<div class="colhead"><span class="cic">${ST_IC[s.k]}</span><div class="cht"><b>${esc(stL(s.k))}</b>${late?`<small class="clate">${esc(t("bLateN",{n:late}))}</small>`:`<small>${pct}% ${esc(t("bOfAll"))}</small>`}</div><span class="cnt num">${ts.length}</span></div>`; }
const emptyBox=k=>`<div class="empty-col bempty"><span class="beic">${ST_IC[k]}</span><span>${esc(t("emp_"+k))}</span></div>`;
function boardHTML(){ const list=filtered();
  if(!S.tasks.length) return `<div class="gate" style="max-width:520px"><h2>${esc(t("noTasks"))}</h2><p>${esc(t("noTasksHint"))}</p><div><button class="btn primary" id="emptyNew">${esc(t("addFirst"))}</button></div></div>`;
  return boardPulse(list)+`<div class="board">${STATUSES.map(s=>{ let ts=list.filter(x=>x.status===s.k);
    if(s.k==="done"){ ts.sort((a,b)=>(b.completedAt||b.statusAt||0)-(a.completedAt||a.statusAt||0)); const lim=S.doneLimit||8; const shown=ts.slice(0,lim), more=ts.length-shown.length;
      return `<section class="col" data-st="done" style="--sc:${s.c}">${colHead(s,ts,list.length)}<div class="cbody">${shown.map(doneCardHTML).join("")||emptyBox("done")}
        ${more>0?`<button type="button" class="btn sm" id="doneMore">${esc(t("doneMore",{n:Math.min(more,20),m:more}))}</button>`:""}${lim>8?`<button type="button" class="link" id="doneLess" style="align-self:center">${esc(t("doneLess"))}</button>`:""}</div></section>`; }
    ts.sort((a,b)=>(PRI[a.priority]||PRI.normal).o-(PRI[b.priority]||PRI.normal).o||(a.due||9e15)-(b.due||9e15));
    return `<section class="col" data-st="${s.k}" style="--sc:${s.c}">${colHead(s,ts,list.length)}<div class="cbody">${ts.map(cardHTML).join("")||emptyBox(s.k)}</div></section>`; }).join("")}</div>`; }
function doneCardHTML(x){ return `<article class="card mini" data-id="${x.id}" data-pri="${esc(x.priority)}" draggable="${STATUSES.some(s=>allowed(x,s.k))}" tabindex="0" title="${esc(x.title)}">
   <div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:6px"><span class="bkey">${esc(keyOf(x))}</span><span class="mdone">✓ ${esc(x.completedAt?fmtD(x.completedAt):"")}</span></div>
   <div class="t">${esc(x.title)}</div><div class="row" style="gap:6px;flex-wrap:nowrap">${x.assignee?av(x.assignee):""}<span class="meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nameOf(x.assignee))}</span></div></article>`; }
function bindBoard(){ const m=$("#main"); const en=m.querySelector("#emptyNew"); if(en) en.onclick=()=>openTask(null);
  const dm=m.querySelector("#doneMore"); if(dm) dm.onclick=()=>{ S.doneLimit=(S.doneLimit||8)+20; renderMain(); }; const dl=m.querySelector("#doneLess"); if(dl) dl.onclick=()=>{ S.doneLimit=8; renderMain(); };
  m.querySelectorAll(".card").forEach(c=>{ c.onclick=()=>openTask(c.dataset.id); c.onkeydown=e=>{if(e.key==="Enter") openTask(c.dataset.id);};
    c.addEventListener("dragstart",e=>{ S.dragId=c.dataset.id; c.classList.add("dragging"); try{e.dataTransfer.setData("text/plain",c.dataset.id);}catch(x){}
      const x=T(S.dragId); m.querySelectorAll(".col").forEach(col=>{ if(col.dataset.st!==x.status&&!allowed(x,col.dataset.st)) col.classList.add("nodrop"); }); });
    c.addEventListener("dragend",()=>{ S.dragId=null; c.classList.remove("dragging"); m.querySelectorAll(".col").forEach(y=>y.classList.remove("drop","nodrop")); }); });
  m.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{ const x=T(S.dragId); if(x&&allowed(x,col.dataset.st)){e.preventDefault();col.classList.add("drop");} });
    col.addEventListener("dragleave",()=>col.classList.remove("drop"));
    col.addEventListener("drop",e=>{ e.preventDefault(); col.classList.remove("drop"); const x=T(S.dragId); if(x) requestTransition(x,col.dataset.st); }); }); }

/* ================= list ================= */
const LS_ST=["all","todo","progress","review","rejected","done","late"];
const lsMatch=(x,s)=>s==="all"?true:s==="late"?(isLate(x)&&x.status!=="done"):x.status===s;
function lsTop(){ const mode=S.lsMode||"tasks";
  return `<div class="lstop"><div class="seg" role="tablist">${["tasks","people"].map(k=>`<button role="tab" data-lsm="${k}" aria-selected="${mode===k}">${esc(t(k==="tasks"?"lsTasks":"lsPeople"))}</button>`).join("")}</div></div>`; }
function monthBar(mk,firstM,curM,allOn){ const prev=LANG==="ar"?"›":"‹", next=LANG==="ar"?"‹":"›";
  return `<div class="mbar"><button class="icbtn" data-lmstep="-1"${allOn||mk<=firstM?" disabled":""} aria-label="${esc(t("dyPrevM"))}">${prev}</button>
   <b class="mbname">${esc(allOn?t("lsAllM"):monthName(mk))}</b>
   <button class="icbtn" data-lmstep="1"${allOn||mk>=curM?" disabled":""} aria-label="${esc(t("dyNextM"))}">${next}</button>
   <button class="nowbtn${allOn?" off":""}" id="lmAll">${esc(allOn?t("dyThisM"):t("lsAllM"))}</button></div>`; }
function listHTML(){ const curM=monthKey(dayKey(Date.now())); const base=filtered();
  const firstM=base.length?monthKey(dayKey(Math.min(...base.map(x=>x.createdAt||Date.now())))):curM;
  if(!S.lsMonth) S.lsMonth=curM; if(S.lsMonth!=="all"&&S.lsMonth>curM) S.lsMonth=curM;
  if((S.lsMode||"tasks")==="people") return lsTop()+peopleHTML(base,firstM,curM);
  const allOn=S.lsMonth==="all"; const mk=allOn?curM:S.lsMonth;
  const inM=allOn?base:base.filter(x=>monthKey(dayKey(x.createdAt||Date.now()))===mk);
  const st=S.lsSt||"all"; const list=inM.filter(x=>lsMatch(x,st));
  const k=S.sort.k,d=S.sort.d;
  const val=x=>k==="key"?x.num:k==="priority"?(PRI[x.priority]||PRI.normal).o:k==="assignee"?nameOf(x.assignee):k==="status"?STATUSES.findIndex(s=>s.k===x.status):k==="work"?(workTime(x)||0):(x[k]||0);
  list.sort((a,b)=>{const x=val(a),y=val(b); return (typeof x==="string"?x.localeCompare(y,LANG):x-y)*d;});
  const grouped=k==="createdAt";
  const strip=`<div class="ststrip">${LS_ST.map(s=>{ const n=inM.filter(x=>lsMatch(x,s)).length; const c=s==="all"?"var(--fg)":s==="late"?"var(--bad)":ST[s].c;
     return `<button class="stb${st===s?" on":""}" data-lst="${s}" style="--c:${c}"><b>${n}</b><span>${esc(s==="all"?t("lsAll"):s==="late"?t("lsLate"):stL(s))}</span></button>`; }).join("")}</div>`;
  const th=(key,l)=>`<th class="sort${S.sort.k===key?" on":""}" data-k="${key}">${esc(t(l))}${S.sort.k===key?(S.sort.d>0?" ↑":" ↓"):""}</th>`;
  let rows="", last=null;
  list.forEach(x=>{ if(grouped){ const dk=dayKey(x.createdAt||Date.now()); if(dk!==last){ last=dk; const L=dayLabel(dk); const n=list.filter(y=>dayKey(y.createdAt||Date.now())===dk).length;
      rows+=`<tr class="grp"><td colspan="7"><span>${esc(L.main)}</span>${L.tag?` <em>${esc(L.tag)}</em>`:""}<i>${esc(t("lsCount",{n}))}</i></td></tr>`; } }
    const p=PRI[x.priority]||PRI.normal; const late=isLate(x)&&x.status!=="done"; const sub=[isAdmin()?hotelL(x.hotel):"",deptL(x.dept),x.location||""].filter(Boolean);
    rows+=`<tr class="click lrow${late?" late":""}" data-id="${x.id}"><td class="kcol">${esc(keyOf(x))}</td>
     <td class="tcol"><div class="t">${esc(x.title)}</div><div class="sub2">${sub.map(s=>`<span>${esc(s)}</span>`).join("")}${x.transfer&&x.transfer.from?`<span class="chip info">↪ ${esc(t("trFrom",{n:nameOf(x.transfer.from),m:nameOf(x.assignee)}))}</span>`:""}</div></td>
     <td class="acol">${who(x.assignee)}</td>
     <td><span class="stc" style="--c:${ST[x.status].c}">${esc(stL(x.status))}</span></td>
     <td><span class="pri ${p.c}">${esc(priL(x.priority))}</span></td>
     <td class="num dcol">${x.due?`<span class="${late?"lateTxt":""}">${esc(fmt(x.due))}</span>`:"—"}<div class="meta">${esc(t("colCreated"))}: ${esc(grouped?new Intl.DateTimeFormat(loc(),{hour:"numeric",minute:"2-digit"}).format(new Date(x.createdAt||Date.now())):fmt(x.createdAt))}</div></td>
     <td class="num wcol">${x.startedAt?dur(workTime(x)):"—"}</td></tr>`; });
  if(!rows) rows=`<tr><td colspan="7" class="lsempty">${esc(t("noMatch"))}</td></tr>`;
  return lsTop()+`<div class="lsbar">${monthBar(mk,firstM,curM,allOn)}${strip}</div>
  <div class="panel tablewrap lstable"><table><thead><tr>${th("key","colKey")}<th>${esc(t("colTask"))}</th>${th("assignee","colAssignee")}${th("status","colStatus")}${th("priority","colPri")}${th("due","colDue")}${th("work","colWork")}</tr></thead><tbody>${rows}</tbody></table></div>`; }
function peopleHTML(base,firstM,curM){ if(!S.pplEnd||S.pplEnd>curM) S.pplEnd=curM;
  const N=6, end=S.pplEnd; const months=[...Array(N)].map((_,i)=>shiftMonth(end,i-N+1));
  const M={}; base.forEach(x=>{ if(!x.assignee) return; const mk=monthKey(dayKey(x.createdAt||Date.now())); if(!months.includes(mk)) return;
    const r=M[x.assignee]=M[x.assignee]||{tot:0,done:0,late:0,m:{}}; const c=r.m[mk]=r.m[mk]||{n:0,d:0};
    c.n++; r.tot++; if(x.status==="done"){c.d++; r.done++;} if(isLate(x)&&x.status!=="done") r.late++; });
  const ids=Object.keys(M).sort((a,b)=>M[b].tot-M[a].tot||nameOf(a).localeCompare(nameOf(b),LANG));
  const mx=Math.max(1,...ids.flatMap(id=>Object.values(M[id].m).map(c=>c.n)));
  const colTot=months.map(mk=>ids.reduce((a,id)=>a+((M[id].m[mk]||{}).n||0),0));
  const short=mk=>{ const [y,m]=mk.split("-").map(Number); return new Intl.DateTimeFormat(loc(),{month:"short"}).format(new Date(y,m-1,1)); };
  const prev=LANG==="ar"?"›":"‹", next=LANG==="ar"?"‹":"›";
  const head=`<div class="mbar"><button class="icbtn" data-pstep="-1"${months[0]<=firstM?" disabled":""}>${prev}</button><b class="mbname">${esc(monthName(months[0]))} – ${esc(monthName(end))}</b><button class="icbtn" data-pstep="1"${end>=curM?" disabled":""}>${next}</button></div>`;
  const body=ids.map(id=>{ const r=M[id]; const p=S.profiles[id]||{}; const rate=r.tot?Math.round(r.done/r.tot*100):0;
    return `<tr><td class="pcol">${who(id)}<div class="meta">${esc([isAdmin()?hotelL(p.hotel):"",deptL(p.dept)].filter(Boolean).join(" / "))}</div></td>
     ${months.map(mk=>{ const c=r.m[mk]; if(!c) return `<td class="hc zero">—</td>`; const a=(0.12+0.6*c.n/mx).toFixed(2);
       return `<td class="hc"><button class="hcb" data-pid="${id}" data-pm="${mk}" style="--a:${a}" title="${esc(nameOf(id)+" — "+monthName(mk))}"><b>${c.n}</b><span>${esc(t("lsDoneN",{n:c.d}))}</span></button></td>`; }).join("")}
     <td class="ptot"><b>${r.tot}</b></td><td class="prate"><div class="rbar"><i style="width:${rate}%"></i></div><span>${rate}%${r.late?` <em>${esc(t("lsLateN",{n:r.late}))}</em>`:""}</span></td></tr>`; }).join("");
  return `<div class="lsbar">${head}<p class="lshint">${esc(t("lsPeopleHint"))}</p></div>
  <div class="panel tablewrap pptable"><table><thead><tr><th>${esc(t("lsPerson"))}</th>${months.map(mk=>`<th class="hc${mk===curM?" cur":""}">${esc(short(mk))}</th>`).join("")}<th class="ptot">${esc(t("lsTotal"))}</th><th>${esc(t("lsDoneRate"))}</th></tr></thead>
  <tbody>${body||`<tr><td colspan="${N+3}" class="lsempty">${esc(t("lsNoPeople"))}</td></tr>`}</tbody>
  ${ids.length?`<tfoot><tr><td>${esc(t("lsTotal"))}</td>${colTot.map(n=>`<td class="hc"><b>${n}</b></td>`).join("")}<td class="ptot"><b>${colTot.reduce((a,b)=>a+b,0)}</b></td><td></td></tr></tfoot>`:""}</table></div>`; }
function bindList(){ const m=$("#main"); m.querySelectorAll("tr.click").forEach(r=>r.onclick=()=>openTask(r.dataset.id));
  m.querySelectorAll("th.sort").forEach(h=>h.onclick=()=>{ if(S.sort.k===h.dataset.k) S.sort.d*=-1; else S.sort={k:h.dataset.k,d:-1}; renderMain(); });

function periodRange(kind,off){ const n=new Date(); let a,b;
  if(kind==="week"){ const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()); d.setDate(d.getDate()-((d.getDay()+1)%7)+off*7); a=d; b=new Date(d); b.setDate(b.getDate()+7); }
  else { a=new Date(n.getFullYear(),n.getMonth()+off,1); b=new Date(n.getFullYear(),n.getMonth()+off+1,1); }
  return {a:a.getTime(),b:b.getTime()}; }

const tgFor=(id,kind,r)=>{ const base=((S.targets||{})[id]||{}).target||0; const adj=(S.tAdj||[]).filter(a=>a.supervisor===id&&a.period===kind&&Math.abs(ms(a.period_start)-r.a)<36e5*13).reduce((p,a)=>p+a.extra,0); return base+adj; };
function supStats(sid,r,until){ const end=until?Math.min(until,r.b):r.b; const ts=S.tasks.filter(x=>(x.createdAt||0)>=r.a&&(x.createdAt||0)<end&&supOwns(sid,x));
  const done=ts.filter(x=>x.status==="done"); const late=ts.filter(x=>isLate(x)&&x.status!=="done").length;
  const wk=done.map(workTime).filter(v=>v!=null); const st=ts.filter(x=>x.startedAt).map(x=>x.startedAt-(x.createdAt||x.startedAt));
  const wd=done.filter(x=>x.due); const ot=wd.filter(x=>(x.completedAt||0)<=x.due).length;
  const avg=a=>a.length?a.reduce((p,c)=>p+c,0)/a.length:null;
  const team={}; ts.forEach(x=>{ if(!x.assignee) return; const k=x.assignee; const o=team[k]=team[k]||{n:0,d:0}; o.n++; if(x.status==="done") o.d++; });
  return {n:ts.length,d:done.length,late,open:ts.length-done.length,avgWork:avg(wk),avgStart:avg(st),onTime:wd.length?Math.round(ot/wd.length*100):null,team}; }

    const tgt=tg?tgFor(id,kind,r):0; const extra=tg?tgt-tg.target:0; const pct=tg&&tgt?Math.round(st.d/tgt*100):null; const load=tg&&tgt?Math.round(st.n/tgt*100):null; const col=pct==null?"var(--line)":pct>=100?"var(--ok)":pct>=60?"var(--warn)":"var(--bad)";

  const recv=activeMembers().filter(u=>{ const q=S.profiles[u]; if(u===id||q.hotel!==p.hotel) return false; if(isManager()) return u===S.uid||(q.role==="supervisor"&&inScope(u)); return ["supervisor","manager","gm"].includes(q.role); })
    .sort((a,b)=>((S.profiles[b].dept===p.dept)-(S.profiles[a].dept===p.dept))||nameOf(a).localeCompare(nameOf(b),LANG));
  let split=""; if(tg){ const r=periodRange(tg.period,0); const now=Date.now(); const kept=Math.max(0,Math.round(tg.target*(now-r.a)/(r.b-r.a))); split=`<div class="dmsplit"><div><b>${tg.target}</b><span>${esc(t("dmFull"))}</span></div><div><b>${kept}</b><span>${esc(t("dmKept",{n:nameOf(id)}))}</span></div><div><b>${tg.target-kept}</b><span>${esc(t("dmGiven"))}</span></div></div>`; }
  const html=`<div class="dmbox"><div class="dmrow"><b>${open.length}</b><span>${esc(t("dmOpen"))}</span></div>${split}
    <label class="lb">${esc(t("dmWho"))}<select class="field" id="dmTo"><option value="">${esc(t("mgrPick"))}</option>${recv.map(u=>opt(u,nameOf(u)+" — "+roleL(S.profiles[u].role)+(S.profiles[u].dept?" / "+deptL(S.profiles[u].dept):""),"")).join("")}</select></label>
    <p class="meta" style="margin:0">${esc(t("dmNote"))}</p></div>`;
  const to=await ask({title:t("dmTitle",{n:nameOf(id)}),html,noInput:true,pick:"#dmTo",okText:t("dmGo")}); if(!to) return false;
  try{ const r=await call(S.sb.rpc("demote_supervisor",{p_sup:id,p_to:to})); toast(t("dmDone",{n:(r&&r.data)||0,m:nameOf(to)})); return true; }catch(e){ return false; } }

/* ================= task sheet ================= */
function assigneeOptions(hotel,cur,par,isNew){ let list=activeMembers().filter(id=>canAssignTo(id,hotel));
  if(par&&isNew&&par.assignee===S.uid&&subordinates().length) list=list.filter(id=>id!==S.uid);
  if(cur&&!list.includes(cur)) list.push(cur);
  return opt("",t("unassigned"),cur||"")+list.map(id=>{const p=S.profiles[id]; return opt(id,nameOf(id)+(p&&p.dept?" — "+deptL(p.dept):"")+(p&&["manager","supervisor","gm"].includes(p.role)?" ("+roleL(p.role)+")":"")+(isAdmin()&&!hotel&&p&&p.hotel?" · "+hotelL(p.hotel):""),cur||"");}).join(""); }
function openTask(id,parentId){ const x=id?T(id):null; if(id&&!x) return; closeSheet(); S.openId=x?x.id:null; S.newParent=x?null:(parentId||null); S.thread={comments:[],events:[]};
  const par=x?(x.parentId?T(x.parentId):null):(parentId?T(parentId):null);
  const ov=document.createElement("div"); ov.className="overlay"; ov.id="ov";
  const ed=canEditFields(x), dis=ed?"":" disabled";
  const hotel=x?x.hotel:(par?par.hotel:(isAdmin()?(S.f.hotel||""):myHotel()));
  const cur=x?x.assignee||"":((isAdmin()||isGM()||isSup()||(isManager()&&subordinates().length))?"":S.uid);
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t("taskDetails"))}">
   <div class="sheethead wrap"><span class="mono meta">${x?esc(keyOf(x)):"+"}</span><h3>${esc(t(x?"taskDetails":par?"delegateT":"newTaskT"))}</h3>${x&&canEditFields(x)?`<button class="btn ghost sm" id="delT" style="color:var(--bad)">${esc(t("del"))}</button>`:""}<button class="btn" id="closeT">${esc(t("close"))}</button></div>
   <div class="sheetbody wrap"><form class="form" id="tf">
     ${par?`<div class="note info">${esc(t("partOf"))} <b class="mono">${esc(keyOf(par))}</b>: ${esc(par.title)} <button type="button" class="link" id="openPar">${esc(t("open"))}</button></div>`:""}
     <input class="field title" id="fTitle" placeholder="${esc(t("titlePh"))}" value="${esc(x?x.title:"")}" maxlength="140" required${dis}>
     <textarea class="field" id="fDesc" placeholder="${esc(t("descPh"))}"${dis}>${esc(x?x.desc:"")}</textarea>
     <div class="two">
      ${isAdmin()&&!x&&!par?`<label class="lb">${esc(t("hotel"))}<select class="field" id="fH" required>${hotelOpts(hotel,t("chooseHotel"))}</select></label>`:(isAdmin()?`<label class="lb">${esc(t("hotel"))}<input class="field" value="${esc(hotelL(hotel))}" disabled></label>`:"")}
      <label class="lb">${esc(t("dept"))}<select class="field" id="fD"${dis}>${deptOpts(x?x.dept:(par?par.dept:myDept()),"—")}</select></label>
      <label class="lb">${esc(t("location"))}<input class="field" id="fLoc" placeholder="${esc(t("locationPh"))}" value="${esc(x?x.location:"")}" maxlength="60"${dis}></label>
      <label class="lb">${esc(t("assignee"))}<select class="field" id="fA"${dis}>${assigneeOptions(hotel,cur,par,!x)}</select></label>
      <label class="lb">${esc(t("priority"))}<select class="field" id="fP"${dis}>${Object.keys(PRI).map(k=>opt(k,priL(k),x?x.priority:"normal")).join("")}</select></label>
      <label class="lb">${esc(t("dueAt"))}<input class="field" type="datetime-local" id="fDue" value="${toLocal(x&&x.due)}"${dis}></label>
      <label class="lb">${esc(t("shift"))}<select class="field" id="fSh"${dis}>${SHIFTS.map(k=>opt(k,t("sh_"+k),x?x.shift:"")).join("")}</select></label>
      <label class="lb">${esc(t("estimate"))}<input class="field num" type="number" min="0" step="0.25" id="fEst" value="${x&&x.estimate!=null?x.estimate:""}"${dis}></label>
      <label class="chk" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="fNA"${(!x||x.needsApproval!==false)?" checked":""}${dis}> ${esc(t("needsAppr"))}</label>
      <label class="chk" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="fNT"${x&&x.noTransfer?" checked":""}${dis}> ${esc(t("noTransfer"))}</label></div>
     ${ed?`<div class="actions"><button class="btn primary" type="submit" id="saveT">${esc(t(x?"saveChanges":"create"))}</button>${x?"":`<button class="btn" type="button" id="cancelT">${esc(t("cancel"))}</button>`}</div>`:`<p class="meta" style="margin:0">${esc(t("editOnly"))}</p>`}
     ${x?transferBox(x):""}
     ${x?subtasksBox(x):""}
     ${x?`<div class="box"><h4>${esc(t("comments"))}</h4><div class="comments" id="cmList"><div class="meta">${esc(t("loading"))}</div></div>
       <div style="display:grid;gap:6px"><textarea class="field" id="cmIn" rows="2" placeholder="${esc(t("commentPh"))}" style="min-height:60px" maxlength="2000"></textarea><div><button class="btn sm" type="button" id="cmSend">${esc(t("addComment"))}</button></div></div></div>`:""}
    </form><aside class="side" id="sideP"></aside></div></div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  ov.addEventListener("click",e=>{ if(e.target===ov) closeSheet(); });
  ov.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!document.querySelector(".dlg")) closeSheet(); });
  $("#closeT").onclick=closeSheet; const c=$("#cancelT"); if(c) c.onclick=closeSheet;
  const fh=$("#fH"); if(fh) fh.onchange=()=>{ $("#fA").innerHTML=assigneeOptions(fh.value,"",null,true); };
  const dl=$("#delT"); if(dl) dl.onclick=async()=>{ const ok=await ask({title:t("delDlg",{k:keyOf(x)}),text:t("delDlgT"),noInput:true,okText:t("delOk"),danger:true}); if(ok==null) return;
    const r=await call(S.sb.from("tasks").delete().eq("id",x.id).select("id")).catch(()=>null); if(r&&r.data&&r.data.length){ toast(t("tDeleted")); closeSheet(); await loadTasks(); render(); } else if(r) toast(t("e_not_allowed"),true); };
  $("#tf").addEventListener("submit",saveTask); const cs=$("#cmSend"); if(cs) cs.onclick=addComment;
  const op=$("#openPar"); if(op) op.onclick=()=>openTask(par.id);
  const dg=$("#delegateBtn"); if(dg) dg.onclick=()=>openTask(null,x.id);
  const tb=$("#trBtn"); if(tb) tb.onclick=()=>doTransfer(x);
  ov.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>openTask(b.dataset.sub));
  renderSheetSide(); if(x) loadThread(x.id); else setTimeout(()=>{ const f=$("#fTitle"); if(f) f.focus(); },30); }
function canTransfer(x){ if(x&&x.noTransfer&&!(isAdmin()||(isGM()&&x.hotel===myHotel())||x.reporter===S.uid)) return false; return !!x&&x.status!=="done"&&myRole()!=="staff"&&(isAdmin()||(isGM()&&x.hotel===myHotel())||x.assignee===S.uid||x.reporter===S.uid||(x.assignee&&isAbove(S.uid,x.assignee))||(x.assignee&&isDeptBoss(x.assignee))); }
function transferTargets(x){ return activeMembers().filter(id=>id!==x.assignee&&S.profiles[id].role!=="admin"&&S.profiles[id].hotel===x.hotel&&canAssignTo(id,x.hotel)); }
function transferBox(x){ const info=x.transfer&&x.transfer.from?`<div class="note info">↪ ${esc(t("trInfo",{f:nameOf(x.transfer.from),t:nameOf(x.assignee),b:nameOf(x.transfer.by)}))} · <span class="num">${esc(fmt(x.transfer.at))}</span></div>`:"";
  const lockN=x.noTransfer?`<div class="note">${esc(t("lockedNote"))}</div>`:"";
  const list=canTransfer(x)?transferTargets(x):[];
  if(!list.length) return info+lockN;
  return `${info}${lockN}<div class="box"><h4>${esc(t("trTitle"))}</h4><div class="meta">${esc(t("trHint"))}</div>
   <div class="row"><select class="field" id="trTo" style="flex:1 1 200px;width:auto"><option value="">${esc(t("trTo"))}</option>${list.map(id=>{const p=S.profiles[id]; return opt(id,nameOf(id)+(p.dept?" — "+deptL(p.dept):"")+(["manager","supervisor","gm"].includes(p.role)?" ("+roleL(p.role)+")":""),"");}).join("")}</select>
   <input class="field" id="trNote" placeholder="${esc(t("trNote"))}" maxlength="300" style="flex:2 1 200px;width:auto"><button type="button" class="btn primary" id="trBtn">${esc(t("trBtn"))}</button></div></div>`; }
async function doTransfer(x){ const to=$("#trTo").value; if(!to){ $("#trTo").focus(); return; } const b=$("#trBtn"); b.disabled=true;
  try{ await call(S.sb.rpc("transfer_task",{p_id:x.id,p_to:to,p_note:$("#trNote").value.trim()||null}),t("trDone",{n:nameOf(to)})); await loadTasks(); render(); if(T(x.id)) openTask(x.id); else closeSheet(); }catch(e){ b.disabled=false; } }
function subtasksBox(x){ const kids=childrenOf(x.id);
  const canDel=false&&(x.assignee===S.uid||x.reporter===S.uid||isAdmin()||(isSup()&&x.hotel===myHotel()))&&x.status!=="done"&&(isAdmin()||isSup()||(isManager()&&subordinates().length>0));
  if(!kids.length&&!canDel) return ""; const d=kids.filter(k=>k.status==="done").length;
  return `<div class="box"><div class="row" style="justify-content:space-between"><h4>${esc(t("subtasks"))} ${kids.length?`<span class="num">${esc(t("subDone",{d,n:kids.length}))}</span>`:""}</h4>${canDel?`<button type="button" class="btn sm" id="delegateBtn" title="${esc(t("splitHint"))}">${esc(t("delegateBtn"))}</button>`:""}</div>
   ${kids.length?`<div class="meter" style="width:100%"><i style="width:${d/kids.length*100}%;background:var(--ok)"></i></div><div style="display:grid;gap:6px">${kids.map(k=>`<button type="button" class="hit" data-sub="${k.id}"><span class="mono meta">${esc(keyOf(k))}</span><span class="ht">${esc(k.title)}</span>${who(k.assignee)}<span class="chip" style="color:${ST[k.status].c}">${esc(stL(k.status))}</span></button>`).join("")}</div>`:`<div class="meta">${esc(t("splitHint"))}</div>`}</div>`; }
function closeSheet(){ const o=$("#ov"); if(o) o.remove(); document.body.style.overflow=""; S.openId=null; }
async function saveTask(e){ e.preventDefault(); const x=S.openId?T(S.openId):null; const title=$("#fTitle").value.trim(); if(!title){$("#fTitle").focus();return;}
  const dueV=$("#fDue").value, est=$("#fEst").value;
  const p={title,descr:$("#fDesc").value.trim(),dept:$("#fD").value,location:$("#fLoc").value.trim(),assignee:$("#fA").value||"",priority:$("#fP").value,
    due:dueV?new Date(dueV).toISOString():"",shift:$("#fSh").value,estimate:est===""?"":String(Number(est)),needs_approval:$("#fNA").checked,no_transfer:$("#fNT").checked};
  if(!x&&S.newParent) p.parent_id=String(S.newParent);
  const fh=$("#fH"); if(!x&&fh){ const hv=fh.value||(p.assignee&&S.profiles[p.assignee]?S.profiles[p.assignee].hotel:""); if(!hv){ toast(t("e_hotel_required"),true); return; } p.hotel=hv; }
  const btn=$("#saveT"); if(btn) btn.disabled=true;
  try{ if(!x){ const parId=S.newParent; const r=await call(S.sb.rpc("create_task",{p})); const k=(S.settings.prefix||"HTL")+"-"+String(r.data).padStart(3,"0");
      toast(t(parId?"tDelegated":"tCreated",{k})); closeSheet(); await loadTasks(); render(); if(parId) openTask(parId); return; }
    await call(S.sb.rpc("update_task",{p_id:x.id,p}),t("tSaved")); loadThread(x.id); await loadTasks(); render(); }catch(err){} finally{ if(btn) btn.disabled=false; } }
async function addComment(){ const id=S.openId; const inp=$("#cmIn"); const body=inp.value.trim(); if(!id||!body) return; inp.value="";
  try{ await call(S.sb.from("task_comments").insert({task_id:id,author:S.uid,body})); loadThread(id); }catch(e){ inp.value=body; } }
function evText(h){ let s=t("ev_"+h.action)||h.action;
  if(h.action==="transfer"){ const [ft,rest]=String(h.note||"").split(">"); const [to,...nt]=String(rest||"").split("|"); s+=": "+(ft?nameOf(ft)+(LANG==="ar"?" ← ":" → "):"")+nameOf(to); if(h.to_status&&h.from_status!==h.to_status) s+=" ("+stL(h.to_status)+")"; if(nt.length) s+=" — "+nt.join("|"); return s; }
  if(h.to_status&&h.action!=="create") s+=" → "+stL(h.to_status);
  if(h.note){ const n=(h.action==="edit"||h.action==="assign")?h.note.split(/[,،]\s*/).map(f=>I18N.en["f_"+f]?t("f_"+f):f).join(", "):h.note; s+=": "+n; }
  return s; }
function renderSheetSide(){ const side=$("#sideP"); if(!side) return; const x=S.openId?T(S.openId):null;
  if(!x){ if(S.openId){ closeSheet(); toast(t("tGone")); return; } side.innerHTML=`<div class="box"><h4>${esc(t("flow"))}</h4><div class="meta" style="line-height:1.9">${t("flowTxt")}</div></div>`; return; }
  const st=ST[x.status]; const acts=STATUSES.filter(s=>allowed(x,s.k)); const now=Date.now(); const late=isLate(x);
  side.innerHTML=`<div class="box"><h4>${esc(t("status"))}</h4><div class="statusline"><span style="width:10px;height:10px;border-radius:50%;background:${st.c}"></span>${esc(stL(x.status))}<span class="meta" style="font-weight:400;font-size:12.5px">${esc(t("since"))} ${dur(now-(x.statusAt||x.createdAt))}</span></div>
    ${acts.length?`<div class="actions">${acts.map(s=>`<button class="btn sm ${s.k==="done"?"ok":s.k==="rejected"?"bad":s.k==="review"?"primary":""}" data-to="${s.k}">${esc(actLabel(x,s.k))}</button>`).join("")}</div>`:`<div class="meta">${esc(x.assignee===S.uid||canApprove(x)?t("noActions"):t("assignedTo",{n:nameOf(x.assignee)}))}</div>`}
    ${x.status==="rejected"&&x.lastReject?`<div class="note bad"><b>${esc(t("rejReason"))}:</b> ${esc(x.lastReject.note)}<div class="meta" style="margin-top:4px">${esc(nameOf(x.lastReject.by))} · ${esc(fmt(x.lastReject.at))}</div></div>`:""}
    ${x.status==="done"&&x.approval?`<div class="note ok">${esc(t("approvedBy",{n:nameOf(x.approval.by)}))} · ${esc(fmt(x.approval.at))}${x.approval.note?`<div style="margin-top:4px">${esc(x.approval.note)}</div>`:""}</div>`:""}
    ${late&&x.status!=="done"?`<div class="note bad">${esc(t("lateBy",{d:dur(now-x.due)}))}</div>`:""}</div>
   <div class="box"><h4>${esc(t("time"))}</h4><dl class="kv"><dt>${esc(t("createdBy"))}</dt><dd>${who(x.reporter)}</dd><dt>${esc(t("createdAt"))}</dt><dd>${esc(fmt(x.createdAt))}</dd><dt>${esc(t("startedAt"))}</dt><dd>${esc(fmt(x.startedAt))}</dd>
    <dt>${esc(t("submittedAt"))}</dt><dd>${esc(fmt(x.submittedAt))}</dd><dt>${esc(t("completedAt"))}</dt><dd>${esc(fmt(x.completedAt))}</dd><dt>${esc(t("dueReq"))}</dt><dd style="${late?"color:var(--bad);font-weight:600":""}">${esc(fmt(x.due))}</dd>
    <dt>${esc(t("startDelay"))}</dt><dd>${x.startedAt?dur(x.startedAt-x.createdAt):"—"}</dd><dt>${esc(t("workT"))}</dt><dd><b>${x.startedAt?dur(workTime(x)):"—"}</b>${x.estimate?` <span class="meta">/ ${esc(t("est",{h:x.estimate}))}</span>`:""}</dd><dt>${esc(t("rejCount"))}</dt><dd>${x.rejections||0}</dd></dl></div>
   <div class="box"><h4>${esc(t("activity"))}</h4><div class="hist">${S.thread.events.slice().reverse().map(h=>`<div><span class="dt"></span><span><b>${esc(nameOf(h.actor))}</b> ${esc(evText(h))}<br><span class="num">${esc(fmt(ms(h.created_at)))}</span></span></div>`).join("")||`<span class="meta">—</span>`}</div></div>`;
  side.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>requestTransition(T(x.id),b.dataset.to));
  const cl=$("#cmList"); if(cl){ const cs=S.thread.comments; cl.innerHTML=cs.map(c=>`<div class="cm">${av(c.author)}<div><div class="h"><b style="color:var(--fg)">${esc(nameOf(c.author))}</b> · <span class="num">${esc(fmt(ms(c.created_at)))}</span></div><div class="b">${esc(c.body)}</div></div></div>`).join("")||`<div class="meta">${esc(t("noComments"))}</div>`; cl.scrollTop=cl.scrollHeight; } }

/* ================= boot ================= */
function boot(){
  applyLangChrome();
  const h=(location.hash||"").slice(1); if(["board","days","list","approvals","reports","team","depts"].includes(h)) S.view=h; { const mt=/^t=(\d+)$/.exec(h); if(mt) S.pendingOpen=+mt[1]; }
  if(!window.supabase||!CFG.SUPABASE_URL||CFG.SUPABASE_URL.includes("YOUR-PROJECT")){ $("#main").innerHTML=`<div class="gate"><h2>${esc(t("cfgTitle"))}</h2><p>${esc(t("cfgTxt"))}</p></div>`; return; }
  const tfetch=(u,o={})=>{ const c=new AbortController(); const tm=setTimeout(()=>c.abort(),20000); if(o.signal){ if(o.signal.aborted) c.abort(); else o.signal.addEventListener("abort",()=>c.abort()); } return fetch(u,Object.assign({},o,{signal:c.signal})).finally(()=>clearTimeout(tm)); };
  S.sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},global:{fetch:tfetch},realtime:{heartbeatIntervalMs:15000}});
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) heal("visible"); });
  window.addEventListener("online",()=>heal("online"));
  window.addEventListener("focus",()=>heal("focus"));
  loadMeta().then(()=>{ if(!S.session) render(); });
  S.sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){ S.authMode="reset"; S.session=null; setTimeout(render,0); return; }
    if(S.authMode==="reset"&&ev!=="SIGNED_OUT") return;
    const prev=S.uid; S.session=session; S.uid=session?session.user.id:null;
    if(!session){ S.ready=false; setTimeout(render,0); return; }
    if(prev!==S.uid||!S.ready) setTimeout(loadAll,0); });
  setInterval(()=>{ if(S.ready&&isMember()&&S.view!=="team"&&S.view!=="reports"&&!document.querySelector(".dlg")&&!S.dragId){ renderMain(); renderSheetSide(); } },60000);
}
boot();
})();
</script>
